<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">What Makes Speech Upright When Admitting Error Is Hard?</title><desc id="d">Navy and gold symbolic cover for a reflection on Al-Ahzab 33:70–71, showing clear speech opening a path to correct a decision built on wrong information.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081b33"/><stop offset="1" stop-color="#173b5c"/></linearGradient><radialGradient id="glow"><stop stop-color="#f2cc72" stop-opacity=".45"/><stop offset="1" stop-color="#f2cc72" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><circle cx="600" cy="315" r="255" fill="url(#glow)"/><path d="M160 115 H1040 M160 515 H1040" stroke="#d9ad4f" stroke-width="4" opacity=".55"/><path d="M205 220 H500 Q550 220 550 270 V335 Q550 385 500 385 H410 L325 455 345 385 H205 Q155 385 155 335 V270 Q155 220 205 220Z" fill="#e7edf5" opacity=".96"/><path d="M700 195 H975 Q1025 195 1025 245 V310 Q1025 360 975 360 H895 L815 425 835 360 H700 Q650 360 650 310 V245 Q650 195 700 195Z" fill="#f4d784"/><path d="M275 295 H455 M730 270 H945" stroke="#173b5c" stroke-width="22" stroke-linecap="round"/><path d="M525 455 C650 455 690 510 850 500" fill="none" stroke="#d9ad4f" stroke-width="26" stroke-linecap="round"/><path d="M830 475 L875 500 835 530" fill="none" stroke="#fff4c7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="525" cy="455" r="34" fill="#f4d784" stroke="#fff4c7" stroke-width="8"/></svg>