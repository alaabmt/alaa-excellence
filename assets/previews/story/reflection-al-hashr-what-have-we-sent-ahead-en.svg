<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">What Have We Sent Ahead Before Tomorrow Arrives?</title><desc id="d">Navy and gold symbolic cover for a reflection on Al-Hashr 59:18, showing a path toward tomorrow and the call to examine what we send ahead.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081b33"/><stop offset="1" stop-color="#173b5c"/></linearGradient><radialGradient id="g"><stop stop-color="#f2cc72" stop-opacity=".7"/><stop offset="1" stop-color="#f2cc72" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><circle cx="910" cy="190" r="150" fill="url(#g)"/><path d="M110 510 C330 420 480 450 650 330 S920 200 1090 150" fill="none" stroke="#d9ad4f" stroke-width="28" stroke-linecap="round"/><path d="M1030 125 L1100 145 1060 210" fill="none" stroke="#fff4c7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="450" r="42" fill="#e7edf5"/><circle cx="475" cy="415" r="34" fill="#f4d784"/><circle cx="665" cy="320" r="27" fill="#e7edf5"/><path d="M120 110 H1080 M120 535 H1080" stroke="#d9ad4f" stroke-width="4" opacity=".5"/></svg>