<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تقرير التعلّم | Tamayuz 10X</title><script src="/assets/js/auth-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#15324b;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.toolbar{max-width:794px;margin:20px auto;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar a,.toolbar button{background:#15324b;color:white;padding:9px 18px;border:0;border-radius:8px;text-decoration:none;font:inherit}.toolbar a[hidden],button[hidden]{display:none}#status{flex-basis:100%;margin:0}#report{max-width:794px;margin:auto}.sheet{width:794px;min-height:1123px;background:white;padding:42px 48px;margin:0 auto 24px;position:relative;border-top:12px solid #17636b}.brand{font-size:18px;font-weight:bold;color:#17636b}.eyebrow{font-size:13px;letter-spacing:1px;color:#607888;margin-top:30px}h1{font-size:32px;line-height:1.5;margin:8px 0 14px}h2{font-size:23px;margin:26px 0 12px}h3{font-size:17px;margin:0 0 6px}p{margin:8px 0 14px}.muted{color:#607180;font-size:14px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}.score{border:1px solid #dce6ea;border-radius:12px;padding:18px;border-top:5px solid var(--accent)}.score strong{font-size:34px;color:var(--accent);display:block;direction:ltr;text-align:start}.bar{background:#eef1f3;height:9px;border-radius:8px;margin-top:12px}.bar span{display:block;background:var(--accent);height:9px;border-radius:8px}.note{background:#eff6f5;border-inline-start:4px solid #17636b;padding:15px 18px;border-radius:6px;font-size:14px}.guidance{padding:15px 18px;margin:14px 0;border:1px solid #dce6ea;border-inline-start:5px solid var(--accent);border-radius:8px}.footer{border-top:1px solid #dce6ea;margin-top:28px;padding-top:12px;font-size:12px;color:#607180;display:flex;justify-content:space-between;gap:10px}#pdfPreview{width:100%;height:800px;border:0}details{max-width:794px;margin:20px auto}summary{cursor:pointer;padding:12px}button:disabled{opacity:.6}
@media(max-width:820px){#report{overflow:auto}.sheet{margin-inline:0}.toolbar{margin:10px}}
@media print{body{background:white}.toolbar,details{display:none}.sheet{margin:0;break-after:page;box-shadow:none}.sheet:last-child{break-after:auto}@page{size:A4;margin:0}}
</style></head><body><nav class="toolbar"><a id="account" href="/account/">حسابي</a><a id="download" hidden>تنزيل PDF</a><button id="retry" hidden>إعادة المحاولة</button><p id="status" role="status">جارٍ تحميل التقرير…</p></nav><main id="report"></main><details id="previewBox" hidden><summary id="previewLabel">معاينة ملف PDF المحفوظ</summary><iframe id="pdfPreview" title="PDF report"></iframe></details><script type="module" src="/assets/js/saved-assessment-report.js"></script></body></html>
