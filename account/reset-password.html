<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset password | Tamayuz 10X</title><link rel="stylesheet" href="/assets/css/style.css"><style>body{background:#f5f7fa}.auth-shell{width:min(520px,calc(100% - 32px));margin:8vh auto}.auth-card{background:#fff;border:1px solid #dfe6ee;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(20,45,75,.08)}.auth-card h1{margin-top:0;color:#0b2545}.auth-card label{display:block;margin:14px 0 6px;font-weight:700}.auth-card input{width:100%;padding:12px 13px;border:1px solid #cfd9e4;border-radius:11px;font:inherit}.auth-card button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:11px;background:#0b2545;color:#fff;font:inherit;font-weight:800;cursor:pointer}.status{min-height:1.5em;margin-top:12px}.brand{text-align:center;margin-bottom:16px}.brand img{height:58px;max-width:220px;object-fit:contain}</style><script src="/assets/js/auth-config.js"></script></head><body><main class="auth-shell"><div class="brand"><a href="/"><img src="/assets/images/file_0000000047188210ac6952e999d2eda7.png" alt="Tamayuz 10X"></a></div><section class="auth-card"><h1 id="title">Reset password</h1><p id="intro">Enter your email and we will send you a secure reset link.</p><form id="form"><label id="emailLabel" for="email">Email</label><input id="email" type="email" autocomplete="email" required><button id="submit" type="submit">Send reset link</button><p class="status" id="status" role="status" aria-live="polite"></p></form><p><a id="loginLink" href="/account/login.html">Back to sign in</a></p></section></main><script type="module">import{authConfigured,createAuthClient}from'/assets/js/assessment-auth-client.js';const p=new URLSearchParams(location.search),lang=p.get('lang')==='ar'?'ar':'en';if(lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.title='إعادة تعيين كلمة المرور | التميّز 10X';title.textContent='إعادة تعيين كلمة المرور';intro.textContent='أدخل بريدك الإلكتروني وسنرسل لك رابطًا آمنًا لإعادة تعيين كلمة المرور.';emailLabel.textContent='البريد الإلكتروني';submit.textContent='إرسال رابط إعادة التعيين';loginLink.textContent='العودة إلى تسجيل الدخول';}if(!authConfigured()){status.textContent=lang==='ar'?'خدمة تسجيل الدخول غير متاحة مؤقتًا.':'The sign-in service is temporarily unavailable.';submit.disabled=true;}else{const client=await createAuthClient();form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;const redirectTo=`${location.origin}/account/update-password.html?lang=${lang}`;const{error}=await client.auth.resetPasswordForEmail(email.value.trim(),{redirectTo});status.textContent=error?(lang==='ar'?'تعذر إرسال الرابط. حاول مرة أخرى.':'Could not send the reset link. Please try again.'):(lang==='ar'?'إذا كان البريد مسجلًا فستصلك رسالة لإعادة تعيين كلمة المرور.':'If that email is registered, a reset message will be sent.');submit.disabled=false;});}</script></body></html>
