<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>حسابي | التميّز 10X</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>body{background:#f5f7fa}.account-shell{width:min(860px,calc(100% - 32px));margin:6vh auto}.card{background:#fff;border:1px solid #dfe6ee;border-radius:22px;padding:26px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 16px;background:#0b2545;color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#eef2f6;color:#0b2545}.btn:disabled{opacity:.6}.muted{color:#64748b}.attempt{border-top:1px solid #e5eaf0;padding:18px 0}.attempt:first-child{border-top:0}.attempt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.result-box{margin-top:10px;padding:14px;border-radius:14px;background:#f7f9fc;border:1px solid #e3e8ef}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:10px}.metric strong,.metric span{display:block}.metric span{font-size:.85rem;color:#64748b;margin-top:3px}.hidden{display:none}</style>
<script src="/assets/js/auth-config.js"></script>
</head>
<body><main class="account-shell"><div class="card"><div class="row"><div><h1 id="title">حسابي</h1><p class="muted" id="identity">جارٍ تحميل بيانات الحساب…</p></div><button class="btn" id="logout">تسجيل الخروج</button></div></div><div class="card"><h2 id="historyTitle">محاولاتي ونتائجي</h2><div id="history" class="muted">جارٍ التحميل…</div></div><p><a id="back" href="/personality.html">العودة إلى مختبر اكتشاف الذات</a></p></main>
<script type="module">
import { currentSession } from '/assets/js/assessment-auth-client.js';
import { listAssessmentReports, openAssessmentReport } from '/assets/js/assessment-reports-client.js';
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const titleEl=document.getElementById('title'),identityEl=document.getElementById('identity'),logoutEl=document.getElementById('logout'),historyTitleEl=document.getElementById('historyTitle'),historyEl=document.getElementById('history'),backEl=document.getElementById('back');
const labels=lang==='ar'?{account:'حسابي',history:'محاولاتي ونتائجي',logout:'تسجيل الخروج',back:'العودة إلى مختبر اكتشاف الذات',none:'لا توجد محاولات محفوظة حتى الآن.',failed:'تعذر تحميل الحساب.',completed:'مكتمل',in_progress:'قيد التنفيذ',abandoned:'غير مكتمل',view:'عرض النتيجة',hide:'إخفاء النتيجة',openPdf:'فتح التقرير التفصيلي PDF',openingPdf:'جارٍ فتح التقرير…',reportUnavailable:'لم يُنشأ ملف PDF لهذه المحاولة بعد.'}:{account:'My account',history:'My attempts and results',logout:'Sign out',back:'Back to the Self-Discovery Lab',none:'No saved assessment attempts yet.',failed:'Could not load account.',completed:'Completed',in_progress:'In progress',abandoned:'Incomplete',view:'View result',hide:'Hide result',openPdf:'Open detailed PDF report',openingPdf:'Opening report…',reportUnavailable:'No PDF report has been created for this attempt yet.'};
if(lang==='en'){document.title='My account | Tamayuz 10X';titleEl.textContent=labels.account;historyTitleEl.textContent=labels.history;logoutEl.textContent=labels.logout;backEl.textContent=labels.back;backEl.href='/en/personality.html';}
const assessmentName=k=>k==='learning-preference-profile'?(lang==='ar'?'بصمتك في التعلّم':'Learning Style Profile'):(lang==='ar'?'تقييم أسلوب العمل':'Work Approach Assessment');
const statusName=s=>labels[s]||s;
function resultHtml(a){if(!a.result_json)return'';if(a.assessment_key==='learning-preference-profile'){const p=a.result_json?.scores?.percent||{},n=lang==='ar'?{A:'الممارسة',R:'التأمل والمراجعة',T:'التحليل المفاهيمي',P:'التطبيق العملي'}:{A:'Action',R:'Reflection',T:'Conceptual analysis',P:'Practical application'};return `<div class="result-grid">${['A','R','T','P'].map(k=>`<div class="metric"><strong>${p[k]??'—'}%</strong><span>${n[k]}</span></div>`).join('')}</div>`;}return `<p class="muted">${lang==='ar'?'النتيجة محفوظة في حسابك.':'The result is saved in your account.'}</p>`;}
function reportPriority(r){const n=String(r?.file_name||'');if(n.includes('-visual-v2-'))return 4;if(n.includes('-visual-'))return 3;if(n.includes('-detailed-'))return 2;return 1;}
function reportTime(r){for(const key of ['updated_at','created_at','generated_at','completed_at']){const t=Date.parse(r?.[key]||'');if(Number.isFinite(t))return t;}return 0;}
function preferReport(next,prev){if(!prev)return true;const np=reportPriority(next),pp=reportPriority(prev);if(np!==pp)return np>pp;const nt=reportTime(next),pt=reportTime(prev);if(nt!==pt)return nt>pt;return String(next?.id||'')>String(prev?.id||'');}
try{const {client,session}=await currentSession();if(!session){location.replace(`/account/login.html?lang=${lang}&next=${encodeURIComponent('/account/?lang='+lang)}`);}else{const {data:profile}=await client.from('profiles').select('full_name').eq('id',session.user.id).maybeSingle();identityEl.textContent=[profile?.full_name,session.user.email].filter(Boolean).join(' · ');const [{data:attempts,error},rp]=await Promise.all([client.from('assessment_attempts').select('id,assessment_key,status,started_at,completed_at,result_json').order('started_at',{ascending:false}).limit(50),listAssessmentReports().catch(()=>({reports:[]}))]);if(error)throw error;const reportsByAttempt=new Map();for(const r of (rp?.reports||[])){if(r?.status!=='ready')continue;const prev=reportsByAttempt.get(r.attempt_id);if(preferReport(r,prev))reportsByAttempt.set(r.attempt_id,r);}if(!attempts?.length)historyEl.textContent=labels.none;else{historyEl.className='';historyEl.innerHTML=attempts.map((a,i)=>{const report=reportsByAttempt.get(a.id);return `<div class="attempt"><strong>${assessmentName(a.assessment_key)}</strong><br><span class="muted">${statusName(a.status)} · ${new Date(a.started_at).toLocaleString(lang==='ar'?'ar':'en')}</span>${a.status==='completed'?`<div class="attempt-actions"><button class="btn secondary" data-view="r${i}">${labels.view}</button>${report?`<button class="btn" data-report-id="${report.id}" data-report-name="${report.file_name||'assessment-report.pdf'}">${labels.openPdf}</button>`:''}</div><div class="result-box hidden" id="r${i}">${resultHtml(a)}<p class="muted">${report?(lang==='ar'?'التقرير محفوظ بأمان وجاهز للفتح.':'The report is securely stored and ready to open.'):labels.reportUnavailable}</p></div>`:''}</div>`;}).join('');document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{const box=document.getElementById(btn.dataset.view),show=box.classList.contains('hidden');box.classList.toggle('hidden');btn.textContent=show?labels.hide:labels.view;});document.querySelectorAll('[data-report-id]').forEach(btn=>btn.onclick=async()=>{const t=btn.textContent;btn.disabled=true;btn.textContent=labels.openingPdf;try{await openAssessmentReport(btn.dataset.reportId,btn.dataset.reportName||'assessment-report.pdf');}catch(e){console.error(e);alert(lang==='ar'?'تعذر فتح التقرير الآن.':'Could not open the report.');}finally{btn.disabled=false;btn.textContent=t;}});}logoutEl.onclick=async()=>{await client.auth.signOut();location.replace(lang==='ar'?'/personality.html':'/en/personality.html');};}}catch(e){console.error('Account history load failed:',e);historyEl.textContent=labels.failed;}
</script></body></html>
