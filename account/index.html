<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>حسابي | التميّز 10X</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>body{background:#f5f7fa}.account-shell{width:min(860px,calc(100% - 32px));margin:6vh auto}.card{background:#fff;border:1px solid #dfe6ee;border-radius:22px;padding:26px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 16px;background:#0b2545;color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#eef2f6;color:#0b2545}.btn:disabled{opacity:.6}.muted{color:#64748b}.attempt{border-top:1px solid #e5eaf0;padding:18px 0}.attempt:first-child{border-top:0}.attempt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.result-box{margin-top:10px;padding:14px;border-radius:14px;background:#f7f9fc;border:1px solid #e3e8ef}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:10px}.metric strong,.metric span{display:block}.metric span{font-size:.85rem;color:#64748b;margin-top:3px}.recovery-status{display:block;margin-top:10px;font-weight:700;color:#0b5c45}.hidden{display:none}.report-recovery-frame{position:fixed;left:-10000px;top:0;width:1200px;height:1800px;border:0;opacity:.01;pointer-events:none}</style>
<script src="/assets/js/auth-config.js"></script>
</head>
<body><main class="account-shell"><div class="card"><div class="row"><div><h1 id="title">حسابي</h1><p class="muted" id="identity">جارٍ تحميل بيانات الحساب…</p></div><button class="btn" id="logout">تسجيل الخروج</button></div></div><div class="card"><h2 id="historyTitle">محاولاتي ونتائجي</h2><div id="history" class="muted">جارٍ التحميل…</div></div><p><a id="back" href="/personality.html">العودة إلى مختبر اكتشاف الذات</a></p></main>
<script type="module">
import { currentSession } from '/assets/js/assessment-auth-client.js';
import { listAssessmentReports, openAssessmentReport } from '/assets/js/assessment-reports-client.js';
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const titleEl=document.getElementById('title'),identityEl=document.getElementById('identity'),logoutEl=document.getElementById('logout'),historyTitleEl=document.getElementById('historyTitle'),historyEl=document.getElementById('history'),backEl=document.getElementById('back');
const labels=lang==='ar'?{account:'حسابي',history:'محاولاتي ونتائجي',logout:'تسجيل الخروج',back:'العودة إلى مختبر اكتشاف الذات',none:'لا توجد محاولات محفوظة حتى الآن.',failed:'تعذر تحميل الحساب.',completed:'مكتمل',in_progress:'قيد التنفيذ',abandoned:'غير مكتمل',view:'عرض النتيجة',hide:'إخفاء النتيجة',openPdf:'فتح التقرير التفصيلي PDF',openingPdf:'جارٍ فتح التقرير…',reportUnavailable:'لم يُنشأ ملف PDF لهذه المحاولة بعد.',restoringColour:'جارٍ استعادة التقرير الملوّن من نتيجتك الأصلية…',restoreFailed:'تعذرت استعادة التقرير الملوّن تلقائيًا الآن.'}:{account:'My account',history:'My attempts and results',logout:'Sign out',back:'Back to the Self-Discovery Lab',none:'No saved assessment attempts yet.',failed:'Could not load account.',completed:'Completed',in_progress:'In progress',abandoned:'Incomplete',view:'View result',hide:'Hide result',openPdf:'Open detailed PDF report',openingPdf:'Opening report…',reportUnavailable:'No PDF report has been created for this attempt yet.',restoringColour:'Restoring the coloured report from your original result…',restoreFailed:'The coloured report could not be restored automatically right now.'};
if(lang==='en'){document.title='My account | Tamayuz 10X';titleEl.textContent=labels.account;historyTitleEl.textContent=labels.history;logoutEl.textContent=labels.logout;backEl.textContent=labels.back;backEl.href='/en/personality.html';}
const assessmentName=k=>k==='learning-preference-profile'?(lang==='ar'?'بصمتك في التعلّم':'Learning Style Profile'):(lang==='ar'?'تقييم أسلوب العمل':'Work Approach Assessment');
const statusName=s=>labels[s]||s;
function resultHtml(a){if(!a.result_json)return'';if(a.assessment_key==='learning-preference-profile'){const p=a.result_json?.scores?.percent||{},n=lang==='ar'?{A:'الممارسة',R:'التأمل والمراجعة',T:'التحليل المفاهيمي',P:'التطبيق العملي'}:{A:'Action',R:'Reflection',T:'Conceptual analysis',P:'Practical application'};return `<div class="result-grid">${['A','R','T','P'].map(k=>`<div class="metric"><strong>${p[k]??'—'}%</strong><span>${n[k]}</span></div>`).join('')}</div>`;}return `<p class="muted">${lang==='ar'?'النتيجة محفوظة في حسابك.':'The result is saved in your account.'}</p>`;}
function reportPriority(r){const n=String(r?.file_name||'');if(n.includes('-visual-v3-'))return 5;if(n.includes('-visual-v2-'))return 4;if(n.includes('-visual-'))return 3;if(n.includes('-detailed-'))return 2;return 1;}
function reportTime(r){for(const key of ['updated_at','created_at','generated_at','completed_at']){const t=Date.parse(r?.[key]||'');if(Number.isFinite(t))return t;}return 0;}
function preferReport(next,prev){if(!prev)return true;const np=reportPriority(next),pp=reportPriority(prev);if(np!==pp)return np>pp;const nt=reportTime(next),pt=reportTime(prev);if(nt!==pt)return nt>pt;return String(next?.id||'')>String(prev?.id||'');}
function recoverableLppState(attempt){
  if(attempt?.assessment_key!=='learning-preference-profile'||attempt?.status!=='completed')return null;
  try{
    const state=JSON.parse(localStorage.getItem('tamayuz10x-lpp-v1')||'null');
    if(!state?.completedAt||state?.screen!=='results')return null;
    const answered=Object.values(state.responses||{}).filter(v=>v!==null&&v!==undefined).length;
    if(answered!==64)return null;
    const localCompleted=typeof state.completedAt==='number'?state.completedAt:Date.parse(state.completedAt||'');
    const savedCompleted=Date.parse(attempt?.result_json?.completedAt||attempt?.completed_at||'');
    if(!Number.isFinite(localCompleted)||!Number.isFinite(savedCompleted)||Math.abs(localCompleted-savedCompleted)>120000)return null;
    return state;
  }catch(_){return null;}
}
function startColourRecovery(attempt,state){
  const onceKey=`tamayuz10x-colour-report-recovery:${attempt.id}`;
  if(sessionStorage.getItem(onceKey)==='running')return;
  sessionStorage.setItem(onceKey,'running');
  sessionStorage.setItem(`tamayuz10x-current-attempt:${attempt.assessment_key}`,JSON.stringify({id:attempt.id,assessmentKey:attempt.assessment_key,startedAt:attempt.started_at,completed:true}));
  const row=document.querySelector(`[data-attempt-id="${attempt.id}"]`);
  if(row){const note=document.createElement('span');note.className='recovery-status';note.dataset.recoveryStatus=attempt.id;note.textContent=labels.restoringColour;row.appendChild(note);}
  const frame=document.createElement('iframe');
  frame.className='report-recovery-frame';
  frame.setAttribute('aria-hidden','true');
  frame.src=`/tools/learning-preference-profile/?lang=${encodeURIComponent(state.lang==='en'?'en':'ar')}&reportUpgrade=1&embed=1`;
  document.body.appendChild(frame);
  const timer=setTimeout(()=>{
    frame.remove();sessionStorage.removeItem(onceKey);
    const note=document.querySelector(`[data-recovery-status="${attempt.id}"]`);if(note)note.textContent=labels.restoreFailed;
  },45000);
  const handler=e=>{
    if(e.origin!==location.origin||!e.data||e.data.attemptId!==attempt.id)return;
    if(e.data.type==='tamayuz:assessment-report-ready'){
      clearTimeout(timer);window.removeEventListener('message',handler);frame.remove();sessionStorage.removeItem(onceKey);location.reload();
    }else if(e.data.type==='tamayuz:assessment-report-failed'){
      clearTimeout(timer);window.removeEventListener('message',handler);frame.remove();sessionStorage.removeItem(onceKey);
      const note=document.querySelector(`[data-recovery-status="${attempt.id}"]`);if(note)note.textContent=labels.restoreFailed;
    }
  };
  window.addEventListener('message',handler);
}
try{const {client,session}=await currentSession();if(!session){location.replace(`/account/login.html?lang=${lang}&next=${encodeURIComponent('/account/?lang='+lang)}`);}else{const {data:profile}=await client.from('profiles').select('full_name').eq('id',session.user.id).maybeSingle();identityEl.textContent=[profile?.full_name,session.user.email].filter(Boolean).join(' · ');const [{data:attempts,error},rp]=await Promise.all([client.from('assessment_attempts').select('id,assessment_key,status,started_at,completed_at,result_json').order('started_at',{ascending:false}).limit(50),listAssessmentReports().catch(()=>({reports:[]}))]);if(error)throw error;const reportsByAttempt=new Map();for(const r of (rp?.reports||[])){if(r?.status!=='ready')continue;const prev=reportsByAttempt.get(r.attempt_id);if(preferReport(r,prev))reportsByAttempt.set(r.attempt_id,r);}if(!attempts?.length)historyEl.textContent=labels.none;else{historyEl.className='';historyEl.innerHTML=attempts.map((a,i)=>{const report=reportsByAttempt.get(a.id);return `<div class="attempt" data-attempt-id="${a.id}"><strong>${assessmentName(a.assessment_key)}</strong><br><span class="muted">${statusName(a.status)} · ${new Date(a.started_at).toLocaleString(lang==='ar'?'ar':'en')}</span>${a.status==='completed'?`<div class="attempt-actions"><button class="btn secondary" data-view="r${i}">${labels.view}</button>${report?`<button class="btn" data-report-id="${report.id}" data-report-name="${report.file_name||'assessment-report.pdf'}">${labels.openPdf}</button>`:''}</div><div class="result-box hidden" id="r${i}">${resultHtml(a)}<p class="muted">${report?(lang==='ar'?'التقرير محفوظ بأمان وجاهز للفتح.':'The report is securely stored and ready to open.'):labels.reportUnavailable}</p></div>`:''}</div>`;}).join('');document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{const box=document.getElementById(btn.dataset.view),show=box.classList.contains('hidden');box.classList.toggle('hidden');btn.textContent=show?labels.hide:labels.view;});document.querySelectorAll('[data-report-id]').forEach(btn=>btn.onclick=async()=>{const t=btn.textContent;btn.disabled=true;btn.textContent=labels.openingPdf;try{await openAssessmentReport(btn.dataset.reportId,btn.dataset.reportName||'assessment-report.pdf');}catch(e){console.error(e);alert(lang==='ar'?'تعذر فتح التقرير الآن.':'Could not open the report.');}finally{btn.disabled=false;btn.textContent=t;}});const candidate=attempts.find(a=>reportPriority(reportsByAttempt.get(a.id))<5&&recoverableLppState(a));if(candidate){const state=recoverableLppState(candidate);if(state)startColourRecovery(candidate,state);}}logoutEl.onclick=async()=>{await client.auth.signOut();location.replace(lang==='ar'?'/personality.html':'/en/personality.html');};}}catch(e){console.error('Account history load failed:',e);historyEl.textContent=labels.failed;}
</script>
<script type="module" src="/assets/js/account-report-auto.js?v=20260912-saved-result1"></script>
</body></html>
