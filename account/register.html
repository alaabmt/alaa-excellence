<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create account | Tamayuz 10X</title><link rel="stylesheet" href="/assets/css/style.css"><style>body{background:#f5f7fa}.auth-shell{width:min(560px,calc(100% - 32px));margin:6vh auto}.auth-card{background:#fff;border:1px solid #dfe6ee;border-radius:22px;padding:28px}.auth-card h1{margin-top:0;color:#0b2545}.auth-card label{display:block;margin:14px 0 6px;font-weight:700}.auth-card input{width:100%;padding:12px 13px;border:1px solid #cfd9e4;border-radius:11px;font:inherit}.auth-card button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:11px;background:#0b2545;color:#fff;font:inherit;font-weight:800}.status{min-height:1.5em;margin-top:12px;color:#9b2c2c}.auth-links{margin-top:16px}.brand{text-align:center;margin-bottom:16px}.brand img{height:58px;max-width:220px;object-fit:contain}</style><script src="/assets/js/auth-config.js"></script></head><body><main class="auth-shell"><div class="brand"><a href="/"><img src="/assets/images/file_0000000047188210ac6952e999d2eda7.png" alt="Tamayuz 10X"></a></div><section class="auth-card"><h1 id="title">Create your account</h1><p id="intro">Registration is required before accessing the assessments.</p><form id="form"><label id="nameLabel" for="name">Full name</label><input id="name" autocomplete="name" required><label id="emailLabel" for="email">Email</label><input id="email" type="email" autocomplete="email" required><label id="passwordLabel" for="password">Password</label><input id="password" type="password" autocomplete="new-password" required minlength="8"><button id="submit" type="submit">Create account</button><p class="status" id="status" role="status" aria-live="polite"></p></form><div class="auth-links"><a id="loginLink" href="/account/login.html">Already registered? Sign in</a></div></section></main><script type="module">import {authConfigured,createAuthClient,safeNext} from '/assets/js/assessment-auth-client.js';const p=new URLSearchParams(location.search),lang=p.get('lang')==='ar'?'ar':'en',next=safeNext(p.get('next'));const titleEl=document.getElementById('title'),introEl=document.getElementById('intro'),nameLabelEl=document.getElementById('nameLabel'),emailLabelEl=document.getElementById('emailLabel'),passwordLabelEl=document.getElementById('passwordLabel'),submitEl=document.getElementById('submit'),loginLinkEl=document.getElementById('loginLink'),formEl=document.getElementById('form'),nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),statusEl=document.getElementById('status');if(lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.title='إنشاء حساب | التميّز 10X';titleEl.textContent='إنشاء حساب';introEl.textContent='يلزم التسجيل قبل الوصول إلى التقييمات.';nameLabelEl.textContent='الاسم الكامل';emailLabelEl.textContent='البريد الإلكتروني';passwordLabelEl.textContent='كلمة المرور';submitEl.textContent='إنشاء الحساب';loginLinkEl.textContent='لديك حساب؟ سجّل الدخول';}loginLinkEl.href=`/account/login.html?lang=${lang}&next=${encodeURIComponent(next)}`;function friendlyAuthError(error){const code=String(error?.code||''),message=String(error?.message||'').toLowerCase(),rateLimited=code==='over_email_send_rate_limit'||error?.status===429||message.includes('rate limit')||message.includes('too many requests');if(rateLimited)return lang==='ar'?'تم الوصول مؤقتًا إلى الحد المسموح لإرسال رسائل تأكيد التسجيل. لم يكتمل إنشاء الحساب بعد. يرجى المحاولة لاحقًا، أو سجّل الدخول أدناه إذا كان لديك حساب بالفعل.':'The registration email limit has been reached temporarily. Your account has not been completed yet. Please try again later, or sign in below if you already have an account.';return lang==='ar'?'تعذر إنشاء الحساب الآن. يرجى المحاولة مرة أخرى.':'Could not create the account right now. Please try again.';}if(!authConfigured()){statusEl.textContent=lang==='ar'?'لم يكتمل ربط خدمة التسجيل بعد.':'The registration service has not been connected yet.';submitEl.disabled=true;}else{const client=await createAuthClient();formEl.addEventListener('submit',async e=>{e.preventDefault();submitEl.disabled=true;statusEl.textContent=lang==='ar'?'جارٍ إنشاء الحساب…':'Creating account…';const verificationReturn=`${location.origin}/account/login.html?lang=${lang}&next=${encodeURIComponent(next)}`;const {data,error}=await client.auth.signUp({email:emailEl.value.trim(),password:passwordEl.value,options:{emailRedirectTo:verificationReturn,data:{full_name:nameEl.value.trim()}}});if(error){console.error('Registration failed:',error.code||error.status||'auth_error');statusEl.textContent=friendlyAuthError(error);submitEl.disabled=false;return;}if(data.session)location.replace(next);else{statusEl.textContent=lang==='ar'?'تم إنشاء الحساب. أرسلنا رسالة إلى بريدك الإلكتروني. افتح رابط التأكيد، وستعود تلقائيًا إلى التقييم الذي بدأت منه.':'Account created. We sent a verification email. Open the confirmation link and you will return to the assessment you started from.';submitEl.disabled=false;}});}</script></body></html>
