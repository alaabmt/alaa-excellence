<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create account | Tamayuz 10X</title><link rel="stylesheet" href="/assets/css/style.css"><style>body{background:#f5f7fa}.auth-shell{width:min(560px,calc(100% - 32px));margin:6vh auto}.auth-card{background:#fff;border:1px solid #dfe6ee;border-radius:22px;padding:28px}.auth-card h1{margin-top:0;color:#0b2545}.auth-card label{display:block;margin:14px 0 6px;font-weight:700}.auth-card input{width:100%;padding:12px 13px;border:1px solid #cfd9e4;border-radius:11px;font:inherit}.name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.password-wrap{position:relative}.password-wrap input{padding-inline-end:72px}.auth-card button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:11px;background:#0b2545;color:#fff;font:inherit;font-weight:800}.password-toggle{position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);width:auto!important;margin:0!important;padding:6px 8px!important;background:transparent!important;color:#0b2545!important;border:0!important;border-radius:8px!important;font-size:.88rem!important;cursor:pointer}.status{min-height:1.5em;margin-top:12px;color:#9b2c2c}.auth-links{margin-top:16px}.brand{text-align:center;margin-bottom:16px}.brand img{height:58px;max-width:220px;object-fit:contain}@media(max-width:520px){.name-grid{grid-template-columns:1fr}}</style><script src="/assets/js/auth-config.js"></script></head><body><main class="auth-shell"><div class="brand"><a href="/"><img src="/assets/images/file_0000000047188210ac6952e999d2eda7.png" alt="Tamayuz 10X"></a></div><section class="auth-card"><h1 id="title">Create your account</h1><p id="intro">Registration is required before accessing the assessments.</p><form id="form"><div class="name-grid"><div><label id="firstNameLabel" for="firstName">First name</label><input id="fir t.getElementById('lastName'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),confirmPasswordEl=document.getElementById('confirmPassword'),togglePasswordEl=document.getElementById('togglePassword'),toggleConfirmPasswordEl=document.getElementById('toggleConfirmPassword'),statusEl=document.getElementById('status');const text=lang==='ar'?{title:'إنشاء حساب',intro:'يلزم التسجيل قبل الوصول إلى التقييمات.',firstName:'الاسم الأول',lastName:'اسم العائلة',email:'البريد الإلكتروني',password:'كلمة المرور',confirmPassword:'تأكيد كلمة المرور',create:'إنشاء الحساب',login:'لديك حساب؟ سجّل الدخول',show:'إظهار',hide:'إخفاء',nameRequired:'يرجى إدخال الاسم الأول واسم العائلة.',passwordMismatch:'كلمتا المرور غير متطابقتين.'}:{title:'Create your account',intro:'Registration is required before accessing the assessments.',firstName:'First name',lastName:'Last name',email:'Email',password:'Password',confirmPassword:'Confirm password',create:'Create account',login:'Already registered? Sign in',show:'Show',hide:'Hide',nameRequired:'Please enter both your first and last name.',passwordMismatch:'The passwords do not match.'};if(lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.title='إنشاء حساب | التميّز 10X';}titleEl.textContent=text.title;introEl.textContent=text.intro;firstNameLabelEl.textContent=text.firstName;lastNameLabelEl.textContent=text.lastName;emailLabelEl.textContent=text.email;passwordLabelEl.textContent=text.password;confirmPasswordLabelEl.textContent=text.confirmPassword;submitEl.textContent=text.create;loginLinkEl.textContent=text.login;togglePasswordEl.textContent=text.show;toggleConfirmPasswordEl.textContent=text.show;loginLinkEl.href=`/account/login.html?lang=${lang}&next=${encodeURIComponent(next)}`;function bindPasswordToggle(button,input){button.addEventListener('click',()=>{const visible=input.type==='text';input.type=visible?'password':'text';button.textContent=visible?text.show:text.hide; .html?lang=${lang}&next=${encodeURIComponent(next)}`;const {data,error}=await client.auth.signUp({email:emailEl.value.trim(),password:passwordEl.value,options:{emailRedirectTo:verificationReturn,data:{first_name:firstName,last_name:lastName,full_name:`${firstName} ${lastName}`}}});if(error){console.error('Registration failed:',error.code||error.status||'auth_error');statusEl.textContent=friendlyAuthError(error);submitEl.disabled=false;return;}if(data.session)location.replace(next);else{statusEl.textContent=lang==='ar'?'تم إنشاء الحساب. أرسلنا رسالة إلى بريدك الإلكتروني. افتح رابط التأكيد، وستعود تلقائيًا إلى التقييم الذي بدأت منه.':'Account created. We sent a verification email. Open the confirmation link and you will return to the assessment you started from.';submitEl.disabled=false;}});}</script></body></html>
