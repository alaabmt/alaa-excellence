            'Conferences and Scientific Leadership': 'Conferences &amp; Professional Leadership',
            'From Professional Engagement to Leading Science Platforms': 'From professional participation to leading scientific and professional platforms',
            'The scientific presence included international representation, the presidency of scientific conferences and programs, and lectures in quality, leadership, safety and institutional change.': 'Professional and academic engagement has included international representation, leadership of scientific conferences and programs, and speaking engagements in quality, leadership, patient safety and organizational change.',
            '<strong>+5</strong><span>International conferences chaired or led by its scientific programs and committees</span>': '<strong>5+</strong><span>International conferences chaired or supported through scientific leadership roles</span>',
            'the U S Magnet Conference': 'ANCC National Magnet Conference®',
            'the Infection Control Conferences': 'Infection Prevention and Control Conferences',
            'Lectures and participations on change management, performance indicators, teamwork, communication and patient safety.': 'Presentations and speaking engagements on change management, performance indicators, teamwork, communication and patient safety.',
            'The march is not measured by the number of positions, but by the size of the systems that were built, the capabilities that were developed, and the results that continued after the project ended.': 'A professional journey is measured not by the number of positions held, but by the systems built, the capabilities strengthened, and the results sustained beyond individual projects.',
            'Knowledge and consultancy in institutional excellence, transformation, quality and innovation.': 'Knowledge and consulting in organizational excellence, transformation, quality and innovation.',
            '>Professional experience<': '>Professional Expertise<',
            'Executive expertise in institutional excellence, transformation, quality, innovation, research and capacity building.': 'Professional expertise in organizational excellence, transformation, quality, innovation, research and capability building.',
            'Institutional Excellence': 'Organizational Excellence',
            'Institutional transformation': 'Organizational Transformation',
            'Capacity-building': 'Capability Building',
            'institutional transformation': 'organizational transformation',
            'institutional excellence': 'organizational excellence',
            '<meta content="الدكتور علاء محمد أحمد" name="author"/>': '<meta content="Dr. Alaa Mohammad Ahmed" name="author"/>',
            '<meta content="التميّز 10X | Tamayuz 10X" property="og:site_name"/>': '<meta content="Tamayuz 10X" property="og:site_name"/>',
            'Dr. Alaa Mohammad Ahmed  Executive Biography and Experience in Excellence and Quality  Tamayuz 10X  Tamayuz 10X': 'Dr. Alaa Mohammad Ahmed | Professional Biography | Tamayuz 10X',
            'Dr. Alaa Mohammad Ahmed  Executive Biography  Tamayuz 10X  Tamayuz 10X': 'Dr. Alaa Mohammad Ahmed | Professional Biography | Tamayuz 10X',
            'https://tamayuz10x.com/../assets/images/alaa-mohammad-ahmad-profile-hq.webp': 'https://tamayuz10x.com/assets/images/alaa-mohammad-ahmad-profile-hq.webp',
            '"jobTitle":"Executive leader and expert in corporate excellence, transformation, quality and innovation"': '"jobTitle":"Senior Business Consultant | Organizational Excellence, Transformation, Quality and Innovation"',
            'Tamayuz 10X Tamayuz 10X': 'Tamayuz 10X',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          page_path.write_text(text, encoding='utf-8')

          # Make the global share component language-aware so English pages never receive Arabic sharing UI.
          js_path = Path('assets/js/site-engagement.js')
          js = js_path.read_text(encoding='utf-8')
          old = '''    const encodedText = encodeURIComponent(shareText);\n    const box = document.createElement('section');\n    box.className = 'tenx-share-box';\n    box.setAttribute('aria-label', 'مشاركة الصفحة');\n    box.innerHTML = `\n      <div class="tenx-share-copy"><span>شارك المعرفة</span><h2>وجدت هذه الصفحة مفيدة؟ شاركها مع من قد يستفيد منها.</h2><p>المعرفة تصبح أكثر قيمة عندما تنتقل.</p></div>'''
          new = '''    const encodedText = encodeURIComponent(shareText);\n    const isEnglish = (document.documentElement.lang || '').toLowerCase().startsWith('en');\n    const shareLabel = isEnglish ? 'Share the Knowledge' : 'شارك المعرفة';\n    const shareHeading = isEnglish ? 'Found this page useful? Share it with someone who may benefit.' : 'وجدت هذه الصفحة مفيدة؟ شاركها مع من قد يستفيد منها.';\n    const shareIntro = isEnglish ? 'Knowledge creates greater value when it is shared.' : 'المعرفة تصبح أكثر قيمة عندما تنتقل.';\n    const shareAria = isEnglish ? 'Share this page' : 'مشاركة الصفحة';\n    const box = document.createElement('section');\n    box.className = 'tenx-share-box';\n    box.setAttribute('aria-label', shareAria);\n    box.innerHTML = `\n      <div class="tenx-share-copy"><span>${shareLabel}</span><h2>${shareHeading}</h2><p>${shareIntro}</p></div>'''
          if old not in js:
              raise SystemExit('Could not locate share box source block')
          js = js.replace(old, new, 1)
          js = js.replace("copy.textContent = 'نسخ الرابط';", "copy.textContent = isEnglish ? 'Copy Link' : 'نسخ الرابط';")
          js = js.replace("native.textContent = 'مشاركة أخرى';", "native.textContent = isEnglish ? 'More Sharing Options' : 'مشاركة أخرى';")
          js = js.replace("note.textContent = 'على الهاتف، يتيح «مشاركة أخرى» اختيار التطبيقات المتاحة على جهازك، ومنها Instagram عندما يدعم الجهاز المشاركة إليها.';", "note.textContent = isEnglish ? 'On mobile, More Sharing Options lets you choose from the sharing apps available on your device, including Instagram when supported.' : 'على الهاتف، يتيح «مشاركة أخرى» اختيار التطبيقات المتاحة على جهازك، ومنها Instagram عندما يدعم الجهاز المشاركة إليها.';")
          js_path.write_text(js, encoding='utf-8')

          # Editorial quality gate.
          final = page_path.read_text(encoding='utf-8')
          required = [
              'Senior Business Consultant',
              'Quality and Accreditation Manager for Stem Cell Transplantation',
              'Organizational Excellence',
              'Capability Building',
              'Research &amp; Knowledge Leadership',
              'Professional Journey',
              'Clinical Documentation Excellence',
              'ANCC National Magnet Conference®',
          ]
          forbidden = [
              'Executive leader and expert in corporate excellence',
              'The executive map of the march',
              '20 Search',
              '50 Clinic<',
              'Quality System for Stem Cell Transplantation',
              '<h3>Consultant</h3>',
              'Research and Cognitive Leadership',
              '<span>Attendance</span>',
              'the U S Magnet Conference',
              'Knowledge and consultancy in institutional excellence',
              'Tamayuz 10X Tamayuz 10X',
          ]
          missing = [x for x in required if x not in final]
          remaining = [x for x in forbidden if x in final]
          if missing or remaining:
              raise SystemExit(f'Quality gate failed. Missing={missing}; forbidden_remaining={remaining}')
          print('English About editorial gate passed.')
          PY
      - name: Commit editorial polish
        run: |
          if git diff --quiet -- en/about.html assets/js/site-engagement.js; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/about.html assets/js/site-engagement.js
          git commit -m 'Polish English About page and localize sharing UI'
          git push origin HEAD:main
