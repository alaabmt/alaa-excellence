            '<h3>Education and Certifications</h3><small>Basis</small>': '<h3>Education &amp; Professional Credentials</h3><small>Foundation</small>',
            '<h3>Executive experience</h3>': '<h3>Executive Experience</h3>',
            '<h3>Research and knowledge</h3><small>Production</small>': '<h3>Research &amp; Knowledge</h3><small>Knowledge Creation</small>',
            '<h3>Capacity-building</h3>': '<h3>Capability Building</h3>',
