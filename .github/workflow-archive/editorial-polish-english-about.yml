            'Quality System for Stem Cell Transplantation': 'Quality and Accreditation Manager for Stem Cell Transplantation',
            'Work within the program establishment efforts in collaboration with Mayo Clinic, leading the quality management system, governance, documentation, indicators and readiness for adoption.': 'Supported the establishment of the stem cell transplantation program in collaboration with Mayo Clinic, leading quality management, accreditation readiness, governance, documentation, performance indicators and continuous improvement.',
            'Executive Office of the Executive Director': 'Office of the Executive Director',
            '<h3>Consultant</h3>': '<h3>Senior Business Consultant</h3>',
            'Leading and supporting excellence projects and institutional transformation, centers of excellence, specialized institutes, operating models and performance improvement.': 'Leading and advising on organizational excellence and transformation initiatives, including Centers of Excellence, specialized institutes, operating models and performance improvement.',
            'Specialty Operating Model': 'Specialized Care Operating Model',
            'Specialized Institutes (Institutes)': 'Specialized Institutes',
            'Related Indicators': 'Integrated Performance Indicators',
            'Patient Results and Experience': 'Patient Outcomes &amp; Experience',
            'Centers of Excellence (Centres of Excellence)': 'Centers of Excellence',
            '<span class="chip">Bones.</span>': '<span class="chip">Orthopedics</span>',
            '<span class="chip">Cancer.</span>': '<span class="chip">Cancer</span>',
            'Leading Services (Flagship Services)': 'Flagship Clinical Services',
            'Patient-related findings': 'Patient-Reported Outcomes',
            'Complex Case Teams': 'Multidisciplinary Teams for Complex Cases',
            'Excellence in Clinical Documentation': 'Clinical Documentation Excellence',
            'Financial impact achieved by improving the quality of clinical documentation and accuracy of data, raising the index of severity and difficulty of cases and linking this to the revenue cycle.': 'Financial impact achieved by improving clinical documentation quality and data accuracy, strengthening the documentation of severity of illness and case complexity, and linking these improvements to the revenue cycle.',
            'Research and Cognitive Leadership': 'Research &amp; Knowledge Leadership',
            'Research as a tool for decision-making and improving practice': 'Research as a driver of better decisions and clinical practice',
            'Research expertise combines scientific production, leadership of research programs, mentorship, and linking research to the Foundation’s results.': 'Research expertise combines research output, leadership of research programs, mentorship, and alignment of research with organizational priorities and outcomes.',
            '<strong>+20</strong><span>Scientific research and publication</span>': '<strong>20+</strong><span>Research Publications</span>',
            'Building research capacity': 'Research Capacity Building',
            'Leading a program of research guidance and linking research to the results of the institution and developing new researchers.': 'Leading research mentorship and capacity-building initiatives that connect research with organizational priorities and support the development of emerging researchers.',
            'Training, development and capacity-building': 'Professional Development &amp; Capability Building',
            'Transforming training into sustainable institutional capacity': 'Transforming learning into sustainable organizational capability',
            'The goal is not the number of training hours, but rather that the trainee and the team become able to improve work and lead change from within the organization.': 'The goal is not the number of training hours, but the ability of professionals and teams to improve practice and lead change from within the organization.',
            '<strong>+2500</strong><span>Trained in specialized programs</span>': '<strong>2,500+</strong><span>Professionals Trained</span>',
            'Applied programs in quality, improvement, leadership and safety': 'Applied Programs in Quality, Improvement, Leadership &amp; Patient Safety',
            'Green Belt in Six Sigma': 'Lean Six Sigma Green Belt',
            'Yellow Belt in Six Sigma': 'Lean Six Sigma Yellow Belt',
            'Improvement Model and Project Management': 'Model for Improvement &amp; Project Management',
            'Capacity building is not a separate training activity; it is a transformational tool that makes an organization less dependent on experts and better able to improve itself.': 'Capability building is not a separate training activity; it is a transformation mechanism that strengthens an organization’s ability to improve, adapt and sustain performance from within.',
