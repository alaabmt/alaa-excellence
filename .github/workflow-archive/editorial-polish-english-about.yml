            'This expertise combines assessment, organisation preparation, award criteria design, and leading initiatives that make excellence measurable and scalable.': 'This experience combines assessment, organizational readiness, award-criteria design and leadership of initiatives that make excellence measurable and scalable.',
            'Founder and Chairman': 'Founder &amp; Chair',
            'Head of Professional Category – Emirates Ladies Award': 'Head of the Professional Category – Emirates Women Award',
            'Head of Women Empowerment for Enterprises': 'Head of the Women Empowerment in Organizations Category',
            'the Emirates Innovation Award': 'UAE Innovation Award',
            'Evaluate organizational innovation, maturity and ability to turn ideas into results.': 'Assessing organizational innovation maturity and the ability to convert ideas into measurable results.',
            'Dubai Quality Award Sheikh Khalifa Excellence Award': 'Dubai Quality Award &amp; Sheikh Khalifa Excellence Award',
            'Award is a way to build a stronger system': 'Awards as a catalyst for stronger organizational systems',
            'Focus on leaving behind better leadership, more mature processes and more sustainable results.': 'Using recognition frameworks to strengthen leadership, mature organizational processes and sustain better results.',
