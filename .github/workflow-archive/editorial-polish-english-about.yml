name: Editorial polish English About

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-polish-english-about.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved professional English
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('en/about.html')
          text = page_path.read_text(encoding='utf-8')

          replacements = {
            'Executive leader and expert in corporate excellence, transformation, quality and innovation': 'Senior Business Consultant specializing in Organizational Excellence, Transformation, Quality and Innovation',
