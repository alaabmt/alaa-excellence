            '<strong>14 Hospitals</strong><span>Within the scope of excellence programs</span>': '<strong>14 Hospitals</strong><span>Across organizational excellence initiatives</span>',
            '<strong>50 Clinic</strong><span>Included in development programs</span>': '<strong>50+ Clinics</strong><span>Included in improvement and development initiatives</span>',
            '<strong>250 projects</strong><span>To improve processes and services</span>': '<strong>250+ Improvement Projects</strong><span>Process and service improvement initiatives</span>',
            '<strong>2,500 trainees</strong><span>the Specialized Programs</span>': '<strong>2,500+ Professionals Trained</strong><span>Across specialized professional programs</span>',
            '<strong>20 Search</strong><span>A scientific publication.</span>': '<strong>20+ Publications</strong><span>Research and scientific publications</span>',
