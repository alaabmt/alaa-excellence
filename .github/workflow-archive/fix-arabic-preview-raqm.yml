# Unified Arabic 10X preview-card generator — Noto Kufi Arabic + RAQM
name: Standardize Arabic 10X previews with Noto Kufi Arabic
on:
  push:
    paths:
      - '.github/workflows/fix-arabic-preview-raqm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arabic font and renderer
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
      - name: Render Dhul-Qarnayn Arabic card with native Arabic shaping
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, features
          assert features.check('raqm'), 'Pillow RAQM support is required'
          W,H=1200,630
          navy=(11,37,69); navy2=(18,57,94); gold=(198,161,95); white=(248,250,252); muted=(207,218,230)
          fonts=list(Path('/usr/share/fonts').rglob('NotoKufiArabic*.ttf'))
          assert fonts, 'Noto Kufi Arabic font is required'
          reg=next((p for p in fonts if 'Regular' in p.name),fonts[0]); bold=next((p for p in fonts if 'Bold' in p.name),reg)
          latin=next(Path('/usr/share/fonts').rglob('DejaVuSans-Bold.ttf'))
          def F(n,b=False): return ImageFont.truetype(str(bold if b else reg),n,layout_engine=ImageFont.Layout.RAQM)
          def ar(d,x,y,text,font,fill=white,anchor='ra'):
              d.text((x,y),text,font=font,fill=fill,anchor=anchor,direction='rtl',language='ar')
          im=Image.new('RGB',(W,H),navy); d=ImageDraw.Draw(im)
          d.rectangle((0,0,14,H),fill=gold); d.polygon([(900,0),(1200,0),(1200,H),(1040,H)],fill=navy2)
          ar(d,1120,75,'التميّز 10X  |  تأملات قرآنية',F(27,True),muted)
          ar(d,1120,125,'سورة الكهف',F(23,True),gold)
          ar(d,1120,220,'ذو القرنين',F(52,True))
          ar(d,1120,305,'بناء القدرة بدل صناعة الاعتماد',F(38,True))
          ar(d,1120,380,'من بناء القدرات إلى إعادة هندسة النظام',F(26),muted)
          ar(d,1120,555,'الدكتور علاء محمد أحمد',F(21,True),muted)
          d.text((75,190),'10X',font=ImageFont.truetype(str(latin),100),fill=white)
          out=Path('assets/previews/reflection-dhul-qarnayn-building-capability-ar-raqm.jpg')
          im.save(out,'JPEG',quality=94,optimize=True)
          # QA: verify dimensions and that RAQM can shape the exact Arabic strings.
          assert Image.open(out).size==(1200,630)
          for text in ['التميّز 10X','تأملات قرآنية','سورة الكهف','ذو القرنين','بناء القدرة بدل صناعة الاعتماد','من بناء القدرات إلى إعادة هندسة النظام','الدكتور علاء محمد أحمد']:
              box=d.textbbox((0,0),text,font=F(24),direction='rtl',language='ar')
              assert box[2]>box[0], text
          # Point all Arabic surfaces and Open Graph metadata to an immutable new filename.
          for name in ['reflection-dhul-qarnayn-building-capability.html','articles.html']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('reflection-dhul-qarnayn-building-capability-ar-v2.jpg','reflection-dhul-qarnayn-building-capability-ar-raqm.jpg')
              s=s.replace('reflection-dhul-qarnayn-building-capability-ar.jpg','reflection-dhul-qarnayn-building-capability-ar-raqm.jpg')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit canonical Arabic preview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/previews/reflection-dhul-qarnayn-building-capability-ar-raqm.jpg reflection-dhul-qarnayn-building-capability.html articles.html
          git diff --cached --quiet || git commit -m '[preview] Render Dhul-Qarnayn Arabic card with RAQM'
          git push