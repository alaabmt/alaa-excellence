name: Add editorial policy link to all page footers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-editorial-policy-footer-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add policy link to all HTML footers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          link = '<a href="editorial-policy-disclaimer.html">السياسة التحريرية وإخلاء المسؤولية</a>'
          changed = []

          for p in sorted(Path('.').glob('*.html')):
              s = p.read_text(encoding='utf-8')
              if 'editorial-policy-disclaimer.html' in s and p.name != 'editorial-policy-disclaimer.html':
                  continue

              # Prefer the existing "روابط سريعة" paragraph in the site footer.
              pat = re.compile(r'(<strong>روابط سريعة</strong>\s*<p>)(.*?)(</p>)', re.S)
              m = pat.search(s)
              if m and 'editorial-policy-disclaimer.html' not in m.group(2):
                  body = m.group(2).rstrip()
                  sep = ' · ' if body else ''
                  repl = m.group(1) + body + sep + link + m.group(3)
                  s = s[:m.start()] + repl + s[m.end():]
              elif p.name == 'editorial-policy-disclaimer.html':
                  # The policy page has its own simple footer; add a clear return link there.
                  if 'href="index.html"' not in s:
                      s = s.replace('</footer>', '<p><a href="index.html">العودة إلى الرئيسية</a></p></footer>')
                  else:
                      continue
              else:
                  # Fallback for pages with a non-standard footer.
                  idx = s.lower().rfind('</footer>')
                  if idx != -1 and 'editorial-policy-disclaimer.html' not in s:
                      block = f'<p class="footer-policy-link">{link}</p>'
                      s = s[:idx] + block + s[idx:]
                  else:
                      continue

              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print('Updated:', ', '.join(changed) if changed else 'nothing')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add editorial policy link to all footers [skip ci]"
          git push
