name: Publish Dhul-Qarnayn reflection assets
on:
  push:
    paths:
      - '.github/workflows/publish-dhul-qarnayn-reflection.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Arabic-capable renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-noto-core fonts-noto-extra
      - name: Generate Arabic and English 1200x630 social cards
        run: |
          mkdir -p assets/previews
          cat > /tmp/card-ar.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <rect width="1200" height="630" fill="#f8f5ee"/>
            <rect x="60" y="55" width="1080" height="520" rx="34" fill="#102845"/>
            <circle cx="1075" cy="55" r="135" fill="#b59143"/>
            <circle cx="30" cy="590" r="120" fill="#dccfac"/>
            <g fill="#fff" font-family="Noto Sans Arabic" text-anchor="end" direction="rtl" unicode-bidi="bidi-override">
              <text x="1080" y="135" font-size="30" font-weight="700">التميّز 10X</text>
              <text x="1080" y="195" font-size="28">تأملات 10X في القرآن | سورة الكهف</text>
              <text x="1080" y="285" font-size="54" font-weight="700">ذو القرنين</text>
              <text x="1080" y="365" font-size="40" font-weight="700">بناء القدرة بدل صناعة الاعتماد</text>
              <text x="1080" y="435" font-size="28">من بناء القدرات إلى إعادة هندسة النظام</text>
              <text x="1080" y="510" font-size="25">الدكتور علاء محمد أحمد</text>
            </g>
          </svg>
          SVG
          cat > /tmp/card-en.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <rect width="1200" height="630" fill="#f8f5ee"/>
            <rect x="60" y="55" width="1080" height="520" rx="34" fill="#102845"/>
            <circle cx="1075" cy="55" r="135" fill="#b59143"/>
            <circle cx="30" cy="590" r="120" fill="#dccfac"/>
            <g fill="#fff" font-family="Noto Sans" text-anchor="start">
              <text x="120" y="135" font-size="30" font-weight="700">Tamayuz 10X</text>
              <text x="120" y="195" font-size="27">10X Reflections from the Qur’an | Surat al-Kahf</text>
              <text x="120" y="285" font-size="54" font-weight="700">Dhul-Qarnayn</text>
              <text x="120" y="365" font-size="34" font-weight="700">Building Capability Rather Than Dependence</text>
              <text x="120" y="435" font-size="27">From capability building to system redesign</text>
              <text x="120" y="510" font-size="25">Dr. Alaa Mohammad Ahmed</text>
            </g>
          </svg>
          SVG
          convert -background none /tmp/card-ar.svg -quality 92 assets/previews/reflection-dhul-qarnayn-building-capability-ar-v2.jpg
          convert -background none /tmp/card-en.svg -quality 92 assets/previews/reflection-dhul-qarnayn-building-capability-en-v2.jpg
      - name: Validate social cards and Arabic source
        run: |
          identify assets/previews/reflection-dhul-qarnayn-building-capability-ar-v2.jpg | grep '1200x630'
          identify assets/previews/reflection-dhul-qarnayn-building-capability-en-v2.jpg | grep '1200x630'
          grep -q 'التميّز 10X' /tmp/card-ar.svg
          grep -q 'ذو القرنين' /tmp/card-ar.svg
          grep -q 'بناء القدرة بدل صناعة الاعتماد' /tmp/card-ar.svg
      - name: Point Open Graph and library previews to new immutable files
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'reflection-dhul-qarnayn-building-capability.html': ('reflection-dhul-qarnayn-building-capability-ar.jpg','reflection-dhul-qarnayn-building-capability-ar-v2.jpg'),
            'en/reflection-dhul-qarnayn-building-capability.html': ('reflection-dhul-qarnayn-building-capability-en.jpg','reflection-dhul-qarnayn-building-capability-en-v2.jpg'),
            'articles.html': ('reflection-dhul-qarnayn-building-capability-ar.jpg','reflection-dhul-qarnayn-building-capability-ar-v2.jpg'),
            'en/articles.html': ('reflection-dhul-qarnayn-building-capability-en.jpg','reflection-dhul-qarnayn-building-capability-en-v2.jpg'),
          }
          for name,(old,new) in replacements.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Expected preview reference missing: {name}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit corrected immutable cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/previews/reflection-dhul-qarnayn-building-capability-*-v2.jpg reflection-dhul-qarnayn-building-capability.html en/reflection-dhul-qarnayn-building-capability.html articles.html en/articles.html
          git diff --cached --quiet || git commit -m 'Regenerate Arabic social preview with native RTL shaping'
          git push