name: Refresh RTA Tamayuz 10X previews
on:
  push:
    paths:
      - '.github/workflows/refresh-rta-previews.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-dejavu-core libraqm0
          python -m pip install pillow
      - name: Generate RTA preview pair
        run: |
          python <<'PY'
          from PIL import Image,ImageDraw,ImageFont,features
          from pathlib import Path
          assert features.check('raqm'), 'RAQM is required for Arabic rendering'
          out=Path('assets/previews'); out.mkdir(parents=True,exist_ok=True)
          navy=(6,35,62); navy2=(10,48,82); dark2=(7,43,74); gold=(242,181,61); white=(248,250,252); muted=(199,214,231)
          ar_reg='/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf'; ar_bold='/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf'; lat_reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'; lat_bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def F(path,size): return ImageFont.truetype(path,size)
          def wrap(draw,text,font,maxw,direction=None,language=None):
              words=text.split(); lines=[]; cur=''
              for w in words:
                  t=(cur+' '+w).strip(); box=draw.textbbox((0,0),t,font=font,direction=direction,language=language)
                  if box[2]-box[0] <= maxw: cur=t
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          def base():
              im=Image.new('RGB',(1200,630),navy); d=ImageDraw.Draw(im)
              d.ellipse((820,-180,1320,320),fill=navy2); d.ellipse((900,160,1360,620),fill=dark2); d.rectangle((25,20,36,610),fill=gold)
              return im,d
          slug='case-rta-adaptive-traffic-control-utc-ux-fusion'
          im,d=base(); x=790
          d.text((x,55),'حالة موثقة · دبي · RTA',font=F(ar_bold,28),fill=white,anchor='ra',direction='rtl',language='ar')
          d.text((x,103),'التميّز 10X',font=F(ar_bold,24),fill=gold,anchor='ra',direction='rtl',language='ar')
          y=205
          for line in wrap(d,'من الإشارة الثابتة إلى شبكة تتعلم قبل الاختناق',F(ar_bold,52),720,'rtl','ar')[:2]: d.text((x,y),line,font=F(ar_bold,52),fill=white,anchor='ra',direction='rtl',language='ar'); y+=72
          y=max(y+22,385)
          for line in wrap(d,'بنية وبيانات ومحاكاة وتجارب تشغيلية قبل التوسع على مستوى المدينة',F(ar_reg,28),720,'rtl','ar')[:2]: d.text((x,y),line,font=F(ar_reg,28),fill=muted,anchor='ra',direction='rtl',language='ar'); y+=43
          d.rectangle((765,520,770,580),fill=gold); d.text((750,535),'الدكتور علاء محمد أحمد',font=F(ar_bold,25),fill=white,anchor='ra',direction='rtl',language='ar'); d.text((1095,150),'التميّز',font=F(ar_bold,50),fill=white,anchor='ra',direction='rtl',language='ar'); d.text((1080,225),'10',font=F(lat_bold,104),fill=white,anchor='ra'); d.text((1110,225),'X',font=F(lat_bold,104),fill=gold,anchor='la')
          im.save(out/f'{slug}-ar.png','PNG',optimize=True)
          im,d=base(); x=82
          d.text((x,55),'EVIDENCE-BASED CASE · DUBAI · RTA',font=F(lat_bold,24),fill=white,anchor='la'); d.text((x,100),'TAMAYUZ 10X',font=F(lat_bold,22),fill=gold,anchor='la')
          y=185
          for line in wrap(d,'From Fixed Timing to a Network That Anticipates Congestion',F(lat_bold,48),710)[:3]: d.text((x,y),line,font=F(lat_bold,48),fill=white,anchor='la'); y+=58
          y=max(y+25,385)
          for line in wrap(d,'Infrastructure, data, simulation and operational trials before citywide scale',F(lat_reg,27),710)[:2]: d.text((x,y),line,font=F(lat_reg,27),fill=muted,anchor='la'); y+=41
          d.rectangle((82,520,87,580),fill=gold); d.text((105,535),'Dr. Alaa Mohammad Ahmed',font=F(lat_bold,23),fill=white,anchor='la'); d.text((1115,150),'Tamayuz',font=F(lat_bold,39),fill=white,anchor='ra'); d.text((1080,225),'10',font=F(lat_bold,104),fill=white,anchor='ra'); d.text((1110,225),'X',font=F(lat_bold,104),fill=gold,anchor='la')
          im.save(out/f'{slug}-en.png','PNG',optimize=True)
          PY
      - name: QA and commit
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in [Path('assets/previews/case-rta-adaptive-traffic-control-utc-ux-fusion-ar.png'),Path('assets/previews/case-rta-adaptive-traffic-control-utc-ux-fusion-en.png')]:
              im=Image.open(p); assert im.size==(1200,630)
          print('RTA preview QA passed')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+alaabmt@users.noreply.github.com
          git add assets/previews/case-rta-adaptive-traffic-control-utc-ux-fusion-ar.png assets/previews/case-rta-adaptive-traffic-control-utc-ux-fusion-en.png
          git commit -m '[preview] Align RTA cards with approved Tamayuz 10X theme' || exit 0
          git push
