name: Enable EGA pronunciation fixes v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-ega-pronunciation-fixes-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add pronunciation fixes loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('case-ega-dx-ultra-innovation.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/js/ega-pronunciation-fixes.js?v=20260907-pron4"></script>'
          if 'assets/js/ega-pronunciation-fixes.js' not in s:
              s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-ega-dx-ultra-innovation.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply EGA pronunciation fixes v4 [skip ci]"
            git push origin main
          fi
