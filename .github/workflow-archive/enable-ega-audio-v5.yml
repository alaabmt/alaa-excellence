name: Enable EGA audio player v5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-ega-audio-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace legacy EGA pronunciation scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('case-ega-dx-ultra-innovation.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'<script src="assets/js/ega-pronunciation-test\.js\?v=[^"]+"></script>', '', s)
          s = re.sub(r'<script src="assets/js/ega-pronunciation-fixes\.js\?v=[^"]+"></script>', '', s)
          s = re.sub(r'<script src="assets/js/ega-visible-diacritics\.js\?v=[^"]+"></script>', '', s)
          marker = '</body></html>'
          loader = '<script src="assets/js/ega-audio-player-v5.js?v=20260907-audio5"></script>'
          if loader not in s:
              s = s.replace(marker, loader + marker)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-ega-dx-ultra-innovation.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use improved floating EGA audio player [skip ci]"
          git push
