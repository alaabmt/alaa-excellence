name: Enable EGA audio v7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-ega-audio-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use fully vocalized audio player with tanween fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('case-ega-dx-ultra-innovation.html')
          s = p.read_text(encoding='utf-8')
          tanween = '<script src="assets/js/arabic-tts-tanween-fix.js?v=20260907-tanween1"></script>'
          old = 'assets/js/ega-audio-player-v7.js?v=20260907-audio7'
          new = 'assets/js/ega-audio-player-v7.js?v=20260907-audio8'
          if tanween not in s:
              marker = '<script src="assets/js/ega-audio-player-v7.js'
              i = s.find(marker)
              if i >= 0:
                  s = s[:i] + tanween + s[i:]
              else:
                  s = s.replace('</body>', tanween + '</body>')
          s = s.replace(old, new)
          if new not in s:
              s = s.replace('</body>', f'<script src="{new}"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add case-ega-dx-ultra-innovation.html
          git commit -m 'Fix doubled tanween pronunciation in EGA audio [skip ci]'
          git push