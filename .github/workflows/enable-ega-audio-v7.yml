name: Enable EGA audio v7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-ega-audio-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use fully vocalized audio player
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('case-ega-dx-ultra-innovation.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/js/ega-audio-player-v5.js?v=20260907-audio6'
          new = 'assets/js/ega-audio-player-v7.js?v=20260907-audio7'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              s = s.replace('</body>', f'<script src="{new}"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add case-ega-dx-ultra-innovation.html
          git commit -m 'Use fully vocalized EGA audio layer [skip ci]'
          git push