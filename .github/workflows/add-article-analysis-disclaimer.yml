name: Validate article editorial disclaimer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate disclaimer presence without rewriting content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          required = 'الآراء والتحليلات الواردة في هذا المقال تمثل رأي الكاتب وتحليله المهني استنادًا إلى المصادر المشار إليها'
          pages = sorted(set(Path('.').glob('article-*.html')) | set(Path('.').glob('case-*.html')) | set(Path('.').glob('idea-*.html')))
          missing = []
          for p in pages:
              text = p.read_text(encoding='utf-8')
              if required not in text:
                  missing.append(str(p))
          if missing:
              print('Missing approved editorial disclaimer:', file=sys.stderr)
              print('\n'.join(missing), file=sys.stderr)
              raise SystemExit(1)
          print(f'Editorial disclaimer present on {len(pages)} article/case/idea pages. No files modified.')
          PY
