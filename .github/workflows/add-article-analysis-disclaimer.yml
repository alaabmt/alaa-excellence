name: Validate article editorial disclaimer

on:
  pull_request:
    paths:
      - 'article-*.html'
      - 'case-*.html'
      - 'idea-*.html'
      - 'en/article-*.html'
      - 'en/case-*.html'
      - 'en/idea-*.html'
      - '.github/workflows/add-article-analysis-disclaimer.yml'
  push:
    branches: [main]
    paths:
      - 'article-*.html'
      - 'case-*.html'
      - 'idea-*.html'
      - 'en/article-*.html'
      - 'en/case-*.html'
      - 'en/idea-*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate disclaimer presence without rewriting content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          required = {
              'ar': 'الآراء والتحليلات الواردة في هذا المقال تمثل رأي الكاتب وتحليله المهني استنادًا إلى المصادر المشار إليها',
              'en': 'do not necessarily represent the official positions',
          }
          patterns = ('article-*.html', 'case-*.html', 'idea-*.html')
          groups = {
              'ar': sorted({p for pat in patterns for p in Path('.').glob(pat)}),
              'en': sorted({p for pat in patterns for p in Path('en').glob(pat)}),
          }
          # Redirect stubs and unpublished drafts carry noindex and no article body.
          noindex = re.compile(r'<meta(?=[^>]*robots)(?=[^>]*noindex)[^>]*>', re.I)
          missing, checked = [], 0
          for lang, pages in groups.items():
              for p in pages:
                  text = p.read_text(encoding='utf-8')
                  if noindex.search(text):
                      continue
                  checked += 1
                  if required[lang] not in text:
                      missing.append(str(p))
          if missing:
              print('Missing approved editorial disclaimer:', file=sys.stderr)
              print('\n'.join(missing), file=sys.stderr)
              raise SystemExit(1)
          print(f'Editorial disclaimer present on {checked} indexable article/case/idea pages. No files modified.')
          PY
