name: Install Arabic TTS standard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-arabic-tts-standard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add site-wide Arabic TTS standard
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="assets/js/arabic-tts-standard.js?v=20260907-tts1"></script>'
          old_tanween = '<script src="assets/js/arabic-tts-tanween-fix.js?v=20260907-tanween1"></script>'
          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              original = s
              s = s.replace(old_tanween, '')
              if tag not in s:
                  marker = '<script src="assets/js/site-engagement.js'
                  i = s.find(marker)
                  if i >= 0:
                      s = s[:i] + tag + s[i:]
                  else:
                      s = s.replace('</body>', tag + '</body>')
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print(f'Updated {len(changed)} HTML pages')
          for name in changed:
              print(name)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Apply Arabic TTS standard across site [skip ci]'
          git push