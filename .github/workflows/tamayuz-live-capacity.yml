name: Tamayuz Live temporary capacity test (600 x 9)
on:
  push:
    branches:
      - test/tamayuz-live-capacity-20261112
    paths:
      - .github/workflows/tamayuz-live-capacity.yml
permissions:
  contents: read
concurrency:
  group: tamayuz-load-test-20261112
  cancel-in-progress: false
jobs:
  load-test:
    name: Temporary session API load and response verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/test/tamayuz-live-capacity-20261112'
    env:
      EXPLICIT_PRODUCTION_LOAD_TEST: 'YES'
      TEST_JOIN_CODE: 'A3E6831879'
      TEST_SESSION_ID: 'd4d0cfa7-5b36-4c7d-9709-349827dfaa5d'
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm Node runtime and isolation
        run: |
          node --version
          test "$GITHUB_REF" = "refs/heads/test/tamayuz-live-capacity-20261112"
          test -f tests/tamayuz-live-capacity-600x9.mjs
      - name: Run budgeted 600-virtual-participant / 9-question test
        run: node tests/tamayuz-live-capacity-600x9.mjs
      - name: Upload redacted metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tamayuz-600x9-capacity-metrics
          path: capacity-results.json
          if-no-files-found: warn
          retention-days: 7
