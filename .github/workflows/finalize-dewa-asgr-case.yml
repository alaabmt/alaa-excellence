name: Finalize DEWA ASGR terminology QA
on:
  push:
    paths:
      - '.github/workflows/finalize-dewa-asgr-case.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply terminology fixes
        run: |
          python <<'PY'
          from pathlib import Path
          ar=Path('case-dewa-asgr-self-healing-grid.html')
          s=ar.read_text(encoding='utf-8')
          old='وفي وصف تشغيلي نشرته DEWA في يونيو 2026، ذكرت أن المحطات على طول المغذي مزودة بأجهزة إلكترونية ذكية ووحدات طرفية بعيدة، وأن بروتوكولات اتصال حديثة تربط المحطات ببعضها وبمركز التحكم. عند انقطاع مغذٍ، يعزل النظام الجزء المتأثر ويحوّل العملاء الممكن تغذيتهم إلى دوائر مجاورة. [4]'
          new='وفي وصف تشغيلي نشرته DEWA في يونيو 2026، ذكرت أن المحطات على طول المغذي مزودة بـ<span class="term">IED — Intelligent Electronic Device — جهاز إلكتروني ذكي</span>، وهو جهاز يراقب حالة المعدّة وينفذ وظائف الحماية والتحكم، وبـ<span class="term">RTU — Remote Terminal Unit — وحدة طرفية بعيدة</span>، وهي وحدة تنقل بيانات الموقع إلى مركز التحكم وتستقبل أوامر التشغيل عن بُعد. وتربط بروتوكولات اتصال حديثة المحطات ببعضها وبمركز التحكم. عند انقطاع مغذٍ، يعزل النظام الجزء المتأثر ويحوّل العملاء الممكن تغذيتهم إلى دوائر مجاورة. [4]'
          if old not in s: raise SystemExit('Arabic terminology target not found')
          ar.write_text(s.replace(old,new),encoding='utf-8')

          en=Path('en/case-dewa-asgr-self-healing-grid.html')
          s=en.read_text(encoding='utf-8')
          old='In a June 2026 operational description, DEWA stated that substations along the feeder are equipped with intelligent electronic devices and remote terminal units, with modern communication protocols linking substations to one another and to the distribution control centre. When a feeder is interrupted, the system isolates the affected section and transfers restorable customers to adjacent circuits. [4]'
          new='In a June 2026 operational description, DEWA stated that substations along the feeder are equipped with <span class="term">IED — Intelligent Electronic Device</span>, a device that monitors equipment status and performs protection and control functions, and <span class="term">RTU — Remote Terminal Unit</span>, a field unit that sends site data to the control centre and receives remote operating commands. Modern communication protocols link substations to one another and to the distribution control centre. When a feeder is interrupted, the system isolates the affected section and transfers restorable customers to adjacent circuits. [4]'
          if old not in s: raise SystemExit('English terminology target not found')
          en.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: QA
        run: |
          grep -q 'IED — Intelligent Electronic Device — جهاز إلكتروني ذكي' case-dewa-asgr-self-healing-grid.html
          grep -q 'RTU — Remote Terminal Unit — وحدة طرفية بعيدة' case-dewa-asgr-self-healing-grid.html
          grep -q 'IED — Intelligent Electronic Device' en/case-dewa-asgr-self-healing-grid.html
          grep -q 'RTU — Remote Terminal Unit' en/case-dewa-asgr-self-healing-grid.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add case-dewa-asgr-self-healing-grid.html en/case-dewa-asgr-self-healing-grid.html
          git commit -m '[case] Complete DEWA ASGR technical term definitions' || exit 0
          git push
