name: Add case social preview standard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-case-social-preview-standard.yml'

permissions:
  contents: write

jobs:
  update-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update case preview standards
        run: |
          python - <<'PY'
          from pathlib import Path

          manual_path = Path('10X_Agent_AI_Master_Operating_Manual_AR.md')
          manual = manual_path.read_text(encoding='utf-8')

          old_social = '''## 14. المشاركة الاجتماعية
- مقاس البطاقة المفضل: 1200×630.
- لا ترسم نصاً عربياً معقداً داخل PNG بوسيلة لا تدعم Arabic shaping وBidi بصورة صحيحة.
- يمكن إبقاء الصورة بصرية بسيطة، مع إبقاء العنوان والوصف العربيين في `og:title` و`og:description` وTwitter metadata.
- استخدم cache busting عند استبدال الصور أو السكربتات الحساسة للكاش.
'''

          new_social = '''## 14. المشاركة الاجتماعية وبطاقات حالات 10X
- المرجع المتخصص الإلزامي لحالات 10X: `10X_CASE_SOCIAL_PREVIEW_STANDARD.md`.
- مقاس البطاقة المفضل: 1200×630.
- لكل حالة 10X منشورة بالعربية والإنجليزية يجب إنشاء **بطاقتي معاينة مستقلتين**: نسخة عربية ونسخة إنجليزية، ولا يجوز استخدام صورة نصية واحدة مشتركة للغتين عندما تحتوي البطاقة على نص.
- بطاقة المعاينة ليست غلافاً زخرفياً؛ هي **وعد معرفي مصغر** يلخص سبب استحقاق الحالة للفتح.
- يجب أن تتضمن البطاقة، بقدر يسمح به التصميم: هوية **التميّز 10X / Tamayuz 10X**، تصنيف الحالة، عنواناً مختصراً، التحول الجوهري أو الفكرة المركزية، ونتيجة موثقة واحدة أو اثنتين عندما تتوافر، واسم المؤلف **الدكتور علاء محمد أحمد / Dr. Alaa Mohammad Ahmed**.
- لا يوضع أي رقم في البطاقة ما لم يكن موثقاً داخل الحالة ويمكن تتبع مصدره. يجب الحفاظ على سياق الرقم وعدم تحويل هدف أو تقدير أو ادعاء مؤسسي إلى نتيجة مؤكدة.
- إذا لم توجد نتيجة كمية قوية، استخدم دليلاً تشغيلياً أو تغيراً موثقاً في القدرة أو نموذج التشغيل بدلاً من اختراع رقم أو استخدام رقم ضعيف.
- يجب أن تكون صياغة البطاقة العربية عربية أصلية طبيعية، والإنجليزية إنجليزية أصلية طبيعية؛ لا تُترجم البطاقة كلمة بكلمة.
- يجب أن تتطابق النسختان دلالياً في جوهر التحول والنتائج وحدود اليقين، مع السماح باختلاف الصياغة والإيقاع.
- حدّث `og:image` و`twitter:image` لكل نسخة لغوية إلى بطاقتها الخاصة، مع `og:image:alt` و`twitter:image:alt` المناسبين لكل لغة.
- لا ترسم نصاً عربياً معقداً داخل PNG بوسيلة لا تدعم Arabic shaping وBidi بصورة صحيحة.
- استخدم cache busting عند استبدال الصور أو السكربتات الحساسة للكاش.
- قبل اعتماد النشر اختبر أن الرابط العربي يعرض البطاقة العربية والرابط الإنجليزي يعرض البطاقة الإنجليزية، وأن النصوص والأرقام والاسم لا تُقص أو تنكسر على الهاتف.
'''

          if old_social not in manual:
              raise SystemExit('Manual social-sharing section anchor not found')
          manual = manual.replace(old_social, new_social, 1)

          qg_anchor = '- canonical وmetadata وschema وsitemap.\n- نجاح Pages للـhead الحالي قبل إعلان النشر.'
          qg_new = '- canonical وmetadata وschema وsitemap.\n- بطاقة معاينة اجتماعية مستقلة بالعربية والإنجليزية لكل حالة 10X، مع تحقق دقة الأرقام والـmetadata والقص البصري.\n- نجاح Pages للـhead الحالي قبل إعلان النشر.'
          if qg_anchor not in manual:
              raise SystemExit('Quality Gate anchor not found')
          manual = manual.replace(qg_anchor, qg_new, 1)

          files_anchor = '- `BILINGUAL-SITE-PARITY-STANDARD.md`: تطابق البنية والحجج والأرقام والمراجع بين النسختين العربية والإنجليزية.\n'
          files_new = files_anchor + '- `10X_CASE_SOCIAL_PREVIEW_STANDARD.md`: المعيار الإلزامي لبطاقات معاينة حالات 10X العربية والإنجليزية ونتائجها الموثقة.\n'
          if files_anchor not in manual:
              raise SystemExit('Manual files-list anchor not found')
          manual = manual.replace(files_anchor, files_new, 1)
          manual_path.write_text(manual, encoding='utf-8')

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text(encoding='utf-8')
          agent_anchor = '1. Read `10X_Agent_AI_Master_Operating_Manual_AR.md` from `main` as the highest project operating reference.\n'
          agent_new = agent_anchor + '2. For every 10X case, before publishing or changing social preview imagery, read and apply `10X_CASE_SOCIAL_PREVIEW_STANDARD.md`. Every bilingual case must have separate Arabic and English preview cards whose claims and numbers are evidence-backed.\n'
          if agent_anchor not in agents:
              raise SystemExit('AGENTS anchor not found')
          agents = agents.replace(agent_anchor, agent_new, 1)
          # Renumber existing items 2-9 to 3-10.
          for n in range(9, 1, -1):
              agents = agents.replace(f'\n{n}. ', f'\n{n+1}. ')
          agents_path.write_text(agents, encoding='utf-8')

          standard = '''# 10X Case Social Preview Standard\n\nهذا الملف مرجع إلزامي لكل حالة 10X جديدة أو محدثة عند إنشاء أو استبدال صورة المشاركة الاجتماعية.\n\n## القاعدة الأساسية\nبطاقة المشاركة ليست زينة ولا نسخة مصغرة من الصفحة؛ هي **وعد معرفي مصغر** يبين بسرعة: ما الحالة، ما التحول الجوهري، وما الدليل الذي يجعلها جديرة بالفتح.\n\n## 1. ثنائية اللغة\n- لكل حالة عربية/إنجليزية صورتان مستقلتان: `*-ar.png` و`*-en.png` أو تسمية مكافئة واضحة.\n- البطاقة العربية تُكتب كعربية أصلية، والإنجليزية كإنجليزية أصلية، لا ترجمة حرفية.\n- يجب أن تتطابق النسختان دلالياً في جوهر الحالة والنتيجة وحدود اليقين.\n\n## 2. العناصر المطلوبة\nيُفضّل أن تحتوي البطاقة على:\n1. هوية **التميّز 10X / Tamayuz 10X**.\n2. توصيف مختصر مثل **حالة موثقة / Evidence-Based 10X Case**.\n3. عنوان مختصر واضح.\n4. سطر يشرح التحول الجوهري أو الفكرة المركزية.\n5. نتيجة موثقة واحدة أو اثنتان عندما تكون قوية ومفهومة بصرياً.\n6. اسم المؤلف: **الدكتور علاء محمد أحمد / Dr. Alaa Mohammad Ahmed**.\n\n## 3. قاعدة الدليل\n- لا يظهر رقم في البطاقة إلا إذا كان موجوداً ومسنوداً في الحالة المنشورة.\n- ميّز بين النتيجة الفعلية والهدف والتقدير والادعاء المؤسسي.\n- لا تختزل رقمًا بطريقة تغيّر معناه أو نطاقه أو الفترة التي يقيسها.\n- إذا كانت السببية غير مثبتة، لا تجعل صياغة البطاقة توحي بها.\n- إذا لم توجد نتيجة كمية قوية، استخدم دليلاً تشغيلياً موثقاً أو تغيراً في القدرة أو نموذج التشغيل بدلاً من رقم ضعيف.\n\n## 4. معيار المحتوى\nأفضل بطاقة تجيب بصرياً عن ثلاثة أسئلة:\n**ما الذي تغيّر؟ لماذا يهم؟ ما الدليل؟**\n\nلا تستخدم تسميات تحريرية داخلية مثل Evidence Pack أو Company Insider Critique أو أسماء أقسام المقال كبديل عن الفكرة نفسها.\n\n## 5. التنفيذ التقني\n- المقاس المرجعي: **1200×630**.\n- استخدم محركاً يدعم Arabic shaping وBidi عند رسم العربية داخل الصورة.\n- اربط العربية بـ`og:image` و`twitter:image` العربيين، والإنجليزية بنسختها الإنجليزية.\n- أضف `og:image:alt` و`twitter:image:alt` بلغة الصفحة.\n- استخدم cache busting عند استبدال الصورة.\n- احتفظ بـcanonical الصفحة دون تغيير بسبب cache المشاركة.\n\n## 6. بوابة الجودة قبل النشر\nتحقق من:\n- صحة العنوان والتحول الجوهري.\n- صحة كل رقم وارتباطه بالمصدر داخل الحالة.\n- عدم المبالغة السببية أو حذف قيد مهم.\n- استقلال النسخة العربية والإنجليزية لغوياً مع التكافؤ الدلالي.\n- سلامة اتجاه العربية وعدم تقطع الحروف.\n- وضوح النص والاسم والأرقام على الهاتف.\n- تطابق `og:image` و`twitter:image` مع لغة الصفحة.\n- نجاح GitHub Pages للـexact latest head قبل إعلان أن التحديث حي.\n\n## 7. تذكير للحالات الجديدة\nعند إنهاء أي حالة 10X جديدة، لا تعتبر حزمة النشر مكتملة حتى توجد بطاقة عربية وبطاقة إنجليزية مستندتان إلى Evidence Pack الخاص بالحالة، وتُختبران ضمن Final Quality Gate.\n'''
          Path('10X_CASE_SOCIAL_PREVIEW_STANDARD.md').write_text(standard, encoding='utf-8')
          PY

      - name: Commit standards update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 10X_Agent_AI_Master_Operating_Manual_AR.md AGENTS.md 10X_CASE_SOCIAL_PREVIEW_STANDARD.md
          git diff --cached --quiet && exit 0
          git commit -m "[standards] Add bilingual 10X case preview requirement"
          git push
