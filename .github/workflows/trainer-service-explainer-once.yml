name: One-time trainer UX escape fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trainer-service-explainer-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix escaping helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/learning-preference-profile/session-ui.js')
          s = p.read_text(encoding='utf-8')
          old = "'\\\"':'&quot'"
          new = "'\\\"':'&quot;'"
          if old not in s:
              raise SystemExit('escape pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "alaabmt"
          git config user.email "160816140+alaabmt@users.noreply.github.com"
          git add tools/learning-preference-profile/session-ui.js
          git commit -m "[trainer] Fix session UI escaping"
          git push origin main
