name: Bilingual site synchronization

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run a full Arabic-to-English synchronization'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'en/*.html'
      - 'scripts/bilingual_sync.py'
      - 'scripts/normalize_language_pairs.py'
      - '.github/workflows/bilingual-site-sync.yml'
      - '10X_Agent_AI_Master_Operating_Manual_AR.md'
      - 'ARABIC-LANGUAGE-AND-TTS-STANDARD.md'
      - 'BILINGUAL-SITE-PARITY-STANDARD.md'
      - '10X_ENGLISH_EDITORIAL_TRANSLATION_AND_HUMAN_STYLE_STANDARD.md'
      - 'ENGLISH-BIOGRAPHY-CV-SOURCE-OF-TRUTH.md'

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: bilingual-site-sync
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read governing standards
        run: |
          test -s 10X_Agent_AI_Master_Operating_Manual_AR.md
          test -s BILINGUAL-SITE-PARITY-STANDARD.md
          test -s ARABIC-LANGUAGE-AND-TTS-STANDARD.md
          test -s ENGLISH-BIOGRAPHY-CV-SOURCE-OF-TRUTH.md
          if [[ -f 10X_ENGLISH_EDITORIAL_TRANSLATION_AND_HUMAN_STYLE_STANDARD.md ]]; then
            test -s 10X_ENGLISH_EDITORIAL_TRANSLATION_AND_HUMAN_STYLE_STANDARD.md
          fi
          echo 'Governing bilingual standards loaded.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install synchronization dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.5 transformers==4.57.1 sentencepiece==0.2.1 sacremoses==0.1.1
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Determine synchronization mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          printf '%s\n' "$changed" > /tmp/bilingual-changed.txt
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/bilingual_sync\.py|scripts/normalize_language_pairs\.py|\.github/workflows/bilingual-site-sync\.yml|10X_Agent_AI_Master_Operating_Manual_AR\.md|ARABIC-LANGUAGE-AND-TTS-STANDARD\.md|BILINGUAL-SITE-PARITY-STANDARD\.md|10X_ENGLISH_EDITORIAL_TRANSLATION_AND_HUMAN_STYLE_STANDARD\.md)$'; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=changed' >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve CV-backed English biography
        shell: bash
        run: |
          cp en/about.html /tmp/en-about-cv.html
          echo 'Preserved en/about.html as the author-approved CV-backed English biography.'

      - name: Normalize reciprocal page links
        shell: bash
        run: python scripts/normalize_language_pairs.py

      - name: Synchronize Arabic and English pages
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          if [[ "${{ steps.mode.outputs.mode }}" == "full" ]]; then
            python scripts/bilingual_sync.py --full-ar
          else
            export BILINGUAL_CHANGED_FILES="$(cat /tmp/bilingual-changed.txt)"
            python scripts/bilingual_sync.py --changed
          fi

      - name: Restore CV-backed English biography
        shell: bash
        run: |
          cp /tmp/en-about-cv.html en/about.html
          echo 'Restored CV-backed en/about.html after generic translation sync.'

      - name: Validate structural parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import sys

          excluded = {'contact-madar.html', 'about.html'}
          failures = []
          for ar in sorted(Path('.').glob('*.html')):
              if ar.name in excluded:
                  continue
              en = Path('en') / ar.name
              if not en.exists():
                  failures.append(f'missing counterpart: {en}')
                  continue
              a = BeautifulSoup(ar.read_text(encoding='utf-8'), 'html.parser')
              e = BeautifulSoup(en.read_text(encoding='utf-8'), 'html.parser')
              for soup in (a, e):
                  for t in soup(['script','style']):
                      t.decompose()
              a_sections = [x.name for x in a.find_all(['main','section','article','aside','footer'])]
              e_sections = [x.name for x in e.find_all(['main','section','article','aside','footer'])]
              if a_sections != e_sections:
                  failures.append(f'section structure mismatch: {ar.name}')
              if not a.html or a.html.get('lang') != 'ar' or a.html.get('dir') != 'rtl':
                  failures.append(f'Arabic language metadata invalid: {ar}')
              if not e.html or e.html.get('lang') != 'en' or e.html.get('dir') != 'ltr':
                  failures.append(f'English language metadata invalid: {en}')
              for page, expected in ((a, 'ar'), (e, 'en')):
                  ar_alt = page.find('link', attrs={'hreflang':'ar'})
                  en_alt = page.find('link', attrs={'hreflang':'en'})
                  if not ar_alt or not en_alt:
                      failures.append(f'hreflang metadata missing: {ar.name} {expected}')
              ar_switch = a.find('a', attrs={'hreflang':'en'})
              en_switch = e.find('a', attrs={'hreflang':'ar'})
              expected_en = '/en/' if ar.name == 'index.html' else f'/en/{ar.name}'
              expected_ar = '/' if ar.name == 'index.html' else f'/{ar.name}'
              if ar_switch and ar_switch.get('href') != expected_en:
                  failures.append(f'Arabic switch target invalid: {ar.name}')
              if en_switch and en_switch.get('href') != expected_ar:
                  failures.append(f'English switch target invalid: {en}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          print('Structural bilingual parity gate passed for all generic root public HTML pages. about.html is governed by the author-approved English CV source.')
          PY

      - name: Validate CV-backed English biography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re, sys
          p = Path('en/about.html')
          s = BeautifulSoup(p.read_text(encoding='utf-8'), 'html.parser')
          text = ' '.join(s.stripped_strings)
          failures = []
          if not s.html or s.html.get('lang') != 'en' or s.html.get('dir') != 'ltr':
              failures.append('en/about.html must be English LTR')
          required = [
              'Nursing Leader',
              'Healthcare Quality',
              '32 quality-improvement projects',
              'seven hospitals',
              'more than 500 nurses',
              'more than 100 process-improvement projects'
          ]
          for phrase in required:
              if phrase.lower() not in text.lower():
                  failures.append(f'CV-backed phrase missing: {phrase}')
          forbidden = [
              '14 hospitals', '50 clinics', '250 improvement projects', '2,500 trainees',
              'executive leader and expert in corporate excellence, transformation, quality and innovation'
          ]
          for phrase in forbidden:
              if phrase.lower() in text.lower():
                  failures.append(f'unsupported biography claim present: {phrase}')
          ar = re.compile(r'[\u0600-\u06FF]')
          for node in s.find_all(string=True):
              parent = node.parent
              if not parent or parent.name in {'script','style','code','pre','svg','noscript'}:
                  continue
              t = ' '.join(str(node).split())
              if not t or not ar.search(t):
                  continue
              if parent.name == 'a' and (parent.get('lang') == 'ar' or parent.get('hreflang') == 'ar'):
                  continue
              failures.append(f'Arabic visible in en/about.html: {t[:80]}')
              break
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          print('CV-backed English biography gate passed.')
          PY

      - name: Commit synchronized pages
        id: commit
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No bilingual synchronization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/ '*.html' .bilingual-translation-cache.json
          git commit -m 'Synchronize Arabic and English site editions [skip bilingual-sync]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build for synchronized head
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Record synchronization summary
        shell: bash
        run: |
          echo '## Tamayuz 10X bilingual synchronization' >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ steps.mode.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository head after run: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Generic Arabic and English pages remain structurally paired. The English biography is governed by the author-approved CV source.' >> "$GITHUB_STEP_SUMMARY"
