name: Fix Arabic homepage brand label

on:
  push:
    paths:
      - '.github/workflows/fix-arabic-homepage-brand-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-brand-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read governing standards
        run: |
          test -s 10X_Agent_AI_Master_Operating_Manual_AR.md
          test -s ARABIC-LANGUAGE-AND-TTS-STANDARD.md

      - name: Correct Arabic homepage visible brand label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          old = s

          s = s.replace(
              '<span class="eyebrow">التميّز 10X — Tamayuz 10X</span>',
              '<span class="eyebrow">التميّز 10X</span>',
              1,
          )
          s = s.replace(
              'alt="شعار التميّز 10X — Tamayuz 10X"',
              'alt="شعار التميّز 10X"',
              1,
          )

          if s == old:
              raise SystemExit('Expected Arabic homepage brand label was not found.')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify Arabic homepage brand label
        run: |
          grep -F '<span class="eyebrow">التميّز 10X</span>' index.html
          ! grep -F '<span class="eyebrow">التميّز 10X — Tamayuz 10X</span>' index.html
          grep -F 'alt="شعار التميّز 10X"' index.html

      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Arabic-only brand label on Arabic homepage'
          git pull --rebase origin main
          git push origin HEAD:main
