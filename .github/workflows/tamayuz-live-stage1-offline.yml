name: Tamayuz Live Stage 1 Offline QA
on:
  pull_request:
    paths:
      - 'live/**'
      - '.github/workflows/tamayuz-live-stage1-offline.yml'
  push:
    paths:
      - 'live/**'
      - '.github/workflows/tamayuz-live-stage1-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 1 source and syntax without backend access
        run: node live/stage1/stage1-smoke.cjs
