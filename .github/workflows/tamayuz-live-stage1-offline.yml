name: Tamayuz Live Stage 1 Offline QA
on:
  pull_request:
    paths:
      - 'live/**'
      - '.github/workflows/tamayuz-live-stage1-offline.yml'
  push:
    paths:
      - 'live/**'
      - '.github/workflows/tamayuz-live-stage1-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate Stage 1 source and syntax without backend access
        run: node live/stage1/stage1-smoke.cjs
