name: Publish Work Approach Assessment into Tamayuz 10X

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-work-approach-assessment.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy assessment into Tamayuz 10X
        run: |
          set -euo pipefail
          mkdir -p tools/work-approach-assessment
          base='https://raw.githubusercontent.com/alaabmt/work-preference-flex/main'
          curl -fsSL "$base/index.html" -o tools/work-approach-assessment/index.html
          curl -fsSL "$base/ar.html" -o tools/work-approach-assessment/ar.html
          curl -fsSL "$base/en.html" -o tools/work-approach-assessment/en.html
          curl -fsSL "$base/item-bank.json" -o tools/work-approach-assessment/item-bank.json
          curl -fsSL "$base/manifest.json" -o tools/work-approach-assessment/manifest.json
          curl -fsSL "$base/how_do_you_respond_at_work.png" -o tools/work-approach-assessment/how_do_you_respond_at_work.png

      - name: Update assessment card on personality page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('personality.html')
          text = p.read_text(encoding='utf-8')
          old = '<article class="test-card"><h3>Work Preferences</h3><p>كيف تفضّل أن تعمل؟ ما البيئة التي تُظهر أفضل ما لديك؟</p><a class="btn" href="#" target="_blank">رابط الاختبار</a></article>'
          new = '<article class="test-card"><h3>Work Approach Assessment</h3><p>تقييم يساعدك على فهم الطريقة التي تميل بها إلى التعامل مع مواقف العمل، ومتى يكون أسلوبك مناسبًا، وكيف تتعامل بفعالية أكبر مع أشخاص قد يعملون بطريقة مختلفة عنك.</p><a class="btn" href="tools/work-approach-assessment/">ابدأ التقييم</a></article>'
          if old not in text:
              raise SystemExit('Expected Work Preferences card was not found')
          text = text.replace(old, new, 1)
          text = text.replace('الروابط الحالية placeholders. أضف فقط الاختبارات التي تريد اعتمادها، مع توضيح الجهة المالكة وما إذا كانت مجانية أو مدفوعة.', 'بعض أدوات القياس ما زالت قيد الإعداد. سيتم تفعيل كل أداة عند اعتمادها للنشر.')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit published assessment
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain tools/work-approach-assessment)" ]; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personality.html tools/work-approach-assessment
          git commit -m 'Integrate Work Approach Assessment into Tamayuz 10X [skip ci]'
          git push
