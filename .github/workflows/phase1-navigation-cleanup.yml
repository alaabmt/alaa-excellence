name: Phase 1 navigation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-navigation-cleanup.yml'

permissions:
  contents: write

jobs:
  normalize-navigation:
    if: ${{ !contains(github.event.head_commit.message, '[nav-phase1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize public navigation only
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          ar_items = [
              ('/', 'الرئيسية', 'home'),
              ('/about.html', 'عن الدكتور علاء محمد أحمد', 'about'),
              ('/#tenx-10x', 'التميّز 10X', 'tenx'),
              ('/articles.html', 'حالات وتجارب 10X', 'articles'),
              ('/research.html', 'الأبحاث والمنشورات', 'research'),
              ('/personality.html', 'مختبر اكتشاف الذات', 'personality'),
              ('/training.html', 'بناء القدرات', 'training'),
          ]
          en_items = [
              ('/en/', 'Home', 'home'),
              ('/en/about.html', 'About Dr. Alaa Mohammad Ahmed', 'about'),
              ('/en/#tenx-10x', 'Tamayuz 10X', 'tenx'),
              ('/en/articles.html', '10X Cases &amp; Experiences', 'articles'),
              ('/en/research.html', 'Research &amp; Publications', 'research'),
              ('/en/personality.html', 'Self-Discovery Lab', 'personality'),
              ('/en/training.html', 'Capability Building', 'training'),
          ]

          def active_key(path: Path, is_en: bool):
              rel = path.as_posix()
              name = path.name
              if (is_en and rel == 'en/index.html') or (not is_en and rel == 'index.html'):
                  return 'home'
              if name == 'about.html': return 'about'
              if name == 'research.html': return 'research'
              if name == 'personality.html': return 'personality'
              if name == 'training.html': return 'training'
              if name == 'articles.html' or name.startswith('article-') or name.startswith('case-'):
                  return 'articles'
              return None

          def build_nav(items, active):
              links = []
              for href, label, key in items:
                  cls = ' class="active"' if key == active else ''
                  links.append(f'<a{cls} href="{href}">{label}</a>')
              return '<nav class="main-nav"><div class="container nav-links">' + ''.join(links) + '</div></nav>'

          nav_pattern = re.compile(r'<nav class="main-nav"><div class="container nav-links">.*?</div></nav>', re.S)
          changed = []

          for path in list(root.glob('*.html')) + list((root / 'en').glob('*.html')):
              # Authentication/account pages and non-public app surfaces are deliberately untouched.
              if 'account' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '<nav class="main-nav">' not in text:
                  continue
              is_en = path.parts[0] == 'en'
              new_nav = build_nav(en_items if is_en else ar_items, active_key(path, is_en))
              new_text, count = nav_pattern.subn(new_nav, text, count=1)
              if count and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.as_posix())

          # Stable anchor for the existing 10X philosophy section; no content redesign in Phase 1.
          for hp in [Path('index.html'), Path('en/index.html')]:
              if not hp.exists():
                  continue
              text = hp.read_text(encoding='utf-8')
              if 'id="tenx-10x"' not in text:
                  new_text, count = re.subn(
                      r'<section([^>]*?)class="tenx-philosophy"',
                      r'<section\1id="tenx-10x" class="tenx-philosophy"',
                      text,
                      count=1,
                  )
                  if count:
                      hp.write_text(new_text, encoding='utf-8')
                      if hp.as_posix() not in changed:
                          changed.append(hp.as_posix())

          print(f'Updated {len(changed)} public HTML files')
          for p in changed:
              print(p)

      - name: Commit navigation-only changes
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'en/*.html'
          git commit -m "[nav-phase1] Simplify bilingual site navigation"
          git push
