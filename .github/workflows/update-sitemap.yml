name: Maintain sitemap and crawlability

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'robots.txt'
      - 'scripts/update_sitemap.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-maintenance-main
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate crawlability and regenerate sitemap
        run: python3 scripts/update_sitemap.py

      - name: Commit sitemap when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already current."
            exit 0
          fi
          git commit -m "Update sitemap from page canonicals and Git dates [skip ci]"
          git pull --rebase origin main
          git push origin main
