name: Fix homepage latest 10X case once

on:
  push:
    paths:
      - '.github/workflows/fix-home-latest-case-once.yml'

permissions:
  contents: write

jobs:
  patch-homepages:
    if: contains(github.event.head_commit.message, '[ops] install homepage latest case fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load latest case script on both homepages
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="/assets/js/homepage-latest-case.js?v=20260913-latestcase2"></script>'
          for name in ('index.html', 'en/index.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'homepage-latest-case.js' not in s:
                  s = s.replace('</body></html>', tag + '\n</body></html>')
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[home] Load latest 10X case directly on homepages'
          git push
