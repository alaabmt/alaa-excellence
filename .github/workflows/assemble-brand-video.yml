name: Assemble brand video
on:
  push:
    branches: [main]
    paths:
      - '.upload/trigger'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify video
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          src=Path('assets/videos/madar-brand-intro-tiny50.b64')
          raw=base64.b64decode(src.read_text().strip(), validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          print('decoded bytes', len(raw), 'sha256', digest)
          assert len(raw) == 8314, f'Unexpected size: {len(raw)}'
          assert digest == '1954246fe5175dfb30c15798b6fc7cefab52e20229f475e92705d5b9bd0d7741', 'SHA256 mismatch'
          out=Path('assets/videos/madar-brand-intro.mp4')
          out.write_bytes(raw)
          PY
          rm -rf .upload
          rm -f assets/videos/madar-brand-intro-tiny48.b64 assets/videos/madar-brand-intro-tiny50.b64
          rm -f .github/workflows/assemble-brand-video.yml
      - name: Commit assembled video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add compact Madar brand intro video"
          git push
