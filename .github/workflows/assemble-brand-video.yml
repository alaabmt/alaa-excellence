name: Assemble brand video
on:
  push:
    branches: [main]
    paths:
      - '.upload/trigger'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble video
        run: |
          mkdir -p assets/videos
          cat .upload/madar.part* | base64 -d > assets/videos/madar-brand-intro.mp4
          test -s assets/videos/madar-brand-intro.mp4
          rm -rf .upload
          rm -f .github/workflows/assemble-brand-video.yml
      - name: Commit assembled video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optimized Madar brand intro video"
          git push
