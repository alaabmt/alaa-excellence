name: Enable mobile native social sharing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-mobile-social-share.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject mobile social sharing helper and register standard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag = '<script src="assets/js/mobile-social-share.js?v=20260907-shareapp1"></script>'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              original=s
              s=re.sub(r'<script src="assets/js/mobile-social-share\.js(?:\?v=[^"]*)?"></script>', tag, s)
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(p.name)

          manual=Path('10X_Agent_AI_Master_Operating_Manual_AR.md')
          if manual.exists():
              s=manual.read_text(encoding='utf-8')
              marker='## معيار المشاركة الاجتماعية على الهاتف'
              if marker not in s:
                  s += '''\n\n## معيار المشاركة الاجتماعية على الهاتف\n- المرجع المتخصص الإلزامي: `SOCIAL-SHARING-STANDARD.md`.\n- على الهاتف، زر LinkedIn يستخدم Web Share API أولاً عند توفره لفتح لوحة مشاركة النظام واختيار تطبيق LinkedIn المثبت، وليس إجبار المستخدم على LinkedIn Web Composer داخل المتصفح.\n- إذا ألغى المستخدم لوحة المشاركة فلا يُفتح بديل تلقائياً. وإذا فشلت المشاركة الأصلية تقنياً أو لم تكن مدعومة، يُستخدم رابط LinkedIn على الويب كخيار احتياطي.\n- كل صفحة قابلة للمشاركة يجب أن تحتوي Open Graph ثابتاً وصورة HTTPS مناسبة، ويجب اختبار المعاينة على الهاتف مع مراعاة cache الخارجي للمنصات.\n'''
                  manual.write_text(s,encoding='utf-8')

          print(f'Updated {len(changed)} HTML pages')
          for x in changed: print(x)
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '10X_Agent_AI_Master_Operating_Manual_AR.md'
          git commit -m 'Use native mobile sharing for LinkedIn across site [skip ci]'
          git push
