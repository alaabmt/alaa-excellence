name: Strengthen Tamayuz 10X SEO

on:
  push:
    paths:
      - 'scripts/strengthen-tamayuz10x-seo.py'
      - '.github/workflows/strengthen-tamayuz10x-seo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/strengthen-tamayuz10x-seo.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "Strengthen Tamayuz 10X search identity [skip ci]"
          git push
