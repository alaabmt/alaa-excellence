name: Refresh EGA audio v6
on:
  push:
    paths:
      - '.github/workflows/refresh-ega-audio6.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump corrected audio script cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('case-ega-dx-ultra-innovation.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/js/ega-audio-player-v5.js?v=20260907-audio5', 'assets/js/ega-audio-player-v5.js?v=20260907-audio6')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add case-ega-dx-ultra-innovation.html
          git commit -m 'Refresh corrected Arabic pronunciation [skip ci]'
          git push
