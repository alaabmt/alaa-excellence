name: One-time publish See & Spray 10X case
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved bilingual case
        shell: python
        run: |
          from pathlib import Path
          import json,re
          DATE='2026-09-10'
          slug='case-john-deere-see-spray-precision-decision.html'
          ar_title='من رشّ الحقل كله إلى استهداف النبتة نفسها: كيف أعادت John Deere تصميم قرار استخدام المبيدات؟'
          en_title='From Spraying the Whole Field to Targeting the Individual Weed: How John Deere Redesigned the Decision'
          refs='''<ol><li><a href="https://www.uaex.uada.edu/media-resources/news/2025/march/03-10-2025-see-and-spray-research.aspx">University of Arkansas System Division of Agriculture (2025)</a> — independent three-year field evidence on herbicide reduction, sensitivity and weed-control risk.</li><li><a href="https://acsess.onlinelibrary.wiley.com/doi/10.1002/agg2.70324">Avent et al., Agrosystems, Geosciences &amp; Environment (2026)</a> — peer-reviewed commercial-use and economic break-even analysis.</li><li><a href="https://www.deere.com/en/stories/featured/2025-farm-relief/">John Deere (2025)</a> — company-reported commercial scale and herbicide savings.</li><li><a href="https://edge.machinefinderpro.deere.com/ww/en-US/articles/advancing-weed-control-with-john-deeres-see--spray-technology-13794">MachineFinder / John Deere (2025)</a> — operational scale, spray-mix savings and mapping capabilities.</li></ol>'''
          css='''.case-hero{padding:70px 0 42px;background:linear-gradient(180deg,#fff,#f5f8fc)}.case-wrap,.case-article{max-width:980px;margin:auto}.case-tag{display:inline-flex;background:#0b2545;color:#fff;padding:8px 14px;border-radius:999px;font-weight:900}.case-hero h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.3;color:#0b2545}.case-lead,.case-section p,.case-section li{font-size:1.06rem;line-height:1.9;color:#2d4057}.case-body{padding:48px 20px 84px}.case-section{margin-bottom:42px}.case-section h2{color:#0b2545;font-size:1.7rem}.move,.reflection{background:#0b2545;color:#fff;border-radius:24px;padding:28px 30px;margin:28px 0}.move strong,.reflection strong{font-size:1.35rem;line-height:1.7}.metrics,.lens-grid,.use-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0}.card,.metric-card{border:1px solid #e1e7ee;border-radius:20px;padding:20px;background:#fff}.metric-card{text-align:center}.metric-number{display:block;font-size:1.9rem;font-weight:950;color:#0b2545}.note{background:#faf6ed;padding:18px 20px;border-radius:14px}.refs{border-top:1px solid #e3e8ee;padding-top:24px}.audio-box{border:1px solid #dfe7ef;border-radius:18px;padding:16px 18px;background:#fff}.tts-source{display:none}.tts-reading{background:#fff3c9;border-radius:8px}.floating-audio{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;background:#0b2545;color:#fff;border-radius:999px;padding:8px 12px;display:none}.floating-audio.active{display:block}@media(max-width:650px){.metrics,.lens-grid,.use-grid{grid-template-columns:1fr}}'''
          ar_sections='''<section class="case-section"><h2 data-tts-id="t03">الملخص التنفيذي</h2><p data-tts-id="t04">في الرش التقليدي، تتعامل الآلة مع الحقل بوصفه مساحة واحدة. أما See &amp; Spray من John Deere فيغيّر وحدة القرار نفسها: تستخدم الآلة الكاميرات وتعلّم الآلة والحوسبة الموجودة عليها للتعرف إلى الأعشاب أثناء الحركة، ثم تشغّل فوهات الرش حيث توجد الحاجة بدلاً من تطبيق المبيد بصورة موحدة على كامل المساحة.</p><div class="metrics"><div class="metric-card"><span class="metric-number">43–59%</span><p>خفض مستقل موثق في مبيدات ما بعد الإنبات</p></div><div class="metric-card"><span class="metric-number">5+ ملايين</span><p>فدان استخدمت عليها التقنية في 2025 بحسب Deere</p></div></div><div class="move"><strong>استشعار ← تمييز ← قرار ← تدخل محدد ← بيانات جديدة</strong></div><p data-tts-id="t05">تشير الأدلة المستقلة إلى أن هذا التحول قادر على خفض استخدام المبيدات مع الحفاظ على مكافحة قريبة من الرش الشامل عند ضبط النظام بصورة مناسبة. لكنها تكشف أيضاً أن السعي وراء أعلى نسبة توفير قد يضعف النتيجة الزراعية ويخلق تكلفة مستقبلية أكبر.[1]</p></section>
<section class="case-section"><h2 data-tts-id="t06">التحدي: عندما يكون التدخل أوسع من المشكلة</h2><p data-tts-id="t07">الرش الشامل يربط حجم التدخل بحجم الأرض أكثر مما يربطه بحجم المشكلة الفعلية. فإذا كانت الأعشاب تشغل جزءاً محدوداً من الحقل، تبقى كمية من المبيد موجهة إلى أماكن لا تحتاج إليه. السؤال التشغيلي الجديد ليس: كم من الحقل يجب أن نرش؟ بل: أين توجد الحاجة الآن، وما أقل تدخل يكفي لمعالجتها؟</p></section>
<section class="case-section"><h2 data-tts-id="t08">التحول الحاسم: تغيير وحدة القرار قبل تحسين سرعة القرار</h2><p data-tts-id="t09">التحسين التقليدي يمكن أن يسأل كيف نجعل آلة الرش أسرع أو أدق أو أقل استهلاكاً. التحول الأعمق يسأل لماذا يجب أن تتخذ الآلة قراراً واحداً للحقل كله من الأصل. عندما أصبح ممكناً دمج الرؤية الحاسوبية وتعلّم الآلة والتحكم بالفوهات أثناء الحركة، تحول القرار الكبير إلى آلاف القرارات الصغيرة: رش هنا، تجاوز هنا، ثم واصل القياس.</p></section>
<section class="case-section"><h2 data-tts-id="t10">دليل الأثر</h2><h3>خفض الاستخدام مع بقاء مكافحة الأعشاب</h3><p data-tts-id="t11">في تجربة ميدانية مستقلة امتدت ثلاث سنوات، وجد باحثو جامعة أركنساس أن الاستخدام الصحيح للتقنية أتاح خفضاً في مبيدات ما بعد الإنبات بين 43% و59% مقارنة بالرش الشامل، مع نتائج مكافحة قابلة للمقارنة عموماً عند إعدادات الحساسية المرتفعة.[1]</p><h3>التوفير الأقصى ليس النتيجة الأفضل</h3><p data-tts-id="t12">أدى تشغيل النظام عند حساسية منخفضة في التجربة نفسها إلى زيادة مخزون بذور Palmer amaranth بنحو 280% سنوياً. المقياس الذي يبدو أفضل منفرداً قد يجعل النظام كله أسوأ: توفير أكبر اليوم يمكن أن يسمح لأعشاب أكثر بالبقاء والتكاثر.[1]</p><h3>الانتقال إلى الاستخدام التجاري</h3><p data-tts-id="t13">بحسب John Deere، استُخدمت See &amp; Spray خلال موسم 2025 على أكثر من خمسة ملايين فدان، مع انخفاض متوسط يقارب 50% في استخدام المبيدات غير المتبقية لدى العملاء. هذه أرقام تشغيلية صادرة عن الشركة، ولذلك تُعامل بوصفها دليل انتشار وأداء مُبلغاً عنه من المورد، لا كتقييم مستقل.[3][4]</p><h3>الاقتصاد لا يعتمد على التقنية وحدها</h3><p data-tts-id="t14">حللت دراسة محكّمة نُشرت في 2026 بيانات تشغيل تجارية ووجدت متوسط خفض يقارب 58% في المبيدات المستهدفة، لكنها بينت أن الجدوى تتغير مع ضغط الأعشاب وتكلفة المبيد وإعدادات النظام وتكلفة التقنية. وقدرت الدراسة نقاط تعادل تقريبية عند 27 دولاراً للهكتار لـ Premium و39 دولاراً للهكتار لـ Ultimate ضمن افتراضاتها.[2]</p></section>
<section class="case-section"><h2 data-tts-id="t15">عدسة التميّز 10X</h2><div class="lens-grid"><div class="card"><h3>إعادة تعريف القيمة</h3><p>القيمة لم تعد رش الحقل بكفاءة أعلى، بل معالجة الحاجة الفعلية بأقل تدخل ممكن مع الحفاظ على النتيجة الزراعية.</p></div><div class="card"><h3>مضاعفة القدرات</h3><p>القدرة الجديدة نتجت من دمج الكاميرات والخوارزميات والحوسبة والتحكم بالفوهات والحكم الزراعي داخل طريقة العمل.</p></div><div class="card"><h3>إعادة ابتكار طريقة العمل</h3><p>انتقل القرار من معاملة مساحة كبيرة بقرار واحد إلى قرارات متكررة على مستوى أكثر دقة.</p></div><div class="card"><h3>الابتكار والتجريب</h3><p>التجربة المستقلة لم تختبر التوفير فقط؛ بل كشفت أين يمكن أن يصبح تعظيم التوفير هدفاً خاطئاً.</p></div><div class="card"><h3>تعظيم الذكاء</h3><p>العمل نفسه أصبح ينتج بيانات عن ضغط الأعشاب ومواقع التطبيق، فيتحول التنفيذ إلى مصدر تعلم.</p></div><div class="card"><h3>تعظيم النتائج المستدامة</h3><p>النتيجة الأفضل تجمع تقليل المدخلات وفعالية المكافحة والجدوى الاقتصادية وتقليل المخاطر طويلة الأجل.</p></div></div></section>
<section class="case-section"><h2 data-tts-id="t16">الأداة العملية: غيّر وحدة القرار</h2><p data-tts-id="t17">عندما يصبح بالإمكان معرفة مكان الحاجة بدقة، أعد النظر في سبب تطبيق التدخل على الجميع. النمط التقليدي هو مجموعة كبيرة ثم قاعدة واحدة ثم تدخل شامل. النمط المعاد تصميمه هو استشعار الحالة ثم تحديد الحاجة ثم قرار محدد ثم تدخل متناسب ثم تعلم. يمكن نقل هذا المنطق إلى الصيانة والرعاية الصحية والامتثال وخدمة المتعاملين؛ القيمة ليست في نقل التقنية الزراعية، بل في نقل منطق تصميم القرار.</p></section>
<section class="case-section"><h2 data-tts-id="t18">قابلية النقل وحدودها</h2><p data-tts-id="t19">تنجح الفكرة عندما يمكن استشعار الاختلاف بين الحالات بموثوقية، واتخاذ القرار بالسرعة المطلوبة، وتخصيص التدخل بتكلفة لا تتجاوز القيمة المتحققة. أما إذا كانت الإشارة ضعيفة أو تكلفة الخطأ عالية، فقد تتحول الانتقائية إلى خطر. الذكاء لا يلغي الحكم المهني؛ بل ينقله إلى اختيار الحدود والإعدادات والمفاضلات والنتيجة التي تستحق التحسين.</p></section>
<div class="reflection"><strong data-tts-id="t20">أين ما زالت مؤسستك تطبق التدخل نفسه على الجميع فقط لأنها لم تكن تستطيع سابقاً معرفة من يحتاج إليه؟ وإذا أصبحت قادرة اليوم على الاستشعار والتمييز واتخاذ القرار بدقة، فهل ستستخدم التقنية لتسريع الطريقة القديمة، أم ستعيد تصميم وحدة القرار نفسها؟</strong></div>'''
          en_sections='''<section class="case-section"><h2>Executive Snapshot</h2><p>Conventional spraying treats the field as the primary unit of action. John Deere’s See &amp; Spray changes that logic: cameras capture real-time images, machine-learning models identify weeds, onboard computing processes the information, and individual nozzles activate only where treatment is needed. The significance is not simply greater automation. The unit of decision becomes smaller and more precise.</p><div class="metrics"><div class="metric-card"><span class="metric-number">43–59%</span><p>independently documented reduction in post-emergence herbicide use</p></div><div class="metric-card"><span class="metric-number">5M+</span><p>acres using the technology in 2025, according to Deere</p></div></div><div class="move"><strong>Sense → Identify → Decide → Target → Record</strong></div><p>Independent evidence supports meaningful reductions in herbicide use, but it also exposes an important limitation: maximizing input savings can undermine weed control if detection sensitivity is set too low.[1]</p></section>
<section class="case-section"><h2>The Challenge: When the Intervention Is Larger Than the Problem</h2><p>Broadcast spraying couples the scale of the intervention to the size of the field rather than to the actual distribution of weeds. Machine vision creates a deeper opportunity than simply spraying faster: where is intervention actually needed, and how little intervention can achieve the required result?</p></section>
<section class="case-section"><h2>The 10X Move: Change the Unit of Decision Before Optimising the Decision</h2><p>A conventional improvement programme might ask how to make broadcast spraying faster, cheaper or more accurate. A redesign question asks why the field should receive one decision at all. Integrating machine vision, machine learning and nozzle control turns one large decision — spray this field — into thousands of smaller decisions: spray here, skip here, continue sensing.</p></section>
<section class="case-section"><h2>Evidence of Impact</h2><h3>Independent field evidence</h3><p>In a three-year University of Arkansas field trial, appropriate use of See &amp; Spray reduced post-emergence herbicide use by 43% to 59% relative to broadcast applications. At higher sensitivity settings, weed-control performance was generally comparable with conventional treatment.[1]</p><h3>The highest saving was not the best result</h3><p>The lowest sensitivity setting was associated with an approximately 280% annual increase in the Palmer amaranth seedbank. A metric can improve while the system deteriorates: a larger short-term chemical saving can permit more weeds to survive and reproduce.[1]</p><h3>Commercial scale</h3><p>John Deere reported that See &amp; Spray was used across more than five million acres during the 2025 growing season, with customers reducing non-residual herbicide use by nearly 50% on average. These figures are company-reported operational evidence, not independent proof of average performance across all farms.[3][4]</p><h3>Economics depends on context</h3><p>A 2026 peer-reviewed study of commercial-use data reported an average 58% reduction in targeted herbicide use, while showing that profitability varied with weed pressure, herbicide cost, system configuration and technology cost. Under its assumptions, targeted herbicide expenditure generally needed to exceed about $27 per hectare for Premium and $39 per hectare for Ultimate to justify the technologies economically relative to broadcast spraying.[2]</p></section>
<section class="case-section"><h2>The 10X Lens</h2><div class="lens-grid"><div class="card"><h3>Redefining Value</h3><p>Performance shifts from covering the field efficiently to applying only the intervention required while preserving the agricultural outcome.</p></div><div class="card"><h3>Multiplying Capability</h3><p>The capability emerges from cameras, models, onboard computing, nozzle control, agronomic settings and operator judgement working together.</p></div><div class="card"><h3>Reinventing the Operating Model</h3><p>The process moves from one treatment decision across a large area to repeated decisions at a much finer level.</p></div><div class="card"><h3>Innovation and Experimentation</h3><p>The Arkansas trial revealed not only whether the technology worked, but how the optimisation target itself could become wrong.</p></div><div class="card"><h3>Maximising Intelligence</h3><p>Execution also creates information about weed pressure and application, allowing work itself to become a source of learning.</p></div><div class="card"><h3>Maximising Sustainable Results</h3><p>The better outcome combines lower unnecessary input, effective weed control, acceptable economics and lower long-term risk.</p></div></div></section>
<section class="case-section"><h2>Practical Application: Redesign the Unit of Decision</h2><p>When an organisation becomes capable of detecting where need actually exists, it should reconsider why it still applies the same intervention to everyone. The conventional model is large group → single rule → uniform intervention. A more intelligent model is sense condition → identify need → make a specific decision → apply proportionate intervention → learn. The transferable lesson is not the agricultural technology. It is the decision architecture.</p></section>
<section class="case-section"><h2>Transferability and Limits</h2><p>This logic works best when meaningful differences can be detected reliably, decisions can be made quickly enough for the information to remain useful, and the cost of individualising intervention does not exceed the value created. Precision also raises the cost of error. Human judgement does not disappear; it moves to thresholds, settings, objectives, trade-offs and the definition of success.</p></section>
<div class="reflection"><strong>Where does your organisation still apply the same intervention to everyone simply because, historically, it could not tell who actually needed it? If you can now sense, distinguish and decide with greater precision, will you use that capability to make the old process faster — or redesign the unit of decision itself?</strong></div>'''
          def page(lang,title,desc,lead,body):
            ar=lang=='ar'; prefix='' if ar else '../'; url=('https://tamayuz10x.com/' if ar else 'https://tamayuz10x.com/en/')+slug; other=('https://tamayuz10x.com/en/' if ar else 'https://tamayuz10x.com/')+slug
            direction='rtl' if ar else 'ltr'; locale='ar_AR' if ar else 'en_US'; author='الدكتور علاء محمد أحمد' if ar else 'Dr. Alaa Mohammad Ahmed'; section='حالات 10X' if ar else '10X Cases'; back='العودة إلى حالات 10X والمقالات' if ar else 'Back to 10X Cases and Articles'; tag='حالة 10X · الزراعة الدقيقة' if ar else '10X Case · Precision Agriculture'; refs_title='المراجع' if ar else 'References'
            schema=json.dumps({'@context':'https://schema.org','@type':'Article','headline':title,'description':desc,'datePublished':DATE,'dateModified':DATE,'inLanguage':lang,'articleSection':section,'author':{'@type':'Person','name':author},'mainEntityOfPage':url},ensure_ascii=False)
            return f'''<!DOCTYPE html><html lang="{lang}" dir="{direction}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} | Tamayuz 10X</title><meta name="description" content="{desc}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="{url}"><link rel="alternate" hreflang="ar" href="https://tamayuz10x.com/{slug}"><link rel="alternate" hreflang="en" href="https://tamayuz10x.com/en/{slug}"><link rel="alternate" hreflang="x-default" href="https://tamayuz10x.com/{slug}"><meta property="og:locale" content="{locale}"><meta property="og:type" content="article"><meta property="og:title" content="{title}"><meta property="og:description" content="{desc}"><meta property="og:url" content="{url}"><meta property="og:image" content="https://tamayuz10x.com/assets/images/tamayuz-profile-share.jpg"><meta property="article:published_time" content="{DATE}"><meta property="article:modified_time" content="{DATE}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{title}"><meta name="twitter:description" content="{desc}"><meta name="twitter:image" content="https://tamayuz10x.com/assets/images/tamayuz-profile-share.jpg"><link rel="stylesheet" href="{prefix}assets/css/style.css"><script type="application/ld+json">{schema}</script><style>{css}</style></head><body><main><div style="max-width:1180px;margin:18px auto;padding:0 20px"><a href="{'/articles.html' if ar else '/en/articles.html'}">← {back}</a></div><section class="case-hero"><div class="container case-wrap"><span class="case-tag">{tag}</span><h1 data-tts-id="t01">{title}</h1><p class="case-lead" data-tts-id="t02">{lead}</p></div></section><section class="case-body"><div class="container"><article class="case-article">{body}<section class="case-section refs"><h2>{refs_title}</h2>{refs}</section></article></div></section></main><script src="{prefix}assets/js/main.js"></script></body></html>'''
          ar_desc='كيف نقلت John Deere قرار الرش من مستوى الحقل إلى موقع الحاجة، وما الذي تكشفه الأدلة المستقلة عن التوفير والجدوى ومخاطر الإفراط في الانتقائية؟'
          en_desc='How John Deere moved spraying from field-wide treatment to targeted intervention, and what independent evidence reveals about savings, economics and the risks of excessive selectivity.'
          Path(slug).write_text(page('ar',ar_title,ar_desc,'هل يجب أن يحصل الحقل كله على التدخل نفسه لأن المشكلة موجودة في جزء منه فقط؟ تكشف See & Spray كيف يمكن لقدرة جديدة على الاستشعار أن تعيد تصميم القرار نفسه.',ar_sections),encoding='utf-8')
          Path('en/'+slug).write_text(page('en',en_title,en_desc,'What happens when a machine can distinguish where intervention is actually needed? See & Spray shows how a new sensing capability can redesign the decision itself.',en_sections),encoding='utf-8')
          # registry
          rp=Path('data/article-publication-dates.json'); reg=json.loads(rp.read_text()); reg[slug]=DATE; rp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          # cards + CollectionPage hasPart (cards inserted before first card; JS sorts by date)
          arcard=f'''<article class="article-card" data-category="case management" data-date="{DATE}" data-href="{slug}" data-read-minutes="8" data-topic="الزراعة الدقيقة وإعادة تصميم القرار"><div class="article-meta"><span class="tag">حالة 10X</span><span>8 دقائق قراءة</span><time datetime="{DATE}">10 سبتمبر 2026</time></div><h3><a href="{slug}">{ar_title}</a></h3><p><a href="{slug}">هل يجب أن يحصل الحقل كله على التدخل نفسه لأن المشكلة موجودة في جزء منه فقط؟ تكشف See &amp; Spray كيف نقلت John Deere قرار الرش إلى موقع الحاجة، ولماذا قد يصبح تعظيم التوفير نفسه خطأً.</a></p><a class="article-action" href="{slug}">اقرأ كيف تغيّرت وحدة القرار ←</a></article>\n'''
          encard=f'''<article class="article-card" data-category="case management" data-date="{DATE}" data-href="{slug}" data-read-minutes="8" data-topic="Precision Agriculture &amp; Decision Redesign"><div class="article-meta"><span class="tag">10X Case</span><span>8 min read</span><time datetime="{DATE}">September 10, 2026</time></div><h3><a href="/en/{slug}">{en_title}</a></h3><p><a href="/en/{slug}">Why treat an entire field when the problem exists only in part of it? See &amp; Spray shows how John Deere moved the spraying decision to the point of need — and why maximising savings can itself become the wrong target.</a></p><a class="article-action" href="/en/{slug}">See how the unit of decision changed</a></article>\n'''
          for f,card in [('articles.html',arcard),('en/articles.html',encard)]:
            p=Path(f); s=p.read_text(); marker='<div class="article-grid" id="article-grid">'; s=s.replace(marker,marker+'\n'+card,1); p.write_text(s)
          # sitemap
          sp=Path('sitemap.xml'); s=sp.read_text(); insert=f'''  <url>\n    <loc>https://tamayuz10x.com/{slug}</loc>\n    <lastmod>{DATE}</lastmod>\n  </url>\n  <url>\n    <loc>https://tamayuz10x.com/en/{slug}</loc>\n    <lastmod>{DATE}</lastmod>\n  </url>\n'''; s=s.replace('</urlset>',insert+'</urlset>'); sp.write_text(s)
      - name: Validate publication-date integrity
        run: python scripts/check_article_dates.py
      - name: Commit publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add case-john-deere-see-spray-precision-decision.html en/case-john-deere-see-spray-precision-decision.html articles.html en/articles.html sitemap.xml data/article-publication-dates.json
          git commit -m "Publish John Deere See & Spray 10X case [skip bilingual-sync]" || exit 0
          git push
