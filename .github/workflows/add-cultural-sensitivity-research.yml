name: Add cultural sensitivity research

on:
  push:
    paths:
      - '.github/workflows/add-cultural-sensitivity-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified research entry if missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('research.html')
          s = p.read_text(encoding='utf-8')
          title = 'Understanding the Importance and Future Directions of Cultural Sensitivity in Healthcare: Developing a Culturally sensitive Patient Experience Framework with Emirati Patients as a Case Study'
          if title in s:
              print('Research entry already exists; no duplicate added.')
              raise SystemExit(0)

          article = '''
  <article class="research-feature">
    <span class="research-kicker">بحث منشور · 2024</span>
    <h2>Understanding the Importance and Future Directions of Cultural Sensitivity in Healthcare: Developing a Culturally sensitive Patient Experience Framework with Emirati Patients as a Case Study</h2>
    <div class="ar-title">فهم أهمية الحساسية الثقافية واتجاهاتها المستقبلية في الرعاية الصحية: نحو إطار لتجربة المريض يراعي الثقافة مع المرضى الإماراتيين كدراسة حالة</div>
    <div class="research-meta">
      <span>International Journal of Academic Research in Business and Social Sciences</span>
      <span>Vol. 14 · Issue 3 · pp. 225–232</span>
      <span>DOI: 10.6007/IJARBSS/v14-i3/21045</span>
    </div>
    <p class="research-authors"><strong>المؤلفون:</strong> Alaa Mohammad Ahmed، Md Saad Nor Hasliza، Samer Ellaham، Shahrukh Hashmi، Abba C Zubair، Marwan Mohammad Alrahmaneh، Nabeel Al-Yateem.</p>
    <div class="research-summary">
      <h3>ملخص بالعربية</h3>
      <p>تناقش الورقة أهمية <strong>الحساسية الثقافية في تجربة المريض</strong>، وتستخدم المرضى الإماراتيين بوصفهم دراسة حالة لفهم كيف تؤثر القيم والمعتقدات والسياقات الاجتماعية في إدراك جودة الرعاية والثقة والرضا. وتميّز الورقة بوضوح بين <strong>إطار تجربة المريض</strong> بوصفه تصوراً منظماً لما ينبغي أن تصممه المؤسسة لتقديم تجربة إيجابية، وبين <strong>استبيان تجربة المريض</strong> بوصفه أداة لقياس ما اختبره المريض فعلياً. وتلفت إلى تحدٍ مهم في دولة الإمارات يتمثل في التنوع الكبير في القوى العاملة الصحية واختلاف الخلفيات الثقافية واللغوية بين مقدمي الخدمة والمرضى. كما تبرز عناصر مثل المعتقدات الثقافية، والطب التقليدي، والخصوصية والاحتشام، والروحانية، ودور الأسرة باعتبارها عوامل يمكن أن تؤثر في تجربة المرضى العرب والمسلمين. وتدعو الورقة إلى تطوير أطر تجربة مريض أكثر ملاءمة للسياق المحلي، وإلى توسيع البحث النوعي والتدريب على الرعاية الحساسة ثقافياً، مع طرح هذه الرؤية كأساس لأبحاث لاحقة واختبار أطر قابلة للتطبيق في سياقات ثقافية متنوعة.</p>
    </div>
    <div class="research-actions">
      <a class="primary" href="https://hrmars.com/ijarbss/article/view/21045/Understanding-the-Importance-and-Future-Directions-of-Cultural-Sensitivity-in-Healthcare-Developing-a-Culturally-sensitive-Patient-Experience-Framework-with-Emirati-Patients-as-a-Case-Study" target="_blank" rel="noopener noreferrer">فتح صفحة البحث</a>
      <a class="secondary" href="https://doi.org/10.6007/IJARBSS/v14-i3/21045" target="_blank" rel="noopener noreferrer">فتح DOI</a>
    </div>
  </article>

'''

          marker = '  <article class="research-feature">\n    <span class="research-kicker">ورقة مفاهيمية · Nursing Forum · 2022</span>'
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          s = s.replace(marker, article + marker, 1)

          schema = '''
<script type="application/ld+json">{"@context":"https://schema.org","@type":"ScholarlyArticle","headline":"Understanding the Importance and Future Directions of Cultural Sensitivity in Healthcare: Developing a Culturally sensitive Patient Experience Framework with Emirati Patients as a Case Study","datePublished":"2024","author":[{"@type":"Person","name":"Alaa Mohammad Ahmed"},{"@type":"Person","name":"Md Saad Nor Hasliza"},{"@type":"Person","name":"Samer Ellaham"},{"@type":"Person","name":"Shahrukh Hashmi"},{"@type":"Person","name":"Abba C Zubair"},{"@type":"Person","name":"Marwan Mohammad Alrahmaneh"},{"@type":"Person","name":"Nabeel Al-Yateem"}],"isPartOf":{"@type":"Periodical","name":"International Journal of Academic Research in Business and Social Sciences"},"pagination":"225-232","sameAs":"https://doi.org/10.6007/IJARBSS/v14-i3/21045"}</script>
'''
          s = s.replace('</head>', schema + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Added cultural sensitivity research entry.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add cultural sensitivity research entry [skip ci]"
          git push
