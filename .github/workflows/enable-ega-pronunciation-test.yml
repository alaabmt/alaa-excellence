name: Enable EGA pronunciation test

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/ega-pronunciation-test.js'
      - '.github/workflows/enable-ega-pronunciation-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pronunciation script on EGA article only
        shell: python
        run: |
          from pathlib import Path
          path = Path('case-ega-dx-ultra-innovation.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="assets/js/ega-pronunciation-test.js?v=20260907-pron1"></script>'
          if 'ega-pronunciation-test.js' not in text:
              marker = '<script src="assets/js/site-engagement.js?v=20260907-engage1"></script>'
              if marker in text:
                  text = text.replace(marker, marker + tag, 1)
              else:
                  text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit page update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-ega-dx-ultra-innovation.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Test improved Arabic pronunciation on EGA article [skip ci]"
            git push origin main
          fi
