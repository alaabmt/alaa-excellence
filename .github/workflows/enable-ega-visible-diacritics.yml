name: Enable EGA visible diacritics
on:
  push:
    paths:
      - '.github/workflows/enable-ega-visible-diacritics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add visible diacritics script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('case-ega-dx-ultra-innovation.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="assets/js/ega-visible-diacritics.js?v=20260907-diac1"></script>'
          if old not in s:
              s = s.replace('</body>', old + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-ega-dx-ultra-innovation.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show key Arabic diacritics in EGA article [skip ci]"
          git push origin main
