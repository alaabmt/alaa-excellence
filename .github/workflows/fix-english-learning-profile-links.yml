name: Fix English Learning Profile Links
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-english-learning-profile-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix English page links and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('en/personality.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="lang-switch"><a href="/personality.html" hreflang="ar" lang="ar">العربية</a><span>|</span><a href="/personality.html" hreflang="ar" lang="ar">العربية</a></div>', '<div class="lang-switch"><a href="/en/personality.html" hreflang="en" lang="en">English</a><span>|</span><a href="/personality.html" hreflang="ar" lang="ar">العربية</a></div>')
          s=s.replace('href="tools/learning-preference-profile/?lang=ar"', 'href="/tools/learning-preference-profile/?lang=en"')
          s=s.replace('href="tools/learning-preference-profile/?mode=trainer&amp;lang=ar"', 'href="/tools/learning-preference-profile/?mode=trainer&amp;lang=en"')
          s=s.replace('href="tools/learning-preference-profile/?mode=join&amp;lang=ar"', 'href="/tools/learning-preference-profile/?mode=join&amp;lang=en"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add en/personality.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix English learning profile links and language switch"
          git push origin main
