name: Install unified site engagement

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/js/site-engagement.js'
      - '.github/workflows/install-site-engagement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add engagement loader to every HTML page
        shell: python
        run: |
          from pathlib import Path

          tag = '<script src="assets/js/site-engagement.js?v=20260907-engage1"></script>'
          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if 'assets/js/site-engagement.js' in text:
                  continue
              if '</body>' in text:
                  text = text.replace('</body>', f'{tag}</body>', 1)
              else:
                  text += '\n' + tag + '\n'
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit page updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit."
          else
            git commit -m "Enable author audio and sharing tools across all pages [skip ci]"
            git push origin main
          fi
