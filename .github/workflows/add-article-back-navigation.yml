name: Add article back navigation

on:
  push:
    paths:
      - '.github/workflows/add-article-back-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add back navigation to article pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = 'tenx-back-to-articles'
          nav = '''\n<div class="tenx-back-to-articles" style="max-width:1180px;margin:18px auto 0;padding:0 20px;direction:rtl">\n  <a href="articles.html" style="display:inline-flex;align-items:center;gap:7px;color:#2f5f9f;font-weight:850;text-decoration:none;line-height:1.6">← العودة إلى حالات 10X والمقالات</a>\n</div>\n'''

          pages = sorted(set(Path('.').glob('article-*.html')) | set(Path('.').glob('case-*.html')) | set(Path('.').glob('idea-*.html')))
          changed = []
          for p in pages:
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              pos = s.lower().find('<main')
              if pos == -1:
                  continue
              close = s.find('>', pos)
              if close == -1:
                  continue
              s = s[:close+1] + nav + s[close+1:]
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print('Updated:', ', '.join(changed) if changed else 'nothing')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add back navigation to article pages [skip ci]"
          git push
