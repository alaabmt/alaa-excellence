name: Build approved minimalist Tamayuz 10X previews
on:
  push:
    paths:
      - '.github/workflows/redesign-tenx-case-previews-v6.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-dejavu-core libraqm0
          python -m pip install pillow
      - name: Generate approved previews
        run: |
          python <<'PY'
          from PIL import Image,ImageDraw,ImageFont,features
          from pathlib import Path
          import re
          assert features.check('raqm'), 'RAQM is required for Arabic rendering'
          root=Path('.')
          out=root/'assets/previews'; out.mkdir(parents=True,exist_ok=True)
          navy=(6,35,62); navy2=(10,48,82); dark2=(7,43,74); gold=(242,181,61); white=(248,250,252); muted=(199,214,231)
          ar_reg='/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf'
          ar_bold='/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf'
          lat_reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          lat_bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def F(path,size): return ImageFont.truetype(path,size)
          def wrap(draw,text,font,maxw,direction=None,language=None):
              words=text.split(); lines=[]; cur=''
              for w in words:
                  t=(cur+' '+w).strip()
                  box=draw.textbbox((0,0),t,font=font,direction=direction,language=language)
                  if box[2]-box[0] <= maxw: cur=t
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          cases=[
          ('case-rwanda-blood-on-demand-aerial-logistics','رواندا','إعادة تصميم نموذج تشغيل إمداد الدم','من مخزون محلي محدود إلى إمداد شبكي سريع عند الطلب','Rwanda','Redesigning the Blood-Supply Operating Model','From local stock constraints to rapid network resupply on demand'),
          ('case-bms-devens-future-ready-manufacturing','BMS ديفنز','بناء مصنع مستعد لما سيأتي','بناء قدرات اليوم لمستقبل أكثر تعقيدًا في التصنيع الدوائي','BMS Devens','Building a Factory Ready for What Comes Next','Building today’s capabilities for a more complex manufacturing future'),
          ('case-seha-virtual-hospital-expertise-network','مستشفى صحة الافتراضي','من نقل المريض إلى نقل الخبرة','إيصال التخصص إلى نقطة الحاجة عبر نموذج رعاية افتراضي','SEHA Virtual Hospital','Moving Expertise Instead of Patients','Bringing specialist expertise to the point of need through virtual care'),
          ('case-john-deere-see-spray-precision-decision','John Deere','من الرش الشامل إلى القرار الدقيق','تحويل رؤية النبات إلى قرار استهداف على مستوى النبتة','John Deere','From Blanket Spraying to Precision Decisions','Turning plant-level vision into targeted action in the field'),
          ('case-tawam-erabs-bariatric-recovery','مستشفى توام','إعادة تصميم رحلة التعافي بعد الجراحة','مسار رعاية منظم يربط القرار السريري بالتشغيل اليومي','Tawam Hospital','Redesigning the Post-Surgery Recovery Journey','A structured care pathway connecting clinical decisions with daily operations'),
          ('case-aravind-eye-care-high-volume-value','Aravind Eye Care','قيمة أعلى من نموذج تشغيل مختلف','توسيع الوصول إلى جراحة العيون عبر تدفق عمل عالي الكفاءة','Aravind Eye Care','Creating More Value Through a Different Operating Model','Expanding access to eye surgery through a high-efficiency care model'),
          ('case-tamm-autogov-ai-native-government','أبوظبي · TAMM','من الحكومة الرقمية إلى الحكومة الاستباقية','إعادة تصميم رحلة المتعامل حول الاحتياج لا حول حدود الجهات','Abu Dhabi · TAMM','From Digital Government to Proactive Government','Redesigning citizen journeys around needs rather than agency boundaries'),
          ('case-dewa-hydro-insight-smart-water','دبي · DEWA','من قراءة الاستهلاك إلى كشف الخلل مبكرًا','تحويل بيانات الشبكة إلى رؤية تشغيلية وقرار أسرع','Dubai · DEWA','From Meter Reading to Earlier Problem Detection','Turning network data into operational visibility and faster decisions'),
          ('case-ega-dx-ultra-innovation','الإمارات العالمية للألمنيوم','حين يصبح الابتكار قدرة قابلة للتصدير','ربط الابتكار الرقمي بمشكلة تشغيلية ثم توسيع قيمته خارج الموقع','Emirates Global Aluminium','When Innovation Becomes an Exportable Capability','Connecting digital innovation to an operating problem, then scaling its value'),
          ('case-dubai-paperless-10x','دبي','التحول الحقيقي: إلغاء الحاجة إلى الورق','إعادة تصميم العمل الحكومي بدل تحويل الورق إلى شاشة','Dubai','The Real Transformation: Removing the Need for Paper','Redesigning government work rather than simply digitizing documents')]
          def base():
              im=Image.new('RGB',(1200,630),navy); d=ImageDraw.Draw(im)
              d.ellipse((820,-180,1320,320),fill=navy2); d.ellipse((900,160,1360,620),fill=dark2); d.rectangle((25,20,36,610),fill=gold)
              return im,d
          def ar_card(slug,entity,title,teaser):
              im,d=base(); x=790
              d.text((x,55),f'حالة موثقة · {entity}',font=F(ar_bold,28),fill=white,anchor='ra',direction='rtl',language='ar')
              d.text((x,103),'التميّز 10X',font=F(ar_bold,24),fill=gold,anchor='ra',direction='rtl',language='ar')
              lines=wrap(d,title,F(ar_bold,52),720,'rtl','ar')[:2]; y=205
              for line in lines:
                  d.text((x,y),line,font=F(ar_bold,52),fill=white,anchor='ra',direction='rtl',language='ar'); y+=72
              teaser_lines=wrap(d,teaser,F(ar_reg,28),720,'rtl','ar')[:2]; y=max(y+22,385)
              for line in teaser_lines:
                  d.text((x,y),line,font=F(ar_reg,28),fill=muted,anchor='ra',direction='rtl',language='ar'); y+=43
              d.rectangle((765,520,770,580),fill=gold)
              d.text((750,535),'الدكتور علاء محمد أحمد',font=F(ar_bold,25),fill=white,anchor='ra',direction='rtl',language='ar')
              d.text((1095,150),'التميّز',font=F(ar_bold,50),fill=white,anchor='ra',direction='rtl',language='ar')
              d.text((1080,225),'10',font=F(lat_bold,104),fill=white,anchor='ra'); d.text((1110,225),'X',font=F(lat_bold,104),fill=gold,anchor='la')
              im.save(out/f'{slug}-ar.png','PNG',optimize=True)
          def en_card(slug,entity,title,teaser):
              im,d=base(); x=82
              d.text((x,55),f'EVIDENCE-BASED CASE · {entity}',font=F(lat_bold,24),fill=white,anchor='la')
              d.text((x,100),'TAMAYUZ 10X',font=F(lat_bold,22),fill=gold,anchor='la')
              lines=wrap(d,title,F(lat_bold,48),710)[:3]; y=185
              for line in lines:
                  d.text((x,y),line,font=F(lat_bold,48),fill=white,anchor='la'); y+=58
              teaser_lines=wrap(d,teaser,F(lat_reg,27),710)[:2]; y=max(y+25,385)
              for line in teaser_lines:
                  d.text((x,y),line,font=F(lat_reg,27),fill=muted,anchor='la'); y+=41
              d.rectangle((82,520,87,580),fill=gold); d.text((105,535),'Dr. Alaa Mohammad Ahmed',font=F(lat_bold,23),fill=white,anchor='la')
              d.text((1115,150),'Tamayuz',font=F(lat_bold,39),fill=white,anchor='ra'); d.text((1080,225),'10',font=F(lat_bold,104),fill=white,anchor='ra'); d.text((1110,225),'X',font=F(lat_bold,104),fill=gold,anchor='la')
              im.save(out/f'{slug}-en.png','PNG',optimize=True)
          for slug,ae,at,asub,ee,et,esub in cases:
              ar_card(slug,ae,at,asub); en_card(slug,ee,et,esub)
          # collection cards
          ar_card('tenx-cases-collection','حالات وتجارب 10X','حالات وتجارب تصنع الفرق','تحولات واقعية موثقة من منظور نموذج التشغيل والقيمة والنتائج')
          en_card('tenx-cases-collection','10X Cases & Experiences','Cases and Experiences That Make a Difference','Evidence-based transformations viewed through operating models, value and results')
          # bump cache version only where preview assets are referenced
          targets=list(root.glob('case-*.html'))+list((root/'en').glob('case-*.html'))+[root/'articles.html',root/'en/articles.html']
          for p in targets:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'20260912-preview\d+','20260912-preview6',s)
              p.write_text(s,encoding='utf-8')
          # strengthen the permanent preview standard
          std=root/'10X_CASE_SOCIAL_PREVIEW_STANDARD.md'
          s=std.read_text(encoding='utf-8')
          marker='## 2. العناصر المطلوبة'
          addition='''\n### هوية العلامة المرئية\n- يجب أن تظهر العلامة كاملة بوضوح: **التميّز 10X** في البطاقة العربية و**Tamayuz 10X** في البطاقة الإنجليزية.\n- لا يُستخدم **10X** منفردًا بوصفه الهوية الرئيسية للبطاقة. يمكن أن يظهر الرقم بصريًا كعنصر مساعد فقط عندما تكون كلمة **التميّز / Tamayuz** واضحة معه.\n- القالب الافتراضي المعتمد بسيط وغير مزدحم: هوية العلامة، اسم الحالة/الجهة، عنوان مختصر، سطر تشويقي واحد، واسم المؤلف. تُضاف الأرقام فقط عندما تخدم التشويق بوضوح ولا تزدحم بها البطاقة.\n\n'''
          if '### هوية العلامة المرئية' not in s: s=s.replace(marker,addition+marker)
          std.write_text(s,encoding='utf-8')
          print('generated',len(cases)*2+2,'preview cards')
          PY
      - name: QA preview mappings
        run: |
          python <<'PY'
          from pathlib import Path
          assert len(list(Path('assets/previews').glob('case-*-ar.png'))) >= 10
          assert len(list(Path('assets/previews').glob('case-*-en.png'))) >= 10
          for p in Path('.').glob('case-*.html'):
              s=p.read_text(encoding='utf-8')
              if 'assets/previews/case-' in s: assert '-ar.png?v=20260912-preview6' in s, p
          for p in Path('en').glob('case-*.html'):
              s=p.read_text(encoding='utf-8')
              if 'assets/previews/case-' in s: assert '-en.png?v=20260912-preview6' in s, p
          assert 'التميّز 10X' in Path('10X_CASE_SOCIAL_PREVIEW_STANDARD.md').read_text(encoding='utf-8')
          print('QA passed')
          PY
      - name: Commit previews
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/previews '*.html' 'en/*.html' 10X_CASE_SOCIAL_PREVIEW_STANDARD.md
          git commit -m '[preview] Apply approved minimalist Tamayuz 10X cards' || exit 0
          git push
