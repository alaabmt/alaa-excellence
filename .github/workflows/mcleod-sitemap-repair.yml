name: McLeod sitemap repair
on:
  push:
    branches: [case-mcleod-ambient-ai-20260916]
    paths: [.github/workflows/mcleod-sitemap-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-mcleod-ambient-ai-20260916
          fetch-depth: 0
      - name: Restore main sitemap and add McLeod URLs
        run: |
          git fetch origin main
          git show origin/main:sitemap.xml > /tmp/sitemap-main.xml
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/sitemap-main.xml').read_text(encoding='utf-8')
          urls=['https://tamayuz10x.com/case-mcleod-ambient-ai-clinical-documentation.html','https://tamayuz10x.com/en/case-mcleod-ambient-ai-clinical-documentation.html']
          block=''
          for u in urls:
              if u not in s:
                  block += f'  <url>\n    <loc>{u}</loc>\n    <lastmod>2026-09-17</lastmod>\n  </url>\n'
          if '</urlset>' not in s: raise SystemExit('invalid main sitemap')
          s=s.replace('</urlset>',block+'</urlset>')
          Path('sitemap.xml').write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired sitemap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Repair sitemap and add McLeod URLs [skip ci]"
          git push origin HEAD:case-mcleod-ambient-ai-20260916
