name: Tamayuz Live Ended Session UI Test
on:
  push:
    branches:
      - fix/tamayuz-live-ended-session-message-20261112
    paths:
      - 'live/index.html'
      - 'tests/tamayuz-live-ended-state.test.mjs'
      - '.github/workflows/tamayuz-live-ended-state-test.yml'
  pull_request:
    paths:
      - 'live/index.html'
      - 'tests/tamayuz-live-ended-state.test.mjs'
      - '.github/workflows/tamayuz-live-ended-state-test.yml'
permissions:
  contents: read
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test tests/tamayuz-live-ended-state.test.mjs
