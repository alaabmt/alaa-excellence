name: Remove homepage consultation block and policy section 14

on:
  push:
    paths:
      - '.github/workflows/remove-home-consultation-and-policy-14.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove requested sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          # Remove section 14 from editorial policy.
          policy = Path('editorial-policy-disclaimer.html')
          if policy.exists():
              s = policy.read_text(encoding='utf-8')
              ns, n = re.subn(
                  r'\n<section><h2>14\. المراجعة القانونية والتنظيمية</h2><p>.*?</p></section>\n',
                  '\n',
                  s,
                  count=1,
                  flags=re.S,
              )
              if n:
                  policy.write_text(ns, encoding='utf-8')
                  changed.append(str(policy))

          # Remove the homepage "استشارة أم تطوير قدرات؟" block only, preserving the books block.
          home = Path('index.html')
          if home.exists():
              s = home.read_text(encoding='utf-8')
              target = '<div><div class="section-heading"><span>اعمل معي</span><h2>استشارة أم تطوير قدرات؟</h2></div><p>أصبح لكل مسار صفحة مستقلة: الاستشارات لبناء الأنظمة والتحول المؤسسي، والتعلّم والتطوير التنفيذي لبناء الكفاءة ونقلها إلى بيئة العمل.</p><a class="text-link" href="services.html">الخبرة المهنية</a> &nbsp; <a class="text-link" href="training.html">بناء القدرات</a></div>'
              if target in s:
                  s = s.replace(target, '', 1)
                  home.write_text(s, encoding='utf-8')
                  changed.append(str(home))

          print('Updated:', ', '.join(changed) if changed else 'nothing')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-policy-disclaimer.html index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Remove policy section 14 and homepage consultation block [skip ci]"
          git push
