name: Fix sitewide navigation v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sitewide-navigation-v2.yml'

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize public navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          ar_items = [
              ('/', 'الرئيسية', 'home'),
              ('/about.html', 'عن الدكتور علاء محمد أحمد', 'about'),
              ('/#tenx-10x', 'التميّز 10X', 'tenx'),
              ('/articles.html', 'حالات وتجارب 10X', 'articles'),
              ('/research.html', 'الأبحاث والمنشورات', 'research'),
              ('/personality.html', 'مختبر اكتشاف الذات', 'personality'),
              ('/training.html', 'بناء القدرات', 'training'),
          ]
          en_items = [
              ('/en/', 'Home', 'home'),
              ('/en/about.html', 'About Dr. Alaa Mohammad Ahmed', 'about'),
              ('/en/#tenx-10x', 'Tamayuz 10X', 'tenx'),
              ('/en/articles.html', '10X Cases & Experiences', 'articles'),
              ('/en/research.html', 'Research & Publications', 'research'),
              ('/en/personality.html', 'Self-Discovery Lab', 'personality'),
              ('/en/training.html', 'Capability Building', 'training'),
          ]

          def active_key(path):
              name = path.name
              if name == 'index.html': return 'home'
              if name == 'about.html': return 'about'
              if name == 'research.html': return 'research'
              if name == 'personality.html': return 'personality'
              if name == 'training.html': return 'training'
              if name == 'articles.html' or name.startswith(('case-','article-','idea-')): return 'articles'
              return None

          pattern = re.compile(r'<nav\s+class=["\']main-nav["\'][^>]*>.*?</nav>', re.S | re.I)
          changed = []

          for path in root.rglob('*.html'):
              parts = set(path.parts)
              if 'account' in parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if not pattern.search(text):
                  continue
              is_en = path.parts[0] == 'en' if len(path.parts) > 1 else False
              items = en_items if is_en else ar_items
              current = active_key(path)
              links = []
              for href, label, key in items:
                  cls = ' class="active"' if key == current else ''
                  links.append(f'<a{cls} href="{href}">{label}</a>')
              nav = '<nav class="main-nav"><div class="container nav-links">' + ''.join(links) + '</div></nav>'
              new_text, n = pattern.subn(nav, text, count=1)
              if n and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} public HTML files')
          for p in changed:
              print(p)

      - name: Verify research navigation and account exclusion
        shell: python
        run: |
          from pathlib import Path

          checks = {
            'research.html': ['عن الدكتور علاء محمد أحمد','التميّز 10X','حالات وتجارب 10X','الأبحاث والمنشورات','مختبر اكتشاف الذات','بناء القدرات'],
            'en/research.html': ['About Dr. Alaa Mohammad Ahmed','Tamayuz 10X','10X Cases & Experiences','Research & Publications','Self-Discovery Lab','Capability Building'],
          }
          forbidden = ['نبذة شخصية','>الكتب<','التميز الصحي','التميّز والقيادة','الحياة والمجتمع','الخبرة المهنية','تواصل معي']
          for f, required in checks.items():
              text = Path(f).read_text(encoding='utf-8')
              nav = text.split('<nav class="main-nav">',1)[1].split('</nav>',1)[0]
              for term in required:
                  assert term in nav, (f, term)
              if f == 'research.html':
                  for term in forbidden:
                      assert term not in nav, (f, term)
              assert 'class="active" href="/research.html"' in nav if f == 'research.html' else 'class="active" href="/en/research.html"' in nav

          for p in Path('account').rglob('*.html') if Path('account').exists() else []:
              pass
          print('Navigation verification passed')

      - name: Commit navigation consistency fix
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'en/*.html'
          git commit -m "[nav-v2] Enforce unified public navigation sitewide"
          git push
