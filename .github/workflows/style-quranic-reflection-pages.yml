name: Style Quranic reflection pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/style-quranic-reflection-pages.yml'
      - 'reflection-yusuf-building-tomorrow.html'
      - 'en/reflection-yusuf-building-tomorrow.html'
      - 'assets/css/quranic-reflection-article.css'
      - 'assets/js/quranic-reflection-page.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply article presentation shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              (Path('reflection-yusuf-building-tomorrow.html'), '  <link rel="stylesheet" href="assets/css/style.css">', '  <link rel="stylesheet" href="assets/css/style.css">\n  <link rel="stylesheet" href="/assets/css/quranic-reflection-article.css?v=20260914-reflection2">'),
              (Path('en/reflection-yusuf-building-tomorrow.html'), '  <link rel="stylesheet" href="../assets/css/style.css">', '  <link rel="stylesheet" href="../assets/css/style.css">\n  <link rel="stylesheet" href="/assets/css/quranic-reflection-article.css?v=20260914-reflection2">'),
          ]
          for path, old, new in files:
              text = path.read_text(encoding='utf-8')
              if 'quranic-reflection-article.css' not in text:
                  text = text.replace(old, new)
              if 'quranic-reflection-page.js' not in text:
                  text = text.replace('</body>', '  <script src="/assets/js/quranic-reflection-page.js?v=20260914-reflection2"></script>\n</body>')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reflection-yusuf-building-tomorrow.html en/reflection-yusuf-building-tomorrow.html
          git commit -m "Polish Quranic reflection article pages"
          git push
