name: Tamayuz Live Synthetic Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'tests/tamayuz-live-browser.mjs'
      - 'tests/tamayuz-live-resilience-browser.mjs'
      - '.github/workflows/tamayuz-live-browser-qa.yml'
  pull_request:
    paths:
      - 'live/**'
      - 'tests/tamayuz-live-browser.mjs'
      - 'tests/tamayuz-live-resilience-browser.mjs'
      - '.github/workflows/tamayuz-live-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/tamayuz-live-browser.mjs
      - name: Resilience scenarios (pinned region, fallback, outage recovery, identity, RTL)
        run: node tests/tamayuz-live-resilience-browser.mjs
