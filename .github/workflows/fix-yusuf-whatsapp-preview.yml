name: Fix Yusuf WhatsApp preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-yusuf-whatsapp-preview.yml'

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build lightweight JPEG previews and update Open Graph tags
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          from PIL import Image
          from pathlib import Path

          pairs = [
              ('assets/previews/reflection-yusuf-building-tomorrow-ar.png', 'assets/previews/reflection-yusuf-building-tomorrow-ar.jpg'),
              ('assets/previews/reflection-yusuf-building-tomorrow-en.png', 'assets/previews/reflection-yusuf-building-tomorrow-en.jpg'),
          ]
          for src, dst in pairs:
              im = Image.open(src).convert('RGB')
              if im.size != (1200, 630):
                  im = im.resize((1200, 630), Image.Resampling.LANCZOS)
              im.save(dst, 'JPEG', quality=82, optimize=True, progressive=False)
              print(dst, Path(dst).stat().st_size)

          pages = [
              ('reflection-yusuf-building-tomorrow.html', 'https://tamayuz10x.com/assets/previews/reflection-yusuf-building-tomorrow-ar.jpg?v=20260915-wa1', 'تأملات قرآنية — يوسف عليه السلام: حين يُبنى الغد في زمن السعة'),
              ('en/reflection-yusuf-building-tomorrow.html', 'https://tamayuz10x.com/assets/previews/reflection-yusuf-building-tomorrow-en.jpg?v=20260915-wa1', 'Qur’anic Reflections — Yusuf: Building Tomorrow in Times of Abundance'),
          ]
          import re
          for path, image_url, alt in pages:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{image_url}">', s)
              # Add or replace secure URL.
              if 'property="og:image:secure_url"' in s:
                  s = re.sub(r'<meta property="og:image:secure_url" content="[^"]+">', f'<meta property="og:image:secure_url" content="{image_url}">', s)
              else:
                  s = s.replace(f'<meta property="og:image" content="{image_url}">', f'<meta property="og:image" content="{image_url}">\n  <meta property="og:image:secure_url" content="{image_url}">')
              s = re.sub(r'<meta property="og:image:type" content="[^"]+">', '<meta property="og:image:type" content="image/jpeg">', s)
              s = re.sub(r'<meta name="twitter:image" content="[^"]+">', f'<meta name="twitter:image" content="{image_url}">', s)
              # Ensure explicit image alt remains present.
              if 'property="og:image:alt"' not in s:
                  s = s.replace('<meta property="og:image:height" content="630">', f'<meta property="og:image:height" content="630">\n  <meta property="og:image:alt" content="{alt}">')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/reflection-yusuf-building-tomorrow-*.jpg reflection-yusuf-building-tomorrow.html en/reflection-yusuf-building-tomorrow.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Serve lightweight JPEG previews for WhatsApp"
            git push
          fi