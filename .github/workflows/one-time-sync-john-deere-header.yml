name: One-time synchronize John Deere bilingual page header
on:
  push:
    paths:
      - '.github/workflows/one-time-sync-john-deere-header.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Add reciprocal site headers
        run: |
          python - <<'PY'
          from pathlib import Path

          ar = Path('case-john-deere-see-spray-precision-decision.html')
          en = Path('en/case-john-deere-see-spray-precision-decision.html')
          a = ar.read_text(encoding='utf-8')
          e = en.read_text(encoding='utf-8')

          ar_header = '''<header class="site-header"><div class="topbar"><div class="container topbar-inner"><div class="social">LinkedIn · YouTube · X</div><div class="lang-switch"><span>العربية</span><span>|</span><a href="/en/case-john-deere-see-spray-precision-decision.html" hreflang="en" lang="en">English</a></div></div></div><div class="container brand-row"><a class="brand" href="/"><img alt="شعار التميّز 10X" class="brand-logo" src="/assets/images/file_0000000047188210ac6952e999d2eda7.png?v=20260910-logo4"></a><button aria-label="فتح القائمة" class="menu-toggle">☰</button></div><nav class="main-nav"><div class="container nav-links"><a href="/">الرئيسية</a><a href="/about.html">نبذة شخصية</a><a href="/books.html">الكتب</a><a href="/research.html">الأبحاث والمنشورات</a><a class="active" href="/articles.html">حالات 10X والمقالات</a><a href="/healthcare-excellence.html">التميّز الصحي</a><a href="/leadership-excellence.html">التميّز والقيادة</a><a href="/life-society.html">الحياة والمجتمع</a><a href="/training.html">بناء القدرات</a><a href="/services.html">الخبرة المهنية</a><a href="/contact.html">تواصل معي</a></div></nav></header>'''
          en_header = '''<header class="site-header"><div class="topbar"><div class="container topbar-inner"><div class="social">LinkedIn · YouTube · X</div><div class="lang-switch"><span>English</span><span>|</span><a href="/case-john-deere-see-spray-precision-decision.html" hreflang="ar" lang="ar">العربية</a></div></div></div><div class="container brand-row"><a class="brand" href="/en/"><img alt="Tamayuz 10X logo" class="brand-logo" src="/assets/images/file_0000000047188210ac6952e999d2eda7.png?v=20260910-logo4"></a><button aria-label="Open Menu" class="menu-toggle">☰</button></div><nav class="main-nav"><div class="container nav-links"><a href="/en/">Home</a><a href="/en/about.html">Personal profile</a><a href="/en/books.html">Books</a><a href="/en/research.html">Research &amp; Publications</a><a class="active" href="/en/articles.html">10X Cases and Articles</a><a href="/en/healthcare-excellence.html">Health Excellence</a><a href="/en/leadership-excellence.html">Excellence and Leadership</a><a href="/en/life-society.html">Life and Society</a><a href="/en/training.html">Capacity-building</a><a href="/en/services.html">Professional experience</a><a href="/en/contact.html">Contact me</a></div></nav></header>'''

          if '<header class="site-header">' not in a:
              a = a.replace('<body><main>', '<body>' + ar_header + '<main>', 1)
          if '<header class="site-header">' not in e:
              e = e.replace('<body><main>', '<body>' + en_header + '<main>', 1)

          # Ensure page-specific reciprocal links are exact if header already existed.
          a = a.replace('href="/en/" hreflang="en"', 'href="/en/case-john-deere-see-spray-precision-decision.html" hreflang="en"')
          e = e.replace('href="/" hreflang="ar"', 'href="/case-john-deere-see-spray-precision-decision.html" hreflang="ar"')

          ar.write_text(a, encoding='utf-8')
          en.write_text(e, encoding='utf-8')
          PY
      - name: Validate reciprocal metadata and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          pages=[('case-john-deere-see-spray-precision-decision.html','ar','rtl','/en/case-john-deere-see-spray-precision-decision.html'),('en/case-john-deere-see-spray-precision-decision.html','en','ltr','/case-john-deere-see-spray-precision-decision.html')]
          for path,lang,direction,target in pages:
              s=BeautifulSoup(Path(path).read_text(encoding='utf-8'),'html.parser')
              assert s.html.get('lang')==lang and s.html.get('dir')==direction
              assert s.find('header',class_='site-header')
              other='en' if lang=='ar' else 'ar'
              sw=s.find('a',attrs={'hreflang':other})
              assert sw and sw.get('href')==target
              assert s.find('link',attrs={'rel':'canonical'})
              assert s.find('link',attrs={'hreflang':'ar'}) and s.find('link',attrs={'hreflang':'en'})
          print('John Deere bilingual header and reciprocal language links validated.')
          PY
      - name: Commit synchronized pages and remove one-time workflow
        run: |
          rm .github/workflows/one-time-sync-john-deere-header.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add case-john-deere-see-spray-precision-decision.html en/case-john-deere-see-spray-precision-decision.html .github/workflows/one-time-sync-john-deere-header.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize John Deere case language navigation [skip bilingual-sync]'
          git pull --rebase origin main
          git push origin main
