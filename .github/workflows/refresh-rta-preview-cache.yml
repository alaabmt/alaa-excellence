name: Refresh RTA preview cache
on:
  push:
    paths:
      - '.github/workflows/refresh-rta-preview-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump RTA preview asset version everywhere
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          targets=[Path('articles.html'),Path('en/articles.html'),Path('case-rta-adaptive-traffic-control-utc-ux-fusion.html'),Path('en/case-rta-adaptive-traffic-control-utc-ux-fusion.html')]
          for p in targets:
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'(case-rta-adaptive-traffic-control-utc-ux-fusion-(?:ar|en)\.png\?v=)[^\"\']+',r'\g<1>20260913-rta3',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache-bust update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add articles.html en/articles.html case-rta-adaptive-traffic-control-utc-ux-fusion.html en/case-rta-adaptive-traffic-control-utc-ux-fusion.html
          git commit -m '[preview] Refresh RTA approved 10X card cache' || exit 0
          git push
# trigger: rta3
