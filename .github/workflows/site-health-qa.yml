name: Site health QA

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'account/**'
      - 'tools/**'
      - 'robots.txt'
      - 'CNAME'
      - 'scripts/site_health_audit.py'
      - 'scripts/check_editorial_collections.py'
      - 'scripts/enforce_language_runtime_isolation.py'
      - '.github/workflows/site-health-qa.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'account/**'
      - 'tools/**'
      - 'robots.txt'
      - 'CNAME'
      - 'scripts/site_health_audit.py'
      - 'scripts/check_editorial_collections.py'
      - 'scripts/enforce_language_runtime_isolation.py'
      - '.github/workflows/site-health-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-health-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Validate static-site health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check local links, assets, metadata and canonical integrity
        run: python scripts/site_health_audit.py --json-out /tmp/site-health.json
      - name: Check Qur’anic reflection collections match article indexes
        run: python scripts/check_editorial_collections.py
      - name: Check English pages load no Arabic-only scripts and show no stray Arabic
        run: |
          python -m pip install --quiet beautifulsoup4
          python scripts/enforce_language_runtime_isolation.py
