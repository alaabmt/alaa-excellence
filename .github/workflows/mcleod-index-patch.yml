name: McLeod index patch
on:
  push:
    branches: [case-mcleod-ambient-ai-20260916]
    paths: [.github/workflows/mcleod-index-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-mcleod-ambient-ai-20260916
      - name: Insert bilingual cards safely
        run: |
          python - <<'PY'
          from pathlib import Path
          specs = [
            ('articles.html', '<article class="article-card" data-category="case healthcare management" data-date="2026-09-17" data-href="case-mcleod-ambient-ai-clinical-documentation.html" data-read-minutes="9" data-topic="الذكاء الاصطناعي المحيطي والتوثيق السريري"><a class="article-preview" href="case-mcleod-ambient-ai-clinical-documentation.html"><img src="/assets/previews/case-mcleod-ambient-ai-clinical-documentation-ar.png?v=20260917-1" alt="McLeod Health — التوثيق السريري بالذكاء الاصطناعي المحيطي" loading="lazy" width="1200" height="630"></a><div class="article-meta"><span class="tag">حالة 10X · الصحة</span><span>9 دقائق قراءة</span><time datetime="2026-09-17">17 سبتمبر 2026</time></div><h3><a href="case-mcleod-ambient-ai-clinical-documentation.html">من عبء التوثيق إلى قدرة سريرية تعمل في الخلفية: حالة McLeod Health</a></h3><p><a href="case-mcleod-ambient-ai-clinical-documentation.html">كيف تحولت مقارنة الموردين والتجربة والقياس والتكامل إلى قدرة تشغيلية تقلل زمن التوثيق مع بقاء مسؤولية الطبيب؟</a></p><a class="article-action" href="case-mcleod-ambient-ai-clinical-documentation.html">اقرأ الحالة ←</a></article>'),
            ('en/articles.html', '<article class="article-card" data-category="case healthcare management" data-date="2026-09-17" data-href="case-mcleod-ambient-ai-clinical-documentation.html" data-read-minutes="9" data-topic="ambient AI and clinical documentation"><a class="article-preview" href="case-mcleod-ambient-ai-clinical-documentation.html"><img src="/assets/previews/case-mcleod-ambient-ai-clinical-documentation-en.png?v=20260917-1" alt="McLeod Health — ambient AI clinical documentation" loading="lazy" width="1200" height="630"></a><div class="article-meta"><span class="tag">10X Case · Healthcare</span><span>9 min read</span><time datetime="2026-09-17">17 September 2026</time></div><h3><a href="case-mcleod-ambient-ai-clinical-documentation.html">From Documentation Burden to a Clinical Capability Running in the Background: McLeod Health</a></h3><p><a href="case-mcleod-ambient-ai-clinical-documentation.html">How vendor comparison, piloting, measurement and EHR integration became an operating capability that reduced note time while keeping clinicians accountable.</a></p><a class="article-action" href="case-mcleod-ambient-ai-clinical-documentation.html">Read the case →</a></article>')
          ]
          marker='<div class="article-grid" id="article-grid">'
          for fn, card in specs:
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if 'case-mcleod-ambient-ai-clinical-documentation.html' in s:
                  continue
              if marker not in s:
                  raise SystemExit(f'marker missing in {fn}')
              p.write_text(s.replace(marker, marker+'\n'+card, 1), encoding='utf-8')
          PY
      - name: Commit index cards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add articles.html en/articles.html
          git diff --cached --quiet || git commit -m "Add McLeod case cards to bilingual indexes [skip ci]"
          git push origin HEAD:case-mcleod-ambient-ai-20260916
