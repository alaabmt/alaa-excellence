name: Arabic editorial gate
# Always run on every PR so a required status check is never skipped by path filters.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  editorial-and-mobile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Render actual mobile layouts and create evidence
        run: python3 scripts/check_arabic_mobile.py
      - name: Render today's Agentic AI article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-agentic-ai-long-horizon-computer-workflows.html
          EDITORIAL_REPORT: editorial-qa/agent-long-horizon-workflows.json
          MOBILE_ARTIFACT_PREFIX: agent-long-horizon-workflows
        run: python3 scripts/check_arabic_mobile.py
      - name: Render current Qur'anic reflection at actual mobile widths
        run: python3 scripts/check_quran_reflection_mobile.py
      - name: Render the OE evidence defaults article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-oe-evidence-defaults-shape-practice.html
          EDITORIAL_REPORT: editorial-qa/oe-defaults.json
          MOBILE_ARTIFACT_PREFIX: oe-defaults
        run: python3 scripts/check_arabic_mobile.py
      - name: Check OE evidence defaults editorial gates
        run: python3 scripts/check_arabic_editorial.py article-oe-evidence-defaults-shape-practice.html editorial-qa/oe-defaults.json
      - name: Check AlphaEvolve editorial gates using generated mobile evidence
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-alphaevolve-compute-scheduling.html editorial-qa/alphaevolve.json
      - name: Check today's Agentic AI editorial gates
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-long-horizon-computer-workflows.html editorial-qa/agent-long-horizon-workflows.json
      - name: Render the human-agent experiment article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-agentic-ai-human-agent-ad-experiment.html
          EDITORIAL_REPORT: editorial-qa/agent-human-agent-ad-experiment.json
          MOBILE_ARTIFACT_PREFIX: agent-human-agent-ad-experiment
        run: python3 scripts/check_arabic_mobile.py
      - name: Check the human-agent experiment editorial gates
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-human-agent-ad-experiment.html editorial-qa/agent-human-agent-ad-experiment.json
      - name: Preserve mobile screenshots and QA result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arabic-article-mobile-review
          path: |
            editorial-qa/mobile-artifacts/
            editorial-qa/alphaevolve.json
            editorial-qa/agent-long-horizon-workflows.json
            editorial-qa/oe-defaults.json
            editorial-qa/agent-human-agent-ad-experiment.json
          if-no-files-found: error
