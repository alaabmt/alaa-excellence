name: Arabic editorial gate
# Always run on every PR so a required status check is never skipped by path filters.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  editorial-and-mobile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Render actual mobile layouts and create evidence
        run: python3 scripts/check_arabic_mobile.py
      - name: Render today's Agentic AI article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-agentic-ai-building-customer-service-agents.html
          EDITORIAL_REPORT: editorial-qa/agent-construction.json
          MOBILE_ARTIFACT_PREFIX: agent-construction
        run: python3 scripts/check_arabic_mobile.py
      - name: Check AlphaEvolve editorial gates using generated mobile evidence
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-alphaevolve-compute-scheduling.html editorial-qa/alphaevolve.json
      - name: Check today's seven editorial gates
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-building-customer-service-agents.html editorial-qa/agent-construction.json
      - name: Preserve mobile screenshots and QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-article-mobile-review
          path: |
            editorial-qa/mobile-artifacts/
            editorial-qa/alphaevolve.json
            editorial-qa/agent-construction.json
          if-no-files-found: error
