name: Arabic editorial gate
# Always run on every PR so a required status check is never skipped by path filters.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  editorial-and-mobile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Render actual mobile layouts and create evidence
        run: python3 scripts/check_arabic_mobile.py
      - name: Render the SWE-Lancer Arabic article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-agentic-ai-swelancer-million-dollar-software-work.html
          EDITORIAL_REPORT: editorial-qa/agent-swelancer-ar.json
          MOBILE_ARTIFACT_PREFIX: agent-swelancer-ar
          EXPECTED_DIRECTION: rtl
        run: python3 scripts/check_arabic_mobile.py
      - name: Render the SWE-Lancer English article at actual mobile widths
        env:
          ARABIC_ARTICLE: en/article-agentic-ai-swelancer-million-dollar-software-work.html
          EDITORIAL_REPORT: editorial-qa/agent-swelancer-en.json
          MOBILE_ARTIFACT_PREFIX: agent-swelancer-en
          EXPECTED_DIRECTION: ltr
        run: python3 scripts/check_arabic_mobile.py
      - name: Render current Qur'anic reflection at actual mobile widths
        run: python3 scripts/check_quran_reflection_mobile.py
      - name: Render the OE evidence audit and feedback article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-oe-evidence-audit-and-feedback.html
          EDITORIAL_REPORT: editorial-qa/oe-audit-feedback.json
          MOBILE_ARTIFACT_PREFIX: oe-audit-feedback
        run: python3 scripts/check_arabic_mobile.py
      - name: Check OE evidence audit and feedback editorial gates
        run: python3 scripts/check_arabic_editorial.py article-oe-evidence-audit-and-feedback.html editorial-qa/oe-audit-feedback.json
      - name: Render the OE evidence huddles article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-oe-evidence-daily-safety-huddles.html
          EDITORIAL_REPORT: editorial-qa/oe-huddles.json
          MOBILE_ARTIFACT_PREFIX: oe-huddles
        run: python3 scripts/check_arabic_mobile.py
      - name: Check OE evidence huddles editorial gates
        run: python3 scripts/check_arabic_editorial.py article-oe-evidence-daily-safety-huddles.html editorial-qa/oe-huddles.json
      - name: Render the OE evidence interruptions article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-oe-evidence-medication-interruptions.html
          EDITORIAL_REPORT: editorial-qa/oe-interruptions.json
          MOBILE_ARTIFACT_PREFIX: oe-interruptions
        run: python3 scripts/check_arabic_mobile.py
      - name: Check OE evidence interruptions editorial gates
        run: python3 scripts/check_arabic_editorial.py article-oe-evidence-medication-interruptions.html editorial-qa/oe-interruptions.json
      - name: Render the OE evidence handoffs article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-oe-evidence-standardized-handoffs.html
          EDITORIAL_REPORT: editorial-qa/oe-handoffs.json
          MOBILE_ARTIFACT_PREFIX: oe-handoffs
        run: python3 scripts/check_arabic_mobile.py
      - name: Check OE evidence handoffs editorial gates
        run: python3 scripts/check_arabic_editorial.py article-oe-evidence-standardized-handoffs.html editorial-qa/oe-handoffs.json
      - name: Render the OE evidence defaults article at actual mobile widths
        env:
          ARABIC_ARTICLE: article-oe-evidence-defaults-shape-practice.html
          EDITORIAL_REPORT: editorial-qa/oe-defaults.json
          MOBILE_ARTIFACT_PREFIX: oe-defaults
        run: python3 scripts/check_arabic_mobile.py
      - name: Check OE evidence defaults editorial gates
        run: python3 scripts/check_arabic_editorial.py article-oe-evidence-defaults-shape-practice.html editorial-qa/oe-defaults.json
      - name: Check AlphaEvolve editorial gates using generated mobile evidence
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-alphaevolve-compute-scheduling.html editorial-qa/alphaevolve.json
      - name: Check the SWE-Lancer Arabic editorial gates
        run: python3 scripts/check_arabic_editorial.py article-agentic-ai-swelancer-million-dollar-software-work.html editorial-qa/agent-swelancer-ar.json
      - name: Preserve mobile screenshots and QA result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arabic-article-mobile-review
          path: |
            editorial-qa/mobile-artifacts/
            editorial-qa/alphaevolve.json
            editorial-qa/agent-swelancer-ar.json
            editorial-qa/agent-swelancer-en.json
            editorial-qa/oe-defaults.json
            editorial-qa/oe-handoffs.json
            editorial-qa/oe-interruptions.json
            editorial-qa/oe-huddles.json
            editorial-qa/oe-audit-feedback.json
          if-no-files-found: error
