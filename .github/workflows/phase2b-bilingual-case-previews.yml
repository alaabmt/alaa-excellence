name: Phase 2B bilingual case previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2b-bilingual-case-previews.yml'

permissions:
  contents: write

jobs:
  build-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install preview dependencies
        run: python -m pip install --quiet pillow arabic-reshaper python-bidi

      - name: Generate bilingual evidence-based previews
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display
          import re

          ROOT = Path('.')
          OUT = ROOT / 'assets' / 'previews'
          OUT.mkdir(parents=True, exist_ok=True)
          VERSION = '20260912-preview2'

          cases = {
            'case-rwanda-blood-on-demand-aerial-logistics': {
              'ar': {
                'title': 'كيف أعادت رواندا تصميم نموذج تشغيل إمداد الدم؟',
                'hook': 'من الاعتماد الأكبر على المخزون المحلي إلى إمداد شبكي سريع عند الطلب',
                'metrics': ['49.6 دقيقة متوسط زمن التوصيل', '67% انخفاض انتهاء الصلاحية بعد 12 شهراً'],
                'sector': 'الصحة · نموذج التشغيل'
              },
              'en': {
                'title': 'How Rwanda Redesigned the Operating Model for Blood Supply',
                'hook': 'From heavier reliance on local stock to rapid network resupply on demand',
                'metrics': ['49.6 min average delivery time', '67% fewer expirations at 12 months'],
                'sector': 'Healthcare · Operating Model'
              }
            },
            'case-bms-devens-future-ready-manufacturing': {
              'ar': {
                'title': 'كيف بنت BMS ديفنز مصنعاً أكثر استعداداً للمستقبل؟',
                'hook': 'بنية قابلة للتكيف وأتمتة وذكاء تشغيلي صُممت لمستقبل أكثر تعقيداً',
                'metrics': ['42%+ أسرع في إدخال المنتجات الجديدة', '40%+ زيادة في حجم الإنتاج'],
                'sector': 'التصنيع الدوائي · القدرات المستقبلية'
              },
              'en': {
                'title': 'How BMS Devens Built for Future-Ready Manufacturing',
                'hook': 'Flexible infrastructure, automation and connected intelligence built for a more complex future',
                'metrics': ['42%+ faster new-product introduction', '40%+ higher output'],
                'sector': 'Biopharma · Future-Ready Operations'
              }
            },
            'case-seha-virtual-hospital-expertise-network': {
              'ar': {
                'title': 'من نقل المريض إلى نقل الخبرة',
                'hook': 'فصل الوصول إلى الخبرة التخصصية عن ضرورة وجود المريض والمتخصص في المكان نفسه',
                'metrics': ['242+ مستشفى ضمن الشبكة', '220,000+ حالة سريرية في 2025'],
                'sector': 'الصحة · شبكة خبرة افتراضية'
              },
              'en': {
                'title': 'Moving Expertise, Not Patients',
                'hook': 'Separating access to specialist expertise from the need to share the same physical location',
                'metrics': ['242+ hospitals in the network', '220,000+ clinical cases in 2025'],
                'sector': 'Healthcare · Virtual Expertise Network'
              }
            },
            'case-john-deere-see-spray-precision-decision': {
              'ar': {
                'title': 'من رش الحقل كله إلى استهداف النبتة نفسها',
                'hook': 'نقل قرار الرش من مستوى الحقل إلى موقع الحاجة الفعلية أثناء الحركة',
                'metrics': ['43–59% خفض موثق في مبيدات ما بعد الإنبات'],
                'sector': 'الزراعة الدقيقة · القرار الذكي'
              },
              'en': {
                'title': 'From Spraying the Field to Targeting the Plant',
                'hook': 'Moving the spray decision from the whole field to the exact point of need',
                'metrics': ['43–59% documented reduction in post-emergence herbicide use'],
                'sector': 'Precision Agriculture · Decision Intelligence'
              }
            },
            'case-tawam-erabs-bariatric-recovery': {
              'ar': {
                'title': 'كيف أعاد توام تصميم رحلة جراحات السمنة؟',
                'hook': 'إعادة تنظيم الرحلة قبل الجراحة وأثناءها وبعدها بدلاً من تحسين كل مرحلة منفصلة',
                'metrics': ['الإقامة 3.2 ← 1.5 يوم', 'وقت غرفة العمليات 2:27 ← 1:23'],
                'sector': 'الصحة · إعادة تصميم رحلة المريض'
              },
              'en': {
                'title': 'How Tawam Redesigned the Bariatric Surgery Journey',
                'hook': 'Redesigning the pathway before, during and after surgery instead of optimizing isolated steps',
                'metrics': ['Length of stay 3.2 → 1.5 days', 'OR time 2:27 → 1:23'],
                'sector': 'Healthcare · Patient Journey Redesign'
              }
            },
            'case-aravind-eye-care-high-volume-value': {
              'ar': {
                'title': 'كيف أعادت Aravind تصميم جراحة المياه البيضاء؟',
                'hook': 'حجم أكبر وجودة قوية ووصول أوسع عبر إعادة تصميم العمل لا عبر التقشف',
                'metrics': ['6+ ملايين زيارة خارجية في السنة المنتهية في مارس 2025'],
                'sector': 'الصحة · نموذج تقديم الرعاية'
              },
              'en': {
                'title': 'How Aravind Redesigned Cataract Care',
                'hook': 'Higher volume, strong quality and wider access through work redesign rather than austerity',
                'metrics': ['6M+ outpatient visits in the year ending March 2025'],
                'sector': 'Healthcare · Care Delivery Model'
              }
            },
            'case-tamm-autogov-ai-native-government': {
              'ar': {
                'title': 'كيف تبني أبوظبي حكومة قائمة على الذكاء الاصطناعي؟',
                'hook': 'تحويل صورة مستقبلية إلى قدرات بشرية وتقنية وحوكمة وخدمات استباقية',
                'metrics': ['100+ حالة استخدام للذكاء الاصطناعي', '40+ جهة حكومية · 95%+ من قوة العمل مدرّبة'],
                'sector': 'الحكومة · الذكاء الاصطناعي الأصلي'
              },
              'en': {
                'title': 'How Abu Dhabi Is Building an AI-Native Government',
                'hook': 'Turning a future-state vision into capabilities, governance and proactive services',
                'metrics': ['100+ AI use cases in operation', '40+ entities · 95%+ of the workforce trained'],
                'sector': 'Government · AI-Native Operating Model'
              }
            },
            'case-dewa-hydro-insight-smart-water': {
              'ar': {
                'title': 'كيف بنت دبي شبكة مياه تكشف الخلل مبكراً؟',
                'hook': 'تحويل بيانات العدادات الذكية من قياس الاستهلاك إلى قدرة تشغيلية استباقية',
                'metrics': ['1.1+ مليون عداد مياه ذكي', 'بيانات تشغيلية كل 15 دقيقة'],
                'sector': 'المياه · الذكاء التشغيلي'
              },
              'en': {
                'title': 'How Dubai Built a Water Network That Detects Problems Earlier',
                'hook': 'Turning smart-meter data from consumption measurement into proactive operational intelligence',
                'metrics': ['1.1M+ smart water meters', 'Operational data every 15 minutes'],
                'sector': 'Water · Operational Intelligence'
              }
            },
            'case-ega-dx-ultra-innovation': {
              'ar': {
                'title': 'متى يصبح الابتكار قدرة قابلة للتصدير؟',
                'hook': 'تقنية صهر طُورت في الإمارات ثم اختارتها مؤسسة صناعية أخرى لتعمل في البحرين',
                'metrics': ['اختبار النقل: خط الإنتاج السادس في Alba'],
                'sector': 'الصناعة · الابتكار القابل للنقل'
              },
              'en': {
                'title': 'When Does Innovation Become an Exportable Capability?',
                'hook': 'Smelting technology developed in the UAE and then selected by another industrial operator in Bahrain',
                'metrics': ['Transfer test: Alba Line 6'],
                'sector': 'Industry · Transferable Innovation'
              }
            },
            'case-dubai-paperless-10x': {
              'ar': {
                'title': 'دبي بلا ورق: عندما نعيد تصميم العمل بدلاً من رقمنته',
                'hook': 'التحول الحقيقي كان إلغاء الحاجة إلى الورق، لا تحويل العملية الورقية إلى شاشة',
                'metrics': ['100% حكومة بلا ورق', '45 جهة حكومية ضمن التحول'],
                'sector': 'الحكومة · إعادة تصميم العمليات'
              },
              'en': {
                'title': 'Dubai Paperless: Redesigning Work Instead of Digitising Paper',
                'hook': 'The real shift was removing the need for paper, not moving the same paper process onto a screen',
                'metrics': ['100% paperless government', '45 government entities in the transformation'],
                'sector': 'Government · Process Redesign'
              }
            },
          }

          def font(size, bold=False):
            paths = [
              '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
              '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf'
            ]
            for p in paths:
              if Path(p).exists(): return ImageFont.truetype(p, size=size)
            return ImageFont.load_default()

          def ar(text):
            return get_display(arabic_reshaper.reshape(text))

          def display(text, lang):
            return ar(text) if lang == 'ar' else text

          def measure(draw, text, fnt, lang):
            return draw.textbbox((0,0), display(text,lang), font=fnt)[2]

          def wrap(draw, text, fnt, max_width, lang, max_lines):
            words = text.split()
            lines=[]; line=''
            for w in words:
              test=(line+' '+w).strip()
              if measure(draw,test,fnt,lang) <= max_width:
                line=test
              else:
                if line: lines.append(line)
                line=w
            if line: lines.append(line)
            if len(lines) > max_lines:
              lines = lines[:max_lines]
              last = lines[-1]
              while last and measure(draw,last+'…',fnt,lang) > max_width:
                last = ' '.join(last.split()[:-1])
              lines[-1] = last+'…'
            return lines

          def fit_font(draw, text, start, minimum, max_width, lang, max_lines):
            size=start
            while size>=minimum:
              f=font(size,True)
              if len(wrap(draw,text,f,max_width,lang,max_lines)) <= max_lines:
                return f
              size-=2
            return font(minimum,True)

          def draw_line(draw, xy, text, fnt, fill, lang, anchor):
            draw.text(xy, display(text,lang), font=fnt, fill=fill, anchor=anchor)

          def render(slug, lang, data):
            img=Image.new('RGB',(1200,630),'#071a2f')
            d=ImageDraw.Draw(img)
            # Editorial identity frame
            d.rounded_rectangle((42,38,1158,592),radius=34,fill='#0b2c4d',outline='#315979',width=2)
            d.rectangle((42,38,58,592),fill='#d3b56f')
            d.ellipse((900,-130,1320,290),fill='#123f69')
            d.ellipse((980,360,1260,640),fill='#09233f')

            right = 1080 if lang=='ar' else 96
            anchor = 'ra' if lang=='ar' else 'la'
            maxw = 800
            brand = 'التميّز 10X  |  حالة موثقة' if lang=='ar' else 'TAMAYUZ 10X  |  EVIDENCE-BASED CASE'
            author = 'الدكتور علاء محمد أحمد' if lang=='ar' else 'Dr. Alaa Mohammad Ahmed'
            byline = ('بقلم  ' + author) if lang=='ar' else ('By  ' + author)

            draw_line(d,(right,78),brand,font(30,True),'#dbe8f2',lang,anchor)
            draw_line(d,(right,122),data['sector'],font(24,False),'#d3b56f',lang,anchor)

            title_font=fit_font(d,data['title'],54,40,maxw,lang,3)
            title_lines=wrap(d,data['title'],title_font,maxw,lang,3)
            y=170
            for line in title_lines:
              draw_line(d,(right,y),line,title_font,'#ffffff',lang,anchor)
              y+=60

            hook_font=font(27,False)
            hook_lines=wrap(d,data['hook'],hook_font,maxw,lang,2)
            y+=4
            for line in hook_lines:
              draw_line(d,(right,y),line,hook_font,'#b9cee0',lang,anchor)
              y+=40

            # Evidence strip(s)
            y=max(y+12,408)
            metric_font=font(25,True)
            for metric in data['metrics'][:2]:
              lines=wrap(d,metric,metric_font,690,lang,1)
              text=lines[0]
              shown=display(text,lang)
              box=d.textbbox((0,0),shown,font=metric_font)
              width=box[2]-box[0]
              if lang=='ar':
                x0=right-width-26; x1=right+12
                d.rounded_rectangle((x0,y-8,x1,y+34),radius=14,fill='#133c64')
                draw_line(d,(right-8,y+12),text,metric_font,'#f4dfaa',lang,'ra')
              else:
                x0=right-12; x1=right+width+26
                d.rounded_rectangle((x0,y-8,x1,y+34),radius=14,fill='#133c64')
                draw_line(d,(right+8,y+12),text,metric_font,'#f4dfaa',lang,'la')
              y+=48

            draw_line(d,(right,558),byline,font(25,True),'#ffffff',lang,anchor)
            d.text((930,165),'10X',font=font(112,True),fill='#ffffff')
            img.save(OUT / f'{slug}-{lang}.png',format='PNG',optimize=True)

          for slug,langs in cases.items():
            render(slug,'ar',langs['ar'])
            render(slug,'en',langs['en'])

          # Collection previews
          collections={
            'ar': {'title':'حالات وتجارب 10X','hook':'تحولات موثقة · نتائج قابلة للقياس · دروس يمكن نقلها','by':'الدكتور علاء محمد أحمد'},
            'en': {'title':'10X Cases & Experiences','hook':'Documented transformations · Measurable results · Transferable lessons','by':'Dr. Alaa Mohammad Ahmed'}
          }
          for lang,data in collections.items():
            img=Image.new('RGB',(1200,630),'#071a2f'); d=ImageDraw.Draw(img)
            d.rounded_rectangle((42,38,1158,592),radius=34,fill='#0b2c4d',outline='#315979',width=2)
            d.rectangle((42,38,58,592),fill='#d3b56f')
            d.ellipse((900,-130,1320,290),fill='#123f69')
            right=1080 if lang=='ar' else 96; anchor='ra' if lang=='ar' else 'la'
            brand='التميّز 10X' if lang=='ar' else 'TAMAYUZ 10X'
            draw_line(d,(right,90),brand,font(34,True),'#9dc8e9',lang,anchor)
            draw_line(d,(right,190),data['title'],font(64,True),'#ffffff',lang,anchor)
            lines=wrap(d,data['hook'],font(31,False),760,lang,2)
            y=300
            for line in lines:
              draw_line(d,(right,y),line,font(31,False),'#d3b56f',lang,anchor); y+=46
            by=('بقلم  '+data['by']) if lang=='ar' else ('By  '+data['by'])
            draw_line(d,(right,520),by,font(28,True),'#ffffff',lang,anchor)
            d.text((930,165),'10X',font=font(112,True),fill='#ffffff')
            img.save(OUT / f'tenx-cases-collection-{lang}.png',format='PNG',optimize=True)

          def replace_preview_meta(path, url, alt):
            text=path.read_text(encoding='utf-8')
            # image URL in OG/Twitter regardless of attribute order
            def repl_tag(match):
              tag=match.group(0)
              tag=re.sub(r'content=["\'][^"\']*["\']', f'content="{url}"', tag, count=1)
              return tag
            text=re.sub(r'<meta[^>]+property=["\']og:image["\'][^>]*>', repl_tag, text, count=1, flags=re.I)
            text=re.sub(r'<meta[^>]+property=["\']og:image:secure_url["\'][^>]*>', repl_tag, text, count=1, flags=re.I)
            text=re.sub(r'<meta[^>]+name=["\']twitter:image["\'][^>]*>', repl_tag, text, count=1, flags=re.I)

            def repl_alt_tag(match):
              tag=match.group(0)
              tag=re.sub(r'content=["\'][^"\']*["\']', f'content="{alt}"', tag, count=1)
              return tag
            if re.search(r'<meta[^>]+property=["\']og:image:alt["\']',text,re.I):
              text=re.sub(r'<meta[^>]+property=["\']og:image:alt["\'][^>]*>',repl_alt_tag,text,count=1,flags=re.I)
            else:
              m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]*>',text,re.I)
              if m: text=text[:m.end()]+f'<meta property="og:image:alt" content="{alt}">'+text[m.end():]
            if re.search(r'<meta[^>]+name=["\']twitter:image:alt["\']',text,re.I):
              text=re.sub(r'<meta[^>]+name=["\']twitter:image:alt["\'][^>]*>',repl_alt_tag,text,count=1,flags=re.I)
            else:
              m=re.search(r'<meta[^>]+name=["\']twitter:image["\'][^>]*>',text,re.I)
              if m: text=text[:m.end()]+f'<meta name="twitter:image:alt" content="{alt}">'+text[m.end():]
            path.write_text(text,encoding='utf-8')

          for slug,langs in cases.items():
            ar_path=ROOT/f'{slug}.html'; en_path=ROOT/'en'/f'{slug}.html'
            ar_url=f'https://tamayuz10x.com/assets/previews/{slug}-ar.png?v={VERSION}'
            en_url=f'https://tamayuz10x.com/assets/previews/{slug}-en.png?v={VERSION}'
            if ar_path.exists():
              replace_preview_meta(ar_path,ar_url,f"التميّز 10X — {langs['ar']['title']} — الدكتور علاء محمد أحمد")
            if en_path.exists():
              replace_preview_meta(en_path,en_url,f"Tamayuz 10X — {langs['en']['title']} — Dr. Alaa Mohammad Ahmed")

          replace_preview_meta(ROOT/'articles.html',f'https://tamayuz10x.com/assets/previews/tenx-cases-collection-ar.png?v={VERSION}','التميّز 10X — حالات وتجارب موثقة — الدكتور علاء محمد أحمد')
          replace_preview_meta(ROOT/'en'/'articles.html',f'https://tamayuz10x.com/assets/previews/tenx-cases-collection-en.png?v={VERSION}','Tamayuz 10X — Evidence-based cases and experiences — Dr. Alaa Mohammad Ahmed')

          # Language-specific images on article cards
          def update_cards(path,lang):
            text=path.read_text(encoding='utf-8')
            for slug in cases:
              text=re.sub(
                rf'(assets/previews/{re.escape(slug)})(?:-ar|-en)?\.png\?v=[^"\']+',
                rf'assets/previews/{slug}-{lang}.png?v={VERSION}',
                text
              )
            path.write_text(text,encoding='utf-8')
          update_cards(ROOT/'articles.html','ar')
          update_cards(ROOT/'en'/'articles.html','en')

          # Assertions
          for slug in cases:
            assert (OUT/f'{slug}-ar.png').exists()
            assert (OUT/f'{slug}-en.png').exists()
            a=(ROOT/f'{slug}.html').read_text(encoding='utf-8')
            e=(ROOT/'en'/f'{slug}.html').read_text(encoding='utf-8')
            assert f'{slug}-ar.png?v={VERSION}' in a
            assert f'{slug}-en.png?v={VERSION}' in e
            assert f'{slug}-en.png?v={VERSION}' not in a
            assert f'{slug}-ar.png?v={VERSION}' not in e
          print('Bilingual preview generation and metadata checks passed')

      - name: Commit Phase 2B previews
        run: |
          if git diff --quiet; then
            echo "No preview changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews '*.html' 'en/*.html'
          git commit -m "[preview-phase2b] Add bilingual evidence-based case previews"
          git push
