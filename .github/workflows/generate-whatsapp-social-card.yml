name: Generate WhatsApp social preview card

on:
  push:
    paths:
      - '.github/workflows/generate-whatsapp-social-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate lightweight JPEG social card
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path('assets/images/Tamayuz Profile.png')
          out = Path('assets/images/tamayuz-profile-share.jpg')
          img = Image.open(src).convert('RGB')
          img = img.resize((1200, 630), Image.Resampling.LANCZOS)

          for quality in (88, 84, 80, 76, 72, 68):
              img.save(out, 'JPEG', quality=quality, optimize=True, progressive=True)
              if out.stat().st_size < 300 * 1024:
                  break

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')
          url = 'https://tamayuz10x.com/assets/images/tamayuz-profile-share.jpg?v=20260909-wa2'

          def replace_all(pattern, replacement, text):
              return re.sub(pattern, replacement, text, flags=re.I)

          s = replace_all(r'(<meta\s+property=["\']og:image["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', rf'\1{url}\2', s)
          s = replace_all(r'(<meta\s+property=["\']og:image:secure_url["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', rf'\1{url}\2', s)
          s = replace_all(r'(<meta\s+name=["\']twitter:image["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', rf'\1{url}\2', s)
          s = replace_all(r'(<meta\s+property=["\']og:image:type["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', r'\1image/jpeg\2', s)
          s = replace_all(r'(<meta\s+property=["\']og:image:width["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', r'\11200\2', s)
          s = replace_all(r'(<meta\s+property=["\']og:image:height["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', r'\1630\2', s)
          s = replace_all(r'(<meta\s+name=["\']twitter:card["\']\s+content=["\'])[^"\']+(["\']\s*/?>)', r'\1summary_large_image\2', s)

          page.write_text(s, encoding='utf-8')
          print(f'Generated {out}: {out.stat().st_size} bytes')
          PY

      - name: Commit generated card and metadata update
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'assets/images/tamayuz-profile-share.jpg' index.html
          git commit -m 'Use lightweight social preview card for WhatsApp [skip ci]'
          git push
