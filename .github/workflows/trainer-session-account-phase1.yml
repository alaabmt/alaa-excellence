name: Build trainer session account experience
on:
  push:
    paths:
      - '.github/workflows/trainer-session-account-phase1.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply trainer journey and dashboard updates
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # 1) Account: add a dedicated trainer-sessions section without changing auth logic.
          p=Path('account/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<div class="card"><h2 id="historyTitle">محاولاتي ونتائجي</h2><div id="history" class="muted">جارٍ التحميل…</div></div><div class="account-footer-actions">'
          replacement='<div class="card"><h2 id="historyTitle">محاولاتي ونتائجي</h2><div id="history" class="muted">جارٍ التحميل…</div></div><div class="card"><h2 id="trainerSessionsTitle">جلساتي التدريبية</h2><div id="trainerSessions" class="muted">جارٍ التحميل…</div></div><div class="account-footer-actions">'
          if marker in s:
              s=s.replace(marker,replacement,1)
          if '/assets/js/account-trainer-sessions.js' not in s:
              s=s.replace('</body></html>','<script type="module" src="/assets/js/account-trainer-sessions.js?v=20260912-trainer1"></script>\n</body></html>')
          p.write_text(s,encoding='utf-8')

          # 2) Session creation: save the trainer token to the authenticated account via the secure edge function.
          p=Path('tools/learning-preference-profile/session-ui.js')
          s=p.read_text(encoding='utf-8')
          helper='''\n  async function linkTrainerSessionToAccount(c,u,name,trainerToken){\n    try{\n      const mod=await import('/assets/js/trainer-sessions-client.js');\n      await mod.registerTrainerSession({sessionCode:c,sessionName:name,joinUrl:u,trainerToken});\n      return true;\n    }catch(e){\n      console.warn('Trainer session account link failed',e);\n      return false;\n    }\n  }\n\n'''
          if 'linkTrainerSessionToAccount' not in s:
              s=s.replace('  async function createLiveSession(){',helper+'  async function createLiveSession(){',1)

          start=s.find('  function renderCreated(c,u,name){')
          end=s.find('  async function createLiveSession(){',start)
          if start!=-1 and end!=-1:
              new_render='''  function renderCreated(c,u,name,linked=false){\n    const host=document.getElementById('sessionCreated'); if(!host) return;\n    const q1=qrPrimary(u), q2=qrFallback(u);\n    const dashboard=`trainer-dashboard.html?session=${encodeURIComponent(c)}`;\n    const accountUrl=`/account/?lang=${document.documentElement.lang==='ar'?'ar':'en'}`;\n    host.innerHTML=`<div class="lpp-section-block"><h3>${tx('Your trainer journey','رحلة المدرب في هذه الجلسة')}</h3><p class="lpp-help"><strong>1.</strong> ${tx('Create the session','أنشئ الجلسة')} → <strong>2.</strong> ${tx('Share link or QR','شارك الرابط أو QR')} → <strong>3.</strong> ${tx('Participants complete the assessment','يكمل المشاركون التقييم')} → <strong>4.</strong> ${tx('Review group results','راجع نتائج المجموعة')} → <strong>5.</strong> ${tx('Adapt the training','عدّل تصميم التدريب')}</p></div>\n      <div class="lpp-session-banner"><b>${tx('Current step','الخطوة الحالية')}:</b> ${tx('Share the assessment with participants, then open the group dashboard as results arrive.','شارك التقييم مع المشاركين، ثم افتح لوحة المجموعة مع وصول النتائج.')}</div>\n      <div class="lpp-session-created"><div class="lpp-session-details"><span>${tx('Session code','رمز الجلسة')}</span><strong dir="ltr">${c}</strong>${name?`<small>${esc(name)}</small>`:''}<label>${tx('Participant link','رابط المشاركين')}<input value="${esc(u)}" readonly></label><div class="lpp-actions"><button class="lpp-btn" id="copySession" type="button">${tx('Copy link','نسخ الرابط')}</button><a class="lpp-btn primary" href="${esc(u)}">${tx('Open participant link','فتح رابط المشارك')}</a><a class="lpp-btn" id="openQr" href="${esc(q1)}" target="_blank" rel="noopener">${tx('Open QR','فتح QR')}</a><a class="lpp-btn primary" href="${esc(dashboard)}">${tx('Open group dashboard','فتح لوحة المجموعة')}</a><a class="lpp-btn" href="${esc(accountUrl)}">${tx('My trainer sessions','جلساتي في حسابي')}</a></div><p class="lpp-help">${linked?tx('This session is saved to your account and can be opened later from another device after sign-in.','تم حفظ هذه الجلسة في حسابك، ويمكنك فتحها لاحقًا من جهاز آخر بعد تسجيل الدخول.'):tx('The session is active on this device. Account linking could not be confirmed yet; keep this browser open until you verify it in My Account.','الجلسة تعمل على هذا الجهاز. لم يتأكد ربطها بالحساب بعد؛ أبقِ هذا المتصفح متاحًا حتى تتحقق منها في «حسابي».')}</p></div><div class="lpp-qr"><img id="sessionQrImage" src="${esc(q1)}" data-fallback="${esc(q2)}" alt="QR code"><span>${tx('Participants can scan this QR code with their phone camera.','يمكن للمشاركين مسح رمز QR بكاميرا الهاتف.')}</span><small id="qrStatus"></small></div></div>\n      <div class="lpp-section-block"><h3>${tx('What does the trainer gain?','ماذا يستفيد المدرب؟')}</h3><p class="lpp-profile-sub">${tx('The group dashboard turns completed assessments into a training decision: group averages, preference distribution, a sample-size caution, interpretation, and practical recommendations for balancing practice, reflection, conceptual understanding, and application.','تحوّل لوحة المجموعة التقييمات المكتملة إلى قرار تدريبي: متوسطات المجموعة، توزيع التفضيلات، تنبيه على حجم العينة، تفسير للنتائج، وتوصيات عملية لموازنة الممارسة والتأمل والفهم المفاهيمي والتطبيق.')}</p></div>`;\n    document.getElementById('copySession').onclick=e=>copyText(u,e.currentTarget);\n    const img=document.getElementById('sessionQrImage');\n    img.addEventListener('error',()=>{const fb=img.dataset.fallback;if(fb&&img.src!==fb){img.src=fb;document.getElementById('openQr').href=fb;}else document.getElementById('qrStatus').textContent=tx('QR image could not load. Use the link or code.','تعذر تحميل QR. استخدم الرابط أو الرمز.');});\n  }\n\n'''
              s=s[:start]+new_render+s[end:]

          old="localStorage.setItem(`tamayuz10x-lpp-trainer-token-${c}`,d.trainer_token);\n      renderCreated(c,u,name);"
          new="localStorage.setItem(`tamayuz10x-lpp-trainer-token-${c}`,d.trainer_token);\n      const linked=await linkTrainerSessionToAccount(c,u,name,d.trainer_token);\n      renderCreated(c,u,name,linked);"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) Replace the trainer dashboard with an account-first version and local-token fallback.
          dashboard=r'''(() => {
  'use strict';
  const API='https://lpp-api.alaatoinnovate.workers.dev';
  const qs=new URLSearchParams(location.search);
  const code=(qs.get('session')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  const root=document.getElementById('dashboardRoot');
  let lang='ar';
  const tx=(en,ar)=>lang==='ar'?ar:en;
  const names={A:{en:'Learning by doing',ar:'التعلّم بالممارسة'},R:{en:'Reflection and review',ar:'التأمل والمراجعة'},T:{en:'Conceptual analysis',ar:'التحليل المفاهيمي'},P:{en:'Practical application',ar:'التطبيق العملي'}};
  const cls=k=>`code-${k}`;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const localToken=()=>localStorage.getItem(`tamayuz10x-lpp-trainer-token-${code}`)||'';

  function renderError(msg){root.innerHTML=`<h1>${tx('Group dashboard','لوحة المجموعة')}</h1><div class="lpp-session-error">${esc(msg)}</div><p>${tx('If this is an older session, open it from the browser where it was created. New sessions are saved under My Account.','إذا كانت هذه جلسة قديمة، افتحها من المتصفح الذي أُنشئت فيه. الجلسات الجديدة تُحفظ في «حسابي».')}</p>`;}

  async function accountDashboard(){
    try{
      const mod=await import('/assets/js/trainer-sessions-client.js');
      const r=await mod.getTrainerDashboard(code);
      return r?.dashboard||null;
    }catch(e){return null;}
  }

  async function legacyDashboard(){
    const t=localToken(); if(!t)return null;
    try{const r=await fetch(`${API}/api/lpp/sessions/${encodeURIComponent(code)}/dashboard`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();return r.ok&&d.ok?d:null;}catch(e){return null;}
  }

  async function load(){
    if(!code){renderError(tx('Missing session code.','رمز الجلسة غير موجود.'));return;}
    root.innerHTML=`<h1>${tx('Loading trainer dashboard…','جارٍ تحميل لوحة المدرب...')}</h1>`;
    const d=await accountDashboard()||await legacyDashboard();
    if(!d){renderError(tx('The group dashboard could not be reached.','تعذر الوصول إلى لوحة المجموعة.'));return;}
    render(d);
  }

  function sampleMessage(n){
    if(n<5)return `<div class="lpp-session-error"><strong>${tx('Very small sample','عينة صغيرة جدًا')}:</strong> ${tx('Use these results only as an early signal. Avoid treating them as representative of the whole group.','استخدم النتائج كمؤشر أولي فقط، ولا تتعامل معها بوصفها ممثلة للمجموعة كلها.')}</div>`;
    if(n<10)return `<div class="lpp-session-banner"><strong>${tx('Interpret with caution','فسّر بحذر')}:</strong> ${tx('The group picture is becoming useful, but it can still shift as more participants complete the assessment.','بدأت صورة المجموعة تصبح مفيدة، لكنها قد تتغير مع اكتمال مشاركين إضافيين.')}</div>`;
    return `<div class="lpp-session-banner"><strong>${tx('Group picture','صورة المجموعة')}:</strong> ${tx('The completed-response base is now more useful for session design. Keep interpreting it as a preference profile, not a fixed label.','أصبح عدد الاستجابات المكتملة أكثر فائدة لتصميم الجلسة. استمر في تفسيرها كتفضيلات تعلم، لا كتصنيف ثابت.')}</div>`;
  }

  function diversity(dist,n){
    const vals=['A','R','T','P','balanced'].map(k=>Number(dist?.[k]||0));
    const total=vals.reduce((a,b)=>a+b,0)||n||0;
    if(!total)return {label:tx('Not enough data','بيانات غير كافية'),note:tx('More completed assessments are needed.','نحتاج إلى تقييمات مكتملة إضافية.')};
    const share=Math.max(...vals)/total;
    if(share>=0.7)return {label:tx('More concentrated group','مجموعة أكثر تقاربًا'),note:tx('One leading profile is relatively common. Keep variety in the session so other preferences are not excluded.','يوجد ملف بارز أكثر شيوعًا نسبيًا. حافظ على تنوع أساليب الجلسة حتى لا تُستبعد التفضيلات الأخرى.')};
    if(share<=0.4)return {label:tx('Highly diverse group','مجموعة عالية التنوع'),note:tx('Preferences are distributed across the group. Use mixed methods and varied activity formats.','التفضيلات موزعة داخل المجموعة. استخدم أساليب متعددة وصيغ أنشطة متنوعة.')};
    return {label:tx('Moderately diverse group','مجموعة متوسطة التنوع'),note:tx('There is a visible tendency, but the group still contains meaningful variation.','يوجد اتجاه ظاهر، مع بقاء اختلافات مهمة داخل المجموعة.')};
  }

  function recommendations(avg,dist,n){
    const entries=['A','R','T','P'].map(k=>[k,Number(avg?.[k]||0)]).sort((a,b)=>b[1]-a[1]);
    const high=entries[0]?.[0], low=entries.at(-1)?.[0];
    const rec=[];
    if(high==='A')rec.push(tx('Use short explanations followed quickly by exercises, demonstrations, or live practice.','اجعل الشرح قصيرًا، ثم انتقل سريعًا إلى تمرين أو تجربة أو ممارسة مباشرة.'));
    if(high==='R')rec.push(tx('Build in short pauses for reflection, review, note-taking, and debriefing after activities.','أضف توقفات قصيرة للتأمل والمراجعة وتدوين الملاحظات واستخلاص التعلم بعد الأنشطة.'));
    if(high==='T')rec.push(tx('Make frameworks, logic, models, and conceptual links explicit before asking for application.','وضّح الأطر والمنطق والنماذج والروابط المفاهيمية قبل الانتقال إلى التطبيق.'));
    if(high==='P')rec.push(tx('Connect each concept to a realistic case, decision, tool, or workplace application.','اربط كل مفهوم بحالة واقعية أو قرار أو أداة أو تطبيق في بيئة العمل.'));
    if(low)rec.push(tx(`Do not neglect ${names[low].en}; deliberately include at least one activity that serves it.`,`لا تهمل «${names[low].ar}»؛ أضف عمدًا نشاطًا واحدًا على الأقل يخدم هذا البعد.`));
    const d=diversity(dist,n); if(d.label===tx('Highly diverse group','مجموعة عالية التنوع'))rec.push(tx('Use mixed small groups and rotate activity formats instead of relying on one teaching method.','استخدم مجموعات صغيرة متنوعة وبدّل صيغ الأنشطة بدل الاعتماد على أسلوب تدريبي واحد.'));
    return rec;
  }

  function render(d){
    const avg=d.averages||{}, dist=d.distribution||{}, n=d.participant_count??d.completed_participants??0;
    const scoreCards=['A','R','T','P'].map(k=>`<div class="trainer-score ${cls(k)}"><span>${esc(names[k][lang])}</span><b>${Number(avg[k]||0).toFixed(1)}%</b></div>`).join('');
    const hasDistribution=Object.keys(dist).length>0;
    const dv=diversity(dist,n); const recs=recommendations(avg,dist,n);
    const sorted=['A','R','T','P'].map(k=>[k,Number(avg[k]||0)]).sort((a,b)=>b[1]-a[1]);
    const top=sorted[0]?.[0], bottom=sorted.at(-1)?.[0];
    root.innerHTML=`
      <div class="lpp-results-head"><div><span class="lpp-eyebrow">${tx('Trainer Group Dashboard','لوحة المدرب للمجموعة')}</span><h1 class="lpp-profile-title">${esc(d.session?.name||tx('Learning Preference Group','مجموعة تفضيلات التعلّم'))}</h1><p class="lpp-profile-sub">${tx(`Session ${code} · ${n} completed participants`,`الجلسة ${code} · ${n} مشاركًا أكملوا التقييم`)}</p></div><button class="lpp-btn" id="refreshDash">${tx('Refresh','تحديث')}</button></div>
      ${sampleMessage(n)}
      <div class="lpp-section-block"><h2>${tx('1. Group picture','1. صورة المجموعة')}</h2><div class="trainer-summary">${scoreCards}</div></div>
      ${hasDistribution?`<div class="lpp-section-block"><h2>${tx('2. Leading-profile distribution','2. توزيع الملفات البارزة')}</h2><div class="lpp-meaning-grid">
        ${['A','R','T','P'].map(k=>`<article class="lpp-meaning-card ${cls(k)}"><div class="lpp-card-head"><h3>${esc(names[k][lang])}</h3><strong>${dist[k]||0}</strong></div></article>`).join('')}
        <article class="lpp-meaning-card"><div class="lpp-card-head"><h3>${tx('Relatively balanced','متوازن نسبيًا')}</h3><strong>${dist.balanced||0}</strong></div></article>
      </div><div class="lpp-session-banner"><strong>${esc(dv.label)}</strong> — ${esc(dv.note)}</div></div>`:''}
      <div class="lpp-section-block"><h2>${tx('3. What do the results mean?','3. ماذا تعني النتائج؟')}</h2><p class="lpp-profile-sub">${top?tx(`The strongest group tendency is toward ${names[top].en}. The lowest relative score is ${names[bottom].en}. This is a design signal, not a judgement of ability.`,`أقوى اتجاه في المجموعة هو «${names[top].ar}»، بينما يظهر «${names[bottom].ar}» بأقل متوسط نسبي. هذه إشارة لتصميم التدريب، وليست حكمًا على قدرات المشاركين.`):tx('More results are needed for interpretation.','نحتاج إلى نتائج إضافية للتفسير.')}</p></div>
      <div class="lpp-section-block"><h2>${tx('4. What should I change in my training?','4. ماذا أغيّر في تدريبي؟')}</h2><div class="lpp-meaning-grid">${recs.map((r,i)=>`<article class="lpp-meaning-card"><div class="lpp-card-head"><strong>${i+1}</strong></div><p>${esc(r)}</p></article>`).join('')}</div></div>
      <div class="lpp-section-block"><h2>${tx('5. How to use this responsibly','5. كيف تستخدمها بمسؤولية؟')}</h2><p class="lpp-profile-sub">${tx('Use group-level patterns to balance the learning experience. Do not label the whole group with one fixed type, and do not infer individual capability from a preference score. Individual reports remain personal by default.','استخدم الأنماط الجماعية لموازنة تجربة التعلم. لا تصنّف المجموعة كلها في نمط ثابت، ولا تستنتج قدرة الفرد من درجة تفضيل. تبقى التقارير الفردية شخصية افتراضيًا.')}</p></div>`;
    document.getElementById('refreshDash').onclick=load;
  }

  document.getElementById('dashLang').onclick=()=>{lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('dashLang').textContent=lang==='ar'?'English':'العربية';load();};
  load();
})();
'''
          Path('tools/learning-preference-profile/trainer-dashboard.js').write_text(dashboard,encoding='utf-8')

          p=Path('tools/learning-preference-profile/trainer-dashboard.html')
          s=p.read_text(encoding='utf-8').replace('trainer-dashboard.js?v=20260910-cloudflare1','trainer-dashboard.js?v=20260912-trainer2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: QA trainer account journey
        run: |
          python <<'PY'
          from pathlib import Path
          a=Path('account/index.html').read_text(encoding='utf-8')
          s=Path('tools/learning-preference-profile/session-ui.js').read_text(encoding='utf-8')
          d=Path('tools/learning-preference-profile/trainer-dashboard.js').read_text(encoding='utf-8')
          assert 'id="trainerSessions"' in a
          assert '/assets/js/account-trainer-sessions.js' in a
          assert 'linkTrainerSessionToAccount' in s
          assert 'registerTrainerSession' in s
          assert 'رحلة المدرب في هذه الجلسة' in s
          assert 'getTrainerDashboard' in d
          assert 'ماذا أغيّر في تدريبي؟' in d
          assert 'عينة صغيرة جدًا' in d
          print('trainer phase 1 QA passed')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add account/index.html tools/learning-preference-profile/session-ui.js tools/learning-preference-profile/trainer-dashboard.js tools/learning-preference-profile/trainer-dashboard.html
          git commit -m '[trainer] Link sessions to account and upgrade dashboard' || exit 0
          git push
