name: Add DEWA ASGR reviewed audio layer
on:
  push:
    paths:
      - '.github/workflows/add-dewa-asgr-audio-layer.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add article-specific pronunciation layer
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('case-dewa-asgr-self-healing-grid.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="assets/js/main.js"></script><script src="assets/js/arabic-tts-standard.js"></script><script src="assets/js/site-engagement.js"></script><script src="assets/js/mobile-social-share.js"></script>'
          new='<script src="assets/js/main.js"></script><script src="assets/js/arabic-tts-standard.js"></script><script src="assets/js/dewa-asgr-audio-layer.js?v=20260914-tts1"></script><script src="assets/js/site-engagement.js"></script><script src="assets/js/mobile-social-share.js"></script>'
          if old not in s:
              if 'dewa-asgr-audio-layer.js' in s:
                  print('already installed')
              else:
                  raise SystemExit('script target not found')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Static QA
        run: |
          test -f assets/js/dewa-asgr-audio-layer.js
          grep -q 'dewa-asgr-audio-layer.js?v=20260914-tts1' case-dewa-asgr-self-healing-grid.html
          grep -q '__tenxDewaAsgrSpeechQa' assets/js/dewa-asgr-audio-layer.js
          grep -q 'unresolvedAcronyms' assets/js/dewa-asgr-audio-layer.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add case-dewa-asgr-self-healing-grid.html
          git commit -m '[audio] Install reviewed DEWA ASGR pronunciation layer' || exit 0
          git push
# trigger-20260914-1
