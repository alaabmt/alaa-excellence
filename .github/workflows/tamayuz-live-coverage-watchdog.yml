name: Tamayuz Live Schedule Coverage Watchdog
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: tamayuz-live-schedule-coverage-watchdog
  cancel-in-progress: false
jobs:
  coverage:
    name: Confirm successful scheduled Live health check within 75 minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check schedule coverage and route persistent alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node live/qa/check-monitor-schedule.mjs
