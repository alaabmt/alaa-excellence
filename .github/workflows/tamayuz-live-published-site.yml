name: Tamayuz Live Published Site Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - 'live/index.html'
      - 'tests/tamayuz-live-published-site.mjs'
      - '.github/workflows/tamayuz-live-published-site.yml'
  pull_request:
    paths:
      - 'live/index.html'
      - 'tests/tamayuz-live-published-site.mjs'
      - '.github/workflows/tamayuz-live-published-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-ui:
    name: Public published Live UI checks (no votes or joins)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/tamayuz-live-published-site.mjs
