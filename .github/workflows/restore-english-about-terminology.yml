name: Finalize English consultant terminology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-english-about-terminology.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply terminology-only correction and retire this one-off workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('en/about.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<h3>Senior Business Consultant</h3>', '<h3>Consultant</h3>')
          s = s.replace('<h3>Senior Business Advisor</h3>', '<h3>Consultant</h3>')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q '<h3>Consultant</h3>' en/about.html
          rm -f .github/workflows/restore-english-about-terminology.yml

      - name: Commit final terminology correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/about.html
          git add -u .github/workflows/restore-english-about-terminology.yml
          git commit -m 'Use Consultant title and retire terminology workflow'
          git pull --rebase origin main
          git push origin HEAD:main
