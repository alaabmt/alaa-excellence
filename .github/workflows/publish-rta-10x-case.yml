name: Publish RTA 10X case
on:
  push:
    paths: ['.github/workflows/publish-rta-10x-case.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - shell: python
        run: |
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import json
          D='2026-09-13'; S='case-rta-adaptive-traffic-control-utc-ux-fusion'
          AT='من الإشارة الثابتة إلى شبكة تتعلم قبل الاختناق: كيف أعادت دبي بناء التحكم المروري؟'
          ET='From Timed Signals to a Network That Anticipates Congestion: How Dubai Rebuilt Traffic Control'
          def head(title,lang,desc,img,canon,alt):
            return f'''<!doctype html><html lang="{lang}" dir="{'rtl' if lang=='ar' else 'ltr'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><meta name="description" content="{desc}"><link rel="canonical" href="{canon}"><meta property="og:type" content="article"><meta property="og:title" content="{title}"><meta property="og:description" content="{desc}"><meta property="og:url" content="{canon}"><meta property="og:image" content="{img}?v=20260913-rta1"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="{alt}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{title}"><meta name="twitter:description" content="{desc}"><meta name="twitter:image" content="{img}?v=20260913-rta1"><meta property="article:published_time" content="2026-09-13T00:00:00+04:00"><meta property="article:modified_time" content="2026-09-13T00:00:00+04:00"><link rel="stylesheet" href="{'assets' if lang=='ar' else '../assets'}/css/style.css"><style>.case{{max-width:920px;margin:auto}}.case h1{{font-size:clamp(2rem,5vw,3.5rem);line-height:1.16}}.case h2{{margin-top:2.2rem}}.lead{{font-size:1.15rem;line-height:1.9}}.box{{padding:1.4rem;border-radius:18px;background:#f4f6f7;margin:1.4rem 0}}.metrics{{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}}.metric{{padding:1rem;border:1px solid #ddd;border-radius:14px}}.metric strong{{display:block;font-size:1.8rem}}</style><script type="application/ld+json">{{"@context":"https://schema.org","@type":"Article","headline":"{title}","datePublished":"2026-09-13","dateModified":"2026-09-13","inLanguage":"{lang}","author":{{"@type":"Person","name":"{'الدكتور علاء محمد أحمد' if lang=='ar' else 'Dr. Alaa Mohammad Ahmed'}"}},"mainEntityOfPage":"{canon}","image":"{img}"}}</script></head><body>'''
          ar=head(AT+' | التميّز 10X','ar','حالة 10X موثقة عن رحلة RTA من بناء البنية والمهارات إلى المحاكاة والتجارب التشغيلية والقياس والتوسع.','https://tamayuz10x.com/assets/previews/'+S+'-ar.png','https://tamayuz10x.com/'+S+'.html','التميّز 10X — حالة RTA دبي')+f'''<header class="site-header"><div class="container brand-row"><a href="/">التميّز 10X</a><a href="/en/{S}.html">English</a></div></header><main class="container section case"><p class="eyebrow">حالة 10X موثقة · دبي</p><h1>{AT}</h1><p class="lead">القصة ليست إضافة الذكاء الاصطناعي إلى إشارات المرور، بل بناء قدرة مؤسسية ترى حركة الشبكة، تحللها، تختبر البدائل قبل تطبيقها، ثم تعدّل التشغيل وتتوسع بناءً على نتائج مرحلية. الأدلة العامة توضح نموذج التشغيل، لكنها لا تنشر مدة pilot محددة أو بروتوكول القياس الكامل.</p><section class="box"><h2>الملخص التنفيذي</h2><p>في 2020 افتتحت هيئة الطرق والمواصلات مركز الأنظمة المرورية الذكية بتكلفة 590 مليون درهم، ورفعت تغطية الطرق بالأنظمة الذكية من 11% إلى 60%، وربطت أجهزة الميدان بمنصة iTraffic، ودربت 60 موظفاً إماراتياً على التشغيل والصيانة والدعم. في 2024 بدأت دراسة المرحلة الثانية للوصول إلى تغطية 100% للطرق الرئيسية. وفي فبراير 2025 بدأت ترقية التحكم المركزي إلى UTC-UX Fusion. وفي سبتمبر 2025 أعلنت أن التجارب التشغيلية للمرحلة الأولى حسنت تدفق تقاطعات مختارة بين 16% و37%، مع تحسن إجمالي معلن في زمن الرحلة بين 10% و20%. [1][2][3][4]</p></section><div class="metrics"><div class="metric"><strong>11% → 60%</strong>تغطية ITS في 2020 [1]</div><div class="metric"><strong>60</strong>موظفاً مؤهلاً للتشغيل [1]</div><div class="metric"><strong>16%–37%</strong>تحسن معلن في تدفق تقاطعات المرحلة الأولى [4]</div><div class="metric"><strong>≈300</strong>تقاطع مستهدف بحلول الربع الثالث 2026 [4]</div></div><h2>التحدي والمستقبل المنشود</h2><p>عندما يتغير الطلب المروري بالساعة أو الحادث أو الحدث، تصبح خطط الإشارات الثابتة أقل استجابة. المستقبل الموثق لدى RTA هو تنقل أكثر سلاسة واستدامة، مع تغطية أوسع وقدرة أكبر على توقع الازدحام. لا تثبت المصادر العامة استخدام منهجية استشراف رسمية محددة؛ لذلك الأدق وصفه بأنه توجه مستقبلي موثق.</p><p><strong>ITS — Intelligent Transportation Systems — أنظمة النقل الذكية</strong> هي أجهزة رصد واتصالات وبرمجيات ومراكز تحكم تدير الحركة بالبيانات. و<strong>UTC — Urban Traffic Control — التحكم الحضري بحركة المرور</strong> ينسق توقيت الإشارات عبر شبكة من التقاطعات.</p><h2>من الفكرة إلى التطبيق: نموذج التشغيل</h2><ol><li><strong>2020 — بناء العمود الفقري:</strong> مركز ITS، منصة iTraffic، كاميرات وأجهزة رصد وزمن رحلة وسرعة، ألياف ضوئية، تكامل مع مركز القيادة والتحكم وشرطة دبي، وتأهيل فرق التشغيل. [1]</li><li><strong>حتى 2024 — تعلم وتوسع:</strong> أعلنت RTA أن البرنامج الأوسع حسن رصد الحوادث 63%، وخفض زمن الاستجابة 30%، وخفض زمن الرحلة 20% في تطبيقات لوحات الرسائل المتغيرة. هذه ليست نتائج UTC-UX Fusion. [2]</li><li><strong>2024 — تصميم الجيل التالي:</strong> بدأت دراسة المرحلة الثانية لرفع التغطية من 60% إلى 100% وإدخال C-ITS وتقنيات أحدث، ووثقت في GITEX 2024 نية دمج iTraffic مع UTC-UX Fusion للمحاكاة في الزمن الحقيقي. [2][5]</li><li><strong>فبراير 2025 — بدء التنفيذ:</strong> التحليل التنبؤي والتوأم الرقمي والتعديل الديناميكي لتوقيت الإشارات. كان 10%–20% هدفاً معلناً عند الإطلاق، لا نتيجة متحققة بعد. [3]</li><li><strong>2025 — الاختبار والتجارب التشغيلية:</strong> اختبرت المرحلة الأولى سيناريوهات بالتوأم الرقمي قبل التطبيق الميداني، ثم نفذت operational trials على محاور محددة. [4]</li><li><strong>2025–2026 — التوسع:</strong> نحو 300 تقاطع على مراحل، مع موعد إكمال محدث إلى الربع الثالث 2026. [4]</li></ol><p><strong>Digital Twin — التوأم الرقمي</strong> نموذج رقمي لاختبار أثر تغيير الإشارة قبل تطبيقه في الشارع. و<strong>C-ITS — Cooperative Intelligent Transport Systems — أنظمة النقل الذكية التعاونية</strong> تسمح بتبادل البيانات بين المركبات والبنية التحتية، بينما <strong>V2X — Vehicle-to-Everything — اتصال المركبة بكل ما حولها</strong> هو المصطلح الأوسع لهذا التبادل.</p><section class="box"><h2>التحول الحاسم 10X</h2><p><strong>بيانات ميدانية ← رؤية مركزية ← اكتشاف نمط الازدحام ← تحليل وتنبؤ ← محاكاة ← تعديل الإشارات ← تطبيق ميداني ← قياس ← تعلم وتوسع.</strong></p><p>التحول لم يبدأ بالخوارزمية. بُنيت الأجهزة والاتصالات والمنصة ومركز التشغيل والمهارات أولاً، ثم أضيفت المحاكاة والتحليلات إلى دورة القرار.</p></section><h2>دليل الأثر والمؤشرات</h2><p>في 4 سبتمبر 2025 أعلنت RTA تحسناً بين 16% و37% في كفاءة وانسيابية تقاطعات مختارة: حتى 37% في شارع جميرا، 29.4% في البدع، 16.9% في الكويت، و16.4% في عمر بن الخطاب، مع تحسن إجمالي في زمن الرحلة 10%–20%. المؤشرات المنشورة تشمل زمن الرحلة، تدفق/كفاءة التقاطعات، الانتظار والتنسيق بين التقاطعات. [4]</p><p>لكن المصدر لا ينشر عدد أيام خط الأساس، حجم العينة، المقام التفصيلي لمؤشر التدفق، أو بروتوكول before/after الكامل. لذلك تبقى دقة نسبة السببية محدودة بما هو منشور.</p><h2>هل كان هناك Pilot؟ وكم استغرق؟</h2><p>المصادر تستخدم «المرحلة الأولى» و«التجارب التشغيلية»، وتذكر اختبار السيناريوهات رقمياً قبل النشر الميداني. لا تنشر تاريخ بداية ونهاية pilot ميداني محدد ولا مدة كل تجربة. الفاصل بين إعلان فبراير ونتائج سبتمبر أقل من سبعة أشهر، لكنه <strong>ليس دليلاً على مدة pilot</strong>.</p><h2>الدليل الأكاديمي المستقل</h2><p>رسالة ماجستير من RIT Dubai في فبراير 2026 درست تحسين توقيت الإشارات ببيانات آنية مثل عدد المركبات وأنواعها ووقت اليوم ويوم الأسبوع. حقق نموذج الشبكة العصبية معامل ارتباط 0.98 وR² قدره 0.97. الدراسة تدعم منطق التحكم المتكيف بالبيانات، لكنها لا تقيّم UTC-UX Fusion ولا تتحقق مستقلاً من نتائج RTA. [6]</p><h2>عدسة 10X والاستخدام العملي</h2><p>الركائز المدعومة هي: التوجه المستقبلي، مضاعفة القدرات، إعادة ابتكار نموذج التشغيل، الابتكار والتجريب، الذكاء المؤسسي والتقني، والنتائج التشغيلية. الدرس للقائد: حدد القرار الذي تريد تحسينه، ابنِ الرؤية والبيانات والاتصالات والمسؤولية والمهارات، اختبر في بيئة آمنة، حدد خط الأساس، نفذ تجربة محدودة، تعلم ثم توسع. يجب أن يكون واضحاً دائماً: من يرى؟ من يفسر؟ من يقرر؟ وما الذي تتم أتمتته؟</p><h2>قابلية النقل</h2><p>يمكن نقل المنطق إلى الطاقة والمياه وسلاسل الإمداد وغرف العمليات وإدارة الحشود: <strong>رؤية النظام ← توقع الضغط ← اختبار البديل ← تطبيق محدود ← قياس ← تعلم ← توسع.</strong></p><section class="box"><h2>حدود الدليل</h2><p>نتائج 16%–37% و10%–20% معلنة من RTA؛ التغطية الصحفية المستقلة تعيد نقلها ولا تدقق المنهجية. لم نعثر على ورقة أكاديمية عامة تقيّم UTC-UX Fusion في دبي مباشرة. مدة الاختبار الميداني الدقيقة، تعريف مؤشر التدفق وخط الأساس الكامل وتوزيع صلاحيات القرار بين المشغل والنظام غير منشورة.</p></section><h2>Company Insider Critique — نقد الخبير الداخلي</h2><p>المراجعة المحاكاة من منظور قائد أنظمة مرور داخل RTA كشفت مخاطر اختزال التحول في AI، والقفز فوق سنوات بناء القدرة، وتسمية المرحلة الأولى Pilot بلا سند، وقراءة نسب التحسن كأنها تقييم مستقل. عُدل المقال ليفصل نتائج ITS الأوسع عن UTC-UX Fusion، ويستخدم وصف «التجارب التشغيلية» المنشور، ويضع تفاصيل القياس غير المتاحة ضمن حدود الدليل. بقي غير قابل للتحقق: مدة الاختبار، بروتوكول القياس الكامل، وما الذي عُدل أو رُفض بعد الاختبار.</p><section class="box"><h2>سؤال 10X المستقبلي</h2><p><strong>ما المستقبل الذي نطمح أن تعمل فيه مؤسستنا عندما يصبح التغير أسرع من قدرة الأساليب الثابتة على الاستجابة؟ كيف سيبدو عملياً؟</strong></p><p><strong>المستقبل المنشود ← قدرات الرصد والتنبؤ والمحاكاة والقرار ← بيانات وأنظمة ومهارات وحوكمة يجب بناؤها اليوم ← طريقة عمل تجريبية واستباقية ← النتائج والأثر.</strong></p></section><aside><strong>تنويه تحريري:</strong><p>الآراء والتحليلات الواردة في هذا المقال تمثل رأي الكاتب وتحليله المهني استنادًا إلى المصادر المشار إليها، ولا تمثل بالضرورة المواقف الرسمية للجهات المذكورة. وللاطلاع على المعلومات والمراجع الأصلية والكاملة والأحدث، يُرجى الرجوع مباشرة إلى المصادر الأصلية والوثائق الرسمية الواردة في قائمة المراجع.</p></aside><h2>المراجع</h2><ol><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/mohammed-bin-rashid-inaugurates-aed590-million-dubai-intelligent-traffic-systems-centre-at-al-barsha?lang=en">RTA — مركز الأنظمة المرورية الذكية، 2020</a>.</li><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/launching-phase-ii-study-of-intelligent-traffic-systems-initiative">RTA — دراسة المرحلة الثانية، 2024</a>.</li><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/launching-traffic-signal-control-system-upgrade-using-ai-and-digital-twin-technology">RTA — بدء UTC-UX Fusion، فبراير 2025</a>.</li><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/37-percent-improvement-in-intersection-flow-through-the-traffic-signal-system">RTA — نتائج المرحلة الأولى، سبتمبر 2025</a>.</li><li><a href="https://www.rta.ae/links/promotions/gitex-2024/pdf/Advanced-Traffic.pdf">RTA — Advanced Traffic Management System، GITEX 2024</a>.</li><li><a href="https://repository.rit.edu/theses/12516/">RIT Dubai — Optimizing Traffic Signal Timings Using Real Time Data Analytics، 2026</a>.</li><li><a href="https://www.khaleejtimes.com/uae/transport/dubai-upgraded-central-traffic-signal-control-system">Khaleej Times — تغطية مستقلة لنتائج سبتمبر 2025</a>.</li></ol><div style="position:absolute;left:-9999px" aria-hidden="true">مِنَ الإِشَارَةِ الثَّابِتَةِ إِلَى شَبَكَةٍ تَتَعَلَّمُ قَبْلَ الاخْتِنَاقِ. بَنَتْ دُبَيُّ قُدْرَةَ الرَّصْدِ وَالاتِّصَالِ وَالتَّحَكُّمِ وَالمَهَارَاتِ، ثُمَّ أَضَافَتِ التَّحْلِيلَ التَّنَبُّؤِيَّ وَالتَّوْأَمَ الرَّقْمِيَّ، وَاخْتَبَرَتْ سِينَارْيُوهَاتٍ قَبْلَ التَّطْبِيقِ المَيْدَانِيِّ.</div></main><script src="assets/js/main.js"></script><script src="assets/js/arabic-tts-standard.js"></script><script src="assets/js/site-engagement.js"></script><script src="assets/js/mobile-social-share.js"></script></body></html>'''
          en=head(ET+' | Tamayuz 10X','en','Evidence-based 10X case on Dubai RTA: capability build, simulation, operational trials, metrics, scaling and evidence limits.','https://tamayuz10x.com/assets/previews/'+S+'-en.png','https://tamayuz10x.com/en/'+S+'.html','Tamayuz 10X — Dubai RTA case')+f'''<header class="site-header"><div class="container brand-row"><a href="/en/">Tamayuz 10X</a><a href="/{S}.html">العربية</a></div></header><main class="container section case"><p class="eyebrow">Evidence-Based 10X Case · Dubai</p><h1>{ET}</h1><p class="lead">This is not a story about adding AI to traffic lights. It is about building an institutional capability to see the network, analyse changing demand, simulate alternatives before field deployment, adjust operations, measure results and scale in stages. Public evidence makes the operating path visible, but not a defined pilot duration or a full evaluation protocol.</p><section class="box"><h2>Executive Snapshot</h2><p>In 2020, Dubai's Roads and Transport Authority (RTA) opened its AED590 million Intelligent Traffic Systems Centre, expanding ITS coverage from 11% to 60%, connecting field devices to iTraffic, and qualifying 60 Emirati employees for operations and support. In 2024 RTA began Phase II study and design toward 100% coverage of major roads. In February 2025 it began the UTC-UX Fusion upgrade. By September 2025, RTA reported Phase 1 operational-trial improvements of 16% to 37% at selected intersections and overall journey-time improvement of 10% to 20%. [1][2][3][4]</p></section><div class="metrics"><div class="metric"><strong>11% → 60%</strong>ITS coverage in 2020 [1]</div><div class="metric"><strong>60</strong>Emirati staff qualified [1]</div><div class="metric"><strong>16%–37%</strong>RTA-reported Phase 1 flow gains [4]</div><div class="metric"><strong>≈300</strong>signals targeted by Q3 2026 [4]</div></div><h2>The Challenge and Desired Future</h2><p>Fixed signal plans become less responsive when demand shifts by hour, incident or event. RTA's documented direction is smoother, more sustainable mobility with broader intelligent-system coverage and stronger congestion anticipation. The sources do not establish a named formal foresight methodology, so the defensible claim is a documented future orientation.</p><p><strong>Intelligent Transportation Systems (ITS)</strong> combine sensing, communications, software and control centres. <strong>Urban Traffic Control (UTC)</strong> coordinates signals across a network rather than treating junctions in isolation.</p><h2>From Idea to Operating Model</h2><ol><li><strong>2020 — Build the backbone:</strong> ITS Centre, iTraffic, cameras and field sensors, journey-time and speed measurement, fibre communications, integration with EC3 and Dubai Police, and trained operating teams. [1]</li><li><strong>Through 2024 — Learn and expand:</strong> RTA reported that the broader ITS programme improved incident monitoring by 63%, cut response time by 30%, and reduced journey time by 20% through Variable Message Sign applications. These are not UTC-UX Fusion results. [2]</li><li><strong>2024 — Design the next generation:</strong> Phase II targeted 100% major-road coverage and C-ITS; GITEX 2024 material described planned iTraffic integration with UTC-UX Fusion for real-time simulation. [2][5]</li><li><strong>February 2025 — Implement:</strong> predictive analysis, digital-twin principles and dynamic signal optimisation. The 10%–20% figure was a launch target, not yet an achieved result. [3]</li><li><strong>2025 — Simulate and trial:</strong> scenarios were tested digitally before field deployment, followed by operational trials on selected corridors. [4]</li><li><strong>2025–2026 — Scale:</strong> around 300 signalised intersections in phases, with updated completion expected in Q3 2026. [4]</li></ol><p>A <strong>digital twin</strong> is a digital model used to test a proposed signal change before it reaches the street. <strong>Cooperative Intelligent Transport Systems (C-ITS)</strong> enable data exchange between vehicles and infrastructure; <strong>Vehicle-to-Everything (V2X)</strong> is the broader communication concept.</p><section class="box"><h2>The 10X Move</h2><p><strong>Field data → network visibility → congestion-pattern detection → analysis and prediction → simulation → signal adjustment → field deployment → measurement → learning and scaling.</strong></p><p>The transformation did not start with the algorithm. RTA first built devices, communications, an integrated platform, a control centre and human operating capability, then added simulation and predictive analysis to the decision loop.</p></section><h2>Impact Evidence and Metrics</h2><p>On 4 September 2025 RTA reported flow/efficiency gains of up to 37% at Jumeirah Street intersections, 29.4% at Al Badaa, 16.9% at Kuwait Street and 16.4% at Omar Bin Al Khattab Street, with overall journey-time improvement of 10%–20%. Published metrics include journey time, intersection flow/efficiency, waiting time and coordination. [4]</p><p>Public material does not disclose baseline-day count, sample size, the exact denominator behind “flow improvement,” or the full before/after protocol. Causal precision therefore remains limited to the published evidence.</p><h2>Was There a Pilot, and How Long?</h2><p>Public sources use “Phase 1” and “operational trials,” and say scenarios were tested digitally before field deployment. They do not publish start/end dates for a defined field pilot or the duration of each trial. The interval from February launch to September results is under seven months, but <strong>it is not evidence of pilot duration</strong>.</p><h2>Independent Academic Context</h2><p>A February 2026 RIT Dubai master's thesis examined signal optimisation using real-time variables including vehicle counts, vehicle types, time of day and day of week. Its neural-network model achieved a 0.98 correlation coefficient and R² of 0.97. The study supports the logic of data-driven adaptive control; it does not evaluate UTC-UX Fusion or independently validate RTA's reported results. [6]</p><h2>10X Lens and Practical Use</h2><p>Supported pillars are future orientation, capability multiplication, operating-model reinvention, experimentation, institutional/technical intelligence and operating outcomes. The leadership lesson is sequencing: define the decision, build visibility and reliable data, communications, ownership and skills; create a safe test environment; establish baseline metrics; run a bounded trial; learn; then scale. Make explicit who sees, interprets and decides, and what is automated.</p><h2>Transferability</h2><p>The logic transfers to utilities, supply chains, operating theatres and crowd management: <strong>see the system → anticipate pressure → test the alternative → deploy narrowly → measure → learn → scale.</strong></p><section class="box"><h2>Evidence Limits</h2><p>The 16%–37% and 10%–20% outcomes are RTA-reported; independent news coverage repeats them but does not audit the methodology. No public academic paper was found that directly evaluates UTC-UX Fusion in Dubai. Trial duration, full baseline protocol, the detailed flow denominator and operator/system decision-rights split are not public.</p></section><h2>Company Insider Critique</h2><p>A simulated review from the perspective of a senior RTA traffic-systems leader identified four risks: reducing the transformation to “AI,” skipping the multi-year capability build, calling Phase 1 a pilot without evidence, and treating published percentages as independently audited. The case was revised to separate broader ITS outcomes from UTC-UX Fusion, use RTA's term “operational trials,” and place unavailable measurement detail in the evidence limits. Still unverified are precise trial duration, the full evaluation protocol and what was rejected or redesigned after testing.</p><section class="box"><h2>The Future-Focused 10X Question</h2><p><strong>What future do we want our organisation to operate in when change moves faster than fixed methods can respond, and what would that future look like in practice?</strong></p><p><strong>Desired Future → sensing, prediction, simulation and decision capabilities → data, systems, skills and governance to build now → a more experimental and anticipatory operating model → outcomes and impact.</strong></p></section><aside><strong>Editorial notice:</strong><p>The views and analysis in this article are the author's professional interpretation based on the cited sources and do not necessarily represent the official positions of the organisations mentioned. For complete and current information, consult the original sources and official documents listed below.</p></aside><h2>References</h2><ol><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/mohammed-bin-rashid-inaugurates-aed590-million-dubai-intelligent-traffic-systems-centre-at-al-barsha?lang=en">RTA — Dubai ITS Centre, 2020</a>.</li><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/launching-phase-ii-study-of-intelligent-traffic-systems-initiative">RTA — ITS Phase II study, 2024</a>.</li><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/launching-traffic-signal-control-system-upgrade-using-ai-and-digital-twin-technology">RTA — UTC-UX Fusion launch, Feb 2025</a>.</li><li><a href="https://www.rta.ae/wps/portal/rta/ae/home/news-and-media/all-news/NewsDetails/37-percent-improvement-in-intersection-flow-through-the-traffic-signal-system">RTA — Phase 1 results, Sep 2025</a>.</li><li><a href="https://www.rta.ae/links/promotions/gitex-2024/pdf/Advanced-Traffic.pdf">RTA — Advanced Traffic Management System, GITEX 2024</a>.</li><li><a href="https://repository.rit.edu/theses/12516/">RIT Dubai — Optimizing Traffic Signal Timings Using Real Time Data Analytics, 2026</a>.</li><li><a href="https://www.khaleejtimes.com/uae/transport/dubai-upgraded-central-traffic-signal-control-system">Khaleej Times — independent coverage, Sep 2025</a>.</li></ol></main><script src="../assets/js/main.js"></script><script src="../assets/js/site-engagement.js"></script><script src="../assets/js/mobile-social-share.js"></script></body></html>'''
