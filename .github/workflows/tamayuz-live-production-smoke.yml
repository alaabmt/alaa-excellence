name: Tamayuz Live Production Read-Only Smoke
on:
  push:
    branches: [main]
    paths:
      - 'live/backend/index.ts'
      - 'tests/tamayuz-live-production-smoke.mjs'
      - '.github/workflows/tamayuz-live-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node tests/tamayuz-live-production-smoke.mjs
