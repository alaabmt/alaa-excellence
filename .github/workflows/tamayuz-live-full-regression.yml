name: Tamayuz Live Full Regression
on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'tests/tamayuz-live-*.test.mjs'
      - 'scripts/audit_unified_navigation.py'
  pull_request:
    paths:
      - 'live/**'
      - 'tests/tamayuz-live-*.test.mjs'
      - 'scripts/audit_unified_navigation.py'
permissions:
  contents: read
jobs:
  live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/tamayuz-live-*.test.mjs
      - run: python3 scripts/audit_unified_navigation.py
