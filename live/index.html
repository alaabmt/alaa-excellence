function clinicalCaseMarkup(prompt){
 const raw=String(prompt||"").replace(/\r\n?/g,"\n").trim();
 const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const questionStart=lines.findIndex(x=>/^(Which\b|What\b|Identify\b|Select\b|Choose\b)/i.test(x));
 const body=questionStart>=0?lines.slice(0,questionStart):lines;
 const challenge=questionStart>=0?lines.slice(questionStart).join(" "):"";
 const sections=[];let current={heading:"",text:[]};
 const heading=/^((?:Admission|Operative|Discharge|Dietitian|Nursing|Emergency department|ED|Consultation|Progress|Day\s*\d+(?:\s*(?:and|&|[-–])\s*\d+)?(?:\s+progress)?|Postoperative day\s*\d+|Hospital day\s*\d+)[^:]{0,48}(?:note|summary|assessment|report)?):\s*/i;
 for(const line of body){
  const match=line.match(heading);
  if(match){if(current.text.length)sections.push(current);current={heading:match[1],text:[line.slice(match[0].length)]}}
  else current.text.push(line);
 }
 if(current.text.length)sections.push(current);
 return '<div class="clinical-case">'+sections.map((part,i)=>'<section class="clinical-section '+(i===0&&!part.heading?'clinical-intro':'')+'">'+(part.heading?'<h3 class="clinical-heading">'+esc(part.heading)+'</h3>':i===0?'<h3 class="clinical-heading">'+t("Patient presentation","عرض الحالة")+'</h3>':'')+'<div class="clinical-copy">'+part.text.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div></section>').join("")+(challenge?'<div class="clinical-challenge"><strong>'+esc(challenge)+'</strong></div>':'')+'</div>';
}
function resultChoiceMarkup(label,index,votes,total,answerRevealed,correctAnswer){

 const isCorrect=!!answerRevealed&&!!correctAnswer&&String(label).trim()===String(correctAnswer).trim();
 const faded=!!answerRevealed&&!isCorrect;
 const classes="stage-result result-choice result-tone-"+(index%4)+(isCorrect?" result-correct":faded?" result-muted":"");
 return '<div class="'+classes+'"><div class="stage-result-label"><span class="result-choice-name" style="font-size:22px;font-weight:800;line-height:1.35;color:#20233d">'+(isCorrect?'<span class="result-check" aria-label="'+t("Correct answer","الإجابة الصحيحة")+'">✓</span>':'')+esc(label)+'</span><strong>'+pct+'% · '+votes+'</strong></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>';
}

   const total=v.count||0;
   if(!selected)results.innerHTML="";
   else if(!s.show_results)results.innerHTML='<div class="stage-empty">'+t("Results are hidden. Select Show results when ready.","النتائج مخفية. اختر إظهار النتائج عندما تكون جاهزًا.")+'</div>';
   else{
    const counts=new Map((v.aggregate||[]).map(x=>[String(x.answer),Number(x.votes)||0]));
    const labels=selected.kind==="choice"?(selected.options||[]):selected.kind==="rating"?["1","2","3","4","5"]:[...counts.keys()];
    results.innerHTML='<div class="stage-count"><strong>'+total+'</strong><span>'+t("responses","إجابة")+'</span></div>'+labels.map((label,i)=>{const n=counts.get(String(label))||0,pct=total?Math.round(n*100/total):0;return resultChoiceMarkup(label,i,n,total,s.reveal_correct_answer,selected.correct_answer)}).join("");
   }
   if(selected&&s.show_results&&s.reveal_correct_answer&&selected.correct_answer){
    results.innerHTML+='<section class="answer-explanation"><h3>'+t("Correct answer","الإجابة الصحيحة")+': '+esc(selected.correct_answer)+'</h3>'+(selected.answer_justification?'<p><strong>'+t("Justification","التبرير")+':</strong> '+esc(selected.answer_justification)+'</p>':'')+(selected.answer_effect?'<p><strong>'+t("Effect","الأثر")+':</strong> '+esc(selected.answer_effect)+'</p>':'')+'</section>';
   }
  }
 }catch(e){const updateStatus=$("live-update-status");if(updateStatus)updateStatus.textContent=t("Live update interrupted. Retrying automatically: ","توقف التحديث المباشر. إعادة المحاولة تلقائيًا: ")+e.message;if(!$("presenter-root"))layout('<div class="panel"><h2>'+t("Presenter access failed","تعذر دخول المقدم")+'</h2><p class="error">'+esc(e.message)+'</p></div>')}
 finally{busy=false}
}

let audienceBusy=false,audienceSubmitting=false,audienceSnapshotKey="",audienceLastResponse=null;
function audienceResults(v,q){
 const counts=new Map((v.aggregate||[]).map(x=>[String(x.answer),Number(x.votes)||0]));
 const labels=q.kind==="choice"?(q.options||[]):q.kind==="rating"?["1","2","3","4","5"]:[...counts.keys()];
 const total=v.count||0;
 return '<section class="audience-results" aria-label="'+t("Live results","النتائج المباشرة")+'"><h3>'+t("Results","النتائج")+' · '+total+' '+t("responses","إجابة")+'</h3>'+labels.map((label,i)=>{const n=counts.get(String(label))||0;return resultChoiceMarkup(label,i,n,total,v.session.reveal_correct_answer,q.correct_answer)}).join("")+'</section>';
}
function audienceExplanation(v,q){
 if(!v.session.show_results||!v.session.reveal_correct_answer||!q.correct_answer)return "";
 return '<section class="answer-explanation"><h3>'+t("Correct answer","الإجابة الصحيحة")+': '+esc(q.correct_answer)+'</h3>'+(q.answer_justification?'<p><strong>'+t("Justification","التبرير")+':</strong> '+esc(q.answer_justification)+'</p>':'')+(q.answer_effect?'<p><strong>'+t("Effect","الأثر")+':</strong> '+esc(q.answer_effect)+'</p>':'')+'</section>';
}
function styleAudience(){
 const root=$("audience-root");if(root)root.classList.add("audience-wrap");
 const poll=$("poll");if(poll)poll.querySelectorAll(".option").forEach((b,i)=>{if(!b.querySelector(".letter")){const label=b.textContent;b.textContent="";const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);const text=document.createElement("span");text.textContent=label;b.append(letter,text)}});
}
async function audiencePage(force=false){
 if(audienceBusy||audienceSubmitting)return;
 audienceBusy=true;
 const code=params.get("code");
 try{
  if(!participant){const joined=await api("join",{code});participant=joined.participant_token;sessionStorage.setItem("live-participant-"+code,participant)}
  const v=await api("view",{code});audienceLastResponse=v;
  const s=v.session,q=v.questions[0],voteKey="live-voted-"+s.id+"-"+(q?.id||"");
  const voted=!!sessionStorage.getItem(voteKey);
  // A vote changes the session revision; do not rebuild the active voting form for that.
  const key=[s.id,q?.id||"",s.state,voted,s.show_results,s.reveal_correct_answer].join("|");
  const changed=key!==audienceSnapshotKey||!$("audience-root");
  if(!changed&&!force){
   if(s.show_results&&q){const results=$("audience-live-results");if(results)results.innerHTML=audienceResults(v,q)+audienceExplanation(v,q)}
   return;
  }
  audienceSnapshotKey=key;
  if(!$("audience-root"))layout('<div id="audience-root"><h1>'+t("Live conference","المؤتمر المباشر")+'</h1><div class="panel"><p id="audience-state" class="muted"></p><div id="poll"></div><p id="notice" role="status" aria-live="polite"></p></div></div>');
  const poll=$("poll"),state=$("audience-state");if(!poll)return;
  if(state)state.textContent=t("Session","الجلسة")+": "+code+" · "+(s.state==="open"?t("Voting open","التصويت مفتوح"):s.state==="closed"?t("Voting closed","التصويت مغلق"):s.state==="ended"?t("Session ended","انتهت الجلسة"):t("Waiting","انتظار"));
  if(s.state==="ended"){poll.innerHTML='<h2>'+t("Thank you for participating.","شكرًا لمشاركتك.")+'</h2>';return}
  if(!q){poll.innerHTML='<h2>'+t("Waiting for the presenter...","بانتظار مقدم العرض...")+'</h2>';return}
  if(s.state!=="open"||voted){
   poll.innerHTML=clinicalCaseMarkup(q.prompt)+'<p class="success" role="status">'+(voted?t("Your answer was received.","تم استلام إجابتك."):t("Voting is not open.","التصويت غير مفتوح."))+'</p><div id="audience-live-results">'+(s.show_results?audienceResults(v,q)+audienceExplanation(v,q):'')+'</div>';
   styleAudience();return;
  }
  poll.innerHTML=clinicalCaseMarkup(q.prompt)+(q.kind==="choice"?(q.options||[]).map(o=>'<button class="option" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join(""):q.kind==="rating"?[1,2,3,4,5].map(n=>'<button class="option" data-answer="'+n+'">'+n+'</button>').join(""):'<textarea id="answer" maxlength="400" rows="4" placeholder="'+t("Your answer","إجابتك")+'"></textarea><button id="send">'+t("Submit","إرسال")+'</button>')+'<div id="audience-live-results">'+(s.show_results?audienceResults(v,q)+audienceExplanation(v,q):'')+'</div>';
  const submit=async(answer)=>{
   if(audienceSubmitting)return;
   if(!String(answer||"").trim()){notice(t("Enter an answer first.","أدخل إجابة أولاً."),true);return}
   audienceSubmitting=true;
   const buttons=[...poll.querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);
   notice(t("Submitting your answer...","جارٍ إرسال إجابتك..."));
   let confirmed=false;
   try{
    const result=await api("vote",{code,participant_token:participant,answer});
    if(!result.accepted)throw Error(t("Vote not confirmed.","لم يتم تأكيد التصويت."));
    confirmed=true;sessionStorage.setItem(voteKey,"1");
    audienceSnapshotKey="";
    // Update immediately rather than waiting for the next polling interval.
    poll.innerHTML=clinicalCaseMarkup(q.prompt)+'<p class="success" role="status">'+t("Your answer was received.","تم استلام إجابتك.")+'</p><div id="audience-live-results"></div>';
    notice(t("Answer received.","تم استلام الإجابة."));
   }catch(e){
    notice(e.message,true);buttons.forEach(b=>b.disabled=false);
   }finally{audienceSubmitting=false;if(confirmed)audiencePage(true)}
  };
  poll.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>submit(b.dataset.answer));
  if($("send"))$("send").onclick=()=>submit($("answer").value);
  styleAudience();
 }catch(e){
  if(!$("audience-root"))layout('<div id="audience-root" class="panel"><p id="notice" role="alert" class="error"></p><button id="audience-retry">'+t("Retry","إعادة المحاولة")+'</button></div>');
  notice(t("Connection interrupted. Retrying automatically: ","انقطع الاتصال. جارٍ إعادة المحاولة تلقائيًا: ")+e.message,true);
  if($("audience-retry"))$("audience-retry").onclick=()=>audiencePage(true);
 }finally{audienceBusy=false}
}
function render(){stop();lastRevision=-1;audienceSnapshotKey="";if(params.get("session")){document.body.classList.add("live-presenter-page");presenterPage();refresh=setInterval(presenterPage,2000)}else if(params.get("code")){document.body.classList.remove("live-presenter-page");audiencePage();refresh=setInterval(audiencePage,2000)}else if(params.get("admin")){document.body.classList.remove("live-presenter-page");if(params.get("presentation"))manage(params.get("presentation"));else dashboard()}else{document.body.classList.remove("live-presenter-page");home()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(params.get("session"))presenterPage();else if(params.get("code"))audiencePage(true)}});
window.addEventListener("focus",()=>{if(params.get("session"))presenterPage();else if(params.get("code"))audiencePage(true)});
render();
})();
</script><script src="/assets/js/unified-navigation.js?v=20261101-7" defer></script></body></html>
