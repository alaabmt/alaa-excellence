function clinicalCaseMarkup(prompt){
 const raw=String(prompt||"").replace(/\r\n?/g,"\n").trim();
 const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const questionStart=lines.findIndex(x=>/^(Which\b|What\b|Identify\b|Select\b|Choose\b)/i.test(x));
 const body=questionStart>=0?lines.slice(0,questionStart):lines;
 const challenge=questionStart>=0?lines.slice(questionStart).join(" "):"";
 const sections=[];let current={heading:"",text:[]};
 const heading=/^((?:Admission|Operative|Discharge|Dietitian|Nursing|Emergency department|ED|Consultation|Progress|Day\s*\d+(?:\s*(?:and|&|[-–])\s*\d+)?(?:\s+progress)?|Postoperative day\s*\d+|Hospital day\s*\d+)[^:]{0,48}(?:note|summary|assessment|report)?):\s*/i;
 for(const line of body){
  const match=line.match(heading);
  if(match){if(current.text.length)sections.push(current);current={heading:match[1],text:[line.slice(match[0].length)]}}
  else current.text.push(line);
 }
 if(current.text.length)sections.push(current);
 return '<div class="clinical-case">'+sections.map((part,i)=>'<section class="clinical-section '+(i===0&&!part.heading?'clinical-intro':'')+'">'+(part.heading?'<h3 class="clinical-heading">'+esc(part.heading)+'</h3>':i===0?'<h3 class="clinical-heading">'+t("Patient presentation","عرض الحالة")+'</h3>':'')+'<div class="clinical-copy">'+part.text.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div></section>').join("")+(challenge?'<div class="clinical-challenge"><strong>'+esc(challenge)+'</strong></div>':'')+'</div>';
}

 return '<div class="'+classes+'"><div class="stage-result-label"><span class="result-choice-name"><span class="result-choice-letter">'+esc(letter)+'</span><span class="result-choice-text">'+esc(choiceText)+'</span></span><strong class="result-choice-count"><span class="result-percent">'+pct+'%</span><span class="result-votes">'+votes+' '+t("votes","أصوات")+'</span></strong></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'+(isCorrect?'<span class="result-correct-indicator" aria-label="'+t("Correct answer","الإجابة الصحيحة")+'">✓</span>':'')+'</div>';

   layout('<div class="presenter results-focus" id="presenter-root"><div class="stage-topline"><div><p class="muted">'+t("LIVE PRESENTATION","عرض مباشر")+'</p><h1 class="stage-title">'+t("Audience poll","استطلاع الجمهور")+'</h1></div><div class="stage-display-tools"><nav class="stage-quick-nav"><button id="stage-prev" class="secondary" type="button" aria-label="Previous question">‹</button><select id="stage-jump" aria-label="Choose question"></select><button id="stage-next" class="secondary" type="button" aria-label="Next question">›</button></nav><button id="stage-widescreen" class="secondary" aria-pressed="false">'+t("Widescreen view","عرض الشاشة العريضة")+'</button><span id="status" class="stage-pill"></span></div></div><div class="widescreen-join" aria-label="'+t("Scan to join this live session","امسح الرمز للانضمام إلى الجلسة")+'"><div class="widescreen-join-text"><strong>'+t("JOIN LIVE","انضم الآن")+'</strong><span>'+t("Scan to vote","امسح الرمز للتصويت")+'</span><a id="widescreen-join-link" target="_blank" rel="noopener"><span id="widescreen-join-code">'+esc(s.code)+'</span></a></div><div id="widescreen-join-qr"></div><button id="widescreen-answer-reveal" class="widescreen-answer-button" type="button">'+t("Reveal correct answer","إظهار الإجابة الصحيحة")+'</button></div><div class="presenter-stage"><div class="stage-main"><div class="panel"><div class="results-focus-toolbar"><button id="results-focus-toggle" class="secondary" type="button" aria-pressed="true">'+t("Show clinical case","عرض الحالة السريرية")+'</button></div><div id="question-view"></div><div id="results"></div><p id="live-update-status" class="muted" role="status" aria-live="polite"></p></div></div><aside class="stage-side"><div class="panel"><p class="muted">'+t("JOIN THIS SESSION","الانضمام إلى الجلسة")+'</p><div id="qr"></div><p class="code">'+esc(s.code)+'</p><a id="audience-link" target="_blank" rel="noopener"></a><p><button class="secondary" id="share-presenter">'+t("Copy presenter link","نسخ رابط المقدم")+'</button></p><small class="stage-help">'+t("Public controls enabled: anyone can manage this session.","التحكم العام مفعل: يمكن لأي شخص إدارة هذه الجلسة.")+'</small></div><div class="panel stage-controls"><h2>'+t("Presenter controls","التحكم بالعرض")+'</h2><label for="question">'+t("Choose question","اختر السؤال")+'</label><select id="question"></select><div class="stage-navigation"><button id="previous" class="secondary">'+t("Previous question","السؤال السابق")+'</button><button id="next">'+t("Next question","السؤال التالي")+'</button></div><div class="actions"><button id="open">'+t("Open voting","فتح التصويت")+'</button><button id="close" class="secondary">'+t("Close voting","إغلاق التصويت")+'</button><button id="answer-reveal" class="secondary">'+t("Reveal correct answer","إظهار الإجابة الصحيحة")+'</button><button id="reactivate" class="qm-reactivate" hidden>'+t("Reactivate session","إعادة تفعيل الجلسة")+'</button><button id="end" class="danger">'+t("End session","إنهاء الجلسة")+'</button></div><p id="notice" role="status"></p></div></aside></div></div>');
   $("results-focus-toggle").onclick=()=>{const root=$("presenter-root"),btn=$("results-focus-toggle");const on=root.classList.toggle("results-focus");btn.setAttribute("aria-pressed",String(on));btn.textContent=on?t("Show clinical case","عرض الحالة السريرية"):t("Focus on results","التركيز على النتائج");};
   $("stage-widescreen").onclick=()=>{const root=$("presenter-root"),btn=$("stage-widescreen");const on=root.classList.toggle("widescreen");btn.setAttribute("aria-pressed",String(on));btn.textContent=on?t("Exit widescreen","إنهاء العرض العريض"):t("Widescreen view","عرض الشاشة العريضة");};
   let controlPending=false;
   const runSessionControl=async(nextState,resultsAction)=>{
    if(controlPending)return;
    const snapshot=active?.session;if(!snapshot)return;
    controlPending=true;
    const ids=["open","close","reveal","hide","end","previous","next","stage-prev","stage-next"];ids.forEach(id=>{if($(id))$(id).disabled=true});
    const el=$("notice");if(el){el.textContent=t("Updating session…","جارٍ تحديث الجلسة…");el.className="muted"}
    try{
     const res=await api("control",{session_id:snapshot.id,presenter_token:presenter,key:admin,state:nextState,question_id:snapshot.active_question_id,results_action:resultsAction});
     if(!res?.session||res.session.state!==nextState)throw Error("Session update not confirmed");
     active=res;lastRevision=res.session.revision;
     if(el){el.textContent=nextState==="ended"?t("Session ended successfully.","تم إنهاء الجلسة بنجاح."):nextState==="open"?t("Voting is open.","التصويت مفتوح."):nextState==="closed"?t("Voting is closed.","التصويت مغلق."):t("Results updated.","تم تحديث النتائج.");el.className="success"}
    }catch(e){if(el){el.textContent=t("Could not update session: ","تعذر تحديث الجلسة: ")+e.message;el.className="error"}}
    finally{controlPending=false;if(!busy)await presenterPage();else setTimeout(()=>presenterPage(),250)}
   };
   $("open").onclick=()=>runSessionControl("open");
   $("close").onclick=()=>runSessionControl("closed");
   $("answer-reveal").onclick=toggleCorrectAnswer;
   $("widescreen-answer-reveal").onclick=toggleCorrectAnswer;
   $("reactivate").onclick=async()=>{
    if(!confirm(t("Reactivate this ended session? Voting will reopen with the same join code and existing responses will be preserved.","إعادة تفعيل هذه الجلسة المنتهية؟ سيُفتح التصويت بنفس رمز الانضمام مع الاحتفاظ بالإجابات السابقة.")))return;
    const button=$("reactivate");button.disabled=true;notice(t("Reactivating session…","جارٍ إعادة تفعيل الجلسة…"));
    try{
     const res=await api("reactivate_session",{session_id:active.session.id,presenter_token:presenter,key:admin});
     if(res.session?.state!=="open")throw Error(t("Reactivation not confirmed","لم يتم تأكيد إعادة التفعيل"));
     active=res;lastRevision=res.session.revision;
     notice(t("Session reactivated. Voting is open; previous responses are preserved.","تمت إعادة تفعيل الجلسة وفتح التصويت مع الاحتفاظ بالإجابات السابقة."));
     await presenterPage();
    }catch(e){notice(e.message,true);button.disabled=false}
   };
   $("end").onclick=()=>{if(confirm(t("End this session? This stops voting for everyone.","إنهاء هذه الجلسة؟ سيتوقف التصويت للجميع.")))runSessionControl("ended")};
   $("previous").onclick=()=>changeLiveQuestion(null,-1);
   $("next").onclick=()=>changeLiveQuestion(null,1);
   $("stage-prev").onclick=()=>changeLiveQuestion(null,-1);
   $("stage-next").onclick=()=>changeLiveQuestion(null,1);
  }
  async function toggleCorrectAnswer(){const s=active?.session;if(!s?.active_question_id)return;const buttons=[$("answer-reveal"),$("widescreen-answer-reveal")].filter(Boolean);buttons.forEach(b=>b.disabled=true);try{const res=await api("control",{session_id:s.id,presenter_token:presenter,key:admin,question_id:s.active_question_id,state:s.state,results_action:s.reveal_correct_answer?"hide":"show",answer_action:s.reveal_correct_answer?"hide":"show"});active=res;lastRevision=res.session?.revision||lastRevision;if(!busy)await presenterPage();else setTimeout(()=>presenterPage(),250)}catch(e){notice(e.message,true)}finally{buttons.forEach(b=>b.disabled=false)}}
  async function changeLiveQuestion(requestedId,delta=0){
   if(window.liveQuestionSwitchPending)return;
   const snapshot=active;if(!snapshot?.questions?.length||snapshot.session.state==="ended")return;
   const index=snapshot.questions.findIndex(q=>q.id===snapshot.session.active_question_id);
   const target=requestedId?snapshot.questions.find(q=>q.id===requestedId):snapshot.questions[index+delta];
   if(!target||target.id===snapshot.session.active_question_id)return;
   window.liveQuestionSwitchPending=true;
   const selector=$("question"),previous=$("previous"),next=$("next");
   for(const el of [selector,previous,next,$("stage-jump"),$("stage-prev"),$("stage-next")])if(el)el.disabled=true;
   try{
    const response=await api("control",{session_id:snapshot.session.id,presenter_token:presenter,key:admin,question_id:target.id,state:snapshot.session.state});
    if(response.session.active_question_id!==target.id)throw Error(t("Question did not change. Please retry.","لم يتغير السؤال، يرجى إعادة المحاولة."));
    active=response;
    if(selector)selector.value=target.id;if($("stage-jump"))$("stage-jump").value=target.id;
    await presenterPage();
   }catch(e){notice(e.message,true);if(selector)selector.value=active?.session?.active_question_id||"";if($("stage-jump"))$("stage-jump").value=active?.session?.active_question_id||""}
   finally{window.liveQuestionSwitchPending=false;const current=active?.session;const idx=active?.questions?.findIndex(q=>q.id===current?.active_question_id)??-1;if(selector)selector.disabled=current?.state==="ended";if(previous)previous.disabled=idx<=0||current?.state==="ended";if(next)next.disabled=idx<0||idx>=((active?.questions?.length||0)-1)||current?.state==="ended";if($("stage-prev"))$("stage-prev").disabled=idx<=0||current?.state==="ended";if($("stage-next"))$("stage-next").disabled=idx<0||idx>=((active?.questions?.length||0)-1)||current?.state==="ended";if($("stage-jump"))$("stage-jump").disabled=current?.state==="ended";}
  }
  const select=$("question");
  if(select){
   const old=previouslyChosen||select.value;
   select.innerHTML=v.questions.map(q=>'<option value="'+esc(q.id)+'">'+esc(q.position+1)+'. '+esc(q.prompt.slice(0,95))+'</option>').join("");
   select.value=selected?.id||v.questions[0]?.id||"";
   select.disabled=!v.questions.length||s.state==="ended";
   select.onchange=()=>changeLiveQuestion(select.value);

  }
  const jump=$("stage-jump");if(jump){jump.innerHTML=v.questions.map(q=>`<option value="${esc(q.id)}">${t("Q","س")}${q.position+1}</option>`).join("");jump.value=s.active_question_id||"";jump.disabled=!v.questions.length||s.state==="ended";jump.onchange=()=>changeLiveQuestion(jump.value)}
  const status=$("status");if(status){status.textContent=s.state==="open"?t("Voting open","التصويت مفتوح"):s.state==="closed"?t("Voting closed","التصويت مغلق"):s.state==="ended"?t("Session ended","انتهت الجلسة"):t("Waiting","انتظار");status.className="stage-pill "+(s.state==="open"?"open":s.state==="ended"?"ended":"")}
  const currentIndex=v.questions.findIndex(q=>q.id===s.active_question_id);if($("stage-prev"))$("stage-prev").disabled=currentIndex<=0||s.state==="ended";if($("stage-next"))$("stage-next").disabled=currentIndex<0||currentIndex>=v.questions.length-1||s.state==="ended";if($("previous"))$("previous").disabled=currentIndex<=0||s.state==="ended";if($("next"))$("next").disabled=currentIndex<0||currentIndex>=v.questions.length-1||s.state==="ended";const open=$("open");if(open)open.disabled=!v.questions.length||s.state==="ended"||s.state==="open";
  if($("close"))$("close").disabled=!v.questions.length||s.state!=="open";
  if($("end"))$("end").disabled=s.state==="ended";
  if($("reactivate")){const canReactivate=s.state==="ended";$("reactivate").hidden=!canReactivate;$("reactivate").disabled=!canReactivate}
  if($("qr")&&window.QRCode&&(!$("qr").querySelector("img")||!$("widescreen-join-qr")?.querySelector("img")))qr(s.code);
  const questionView=$("question-view");
  if(questionView)questionView.innerHTML=selected?'<p class="muted clinical-counter">'+t("QUESTION","السؤال")+' '+esc(selected.position+1)+' / '+v.questions.length+'</p>'+clinicalCaseMarkup(selected.prompt):'<div class="stage-empty"><h2>'+t("No active question","لا يوجد سؤال نشط")+'</h2><p>'+t("Add questions in your dashboard, then create a new session.","أضف الأسئلة في لوحة التحكم ثم أنشئ جلسة جديدة.")+'</p></div>';
  const updateStatus=$("live-update-status");if(updateStatus)updateStatus.textContent=t("Live results · ","النتائج المباشرة · ")+esc(s.code)+" · "+(v.count||0)+" "+t("responses · ","إجابة · ")+new Date().toLocaleTimeString();
  for(const answerButton of [$("answer-reveal"),$("widescreen-answer-reveal")]){if(answerButton){answerButton.textContent=s.reveal_correct_answer?t("Hide correct answer","إخفاء الإجابة الصحيحة"):t("Reveal correct answer","إظهار الإجابة الصحيحة");answerButton.disabled=!selected?.correct_answer||s.state==="ended";answerButton.setAttribute("aria-pressed",String(!!s.reveal_correct_answer))}}
  const results=$("results");
  if(results){
   const total=v.count||0;
   if(!selected)results.innerHTML="";
   
   else{
    const counts=new Map((v.aggregate||[]).map(x=>[String(x.answer),Number(x.votes)||0]));
    const labels=selected.kind==="choice"?(selected.options||[]):selected.kind==="rating"?["1","2","3","4","5"]:[...counts.keys()];
    results.innerHTML='<div class="stage-count"><strong>'+total+'</strong><span>'+t("responses","إجابة")+'</span></div>'+labels.map((label,i)=>{const n=counts.get(String(label))||0,pct=total?Math.round(n*100/total):0;return resultChoiceMarkup(label,i,n,total,s.reveal_correct_answer,selected.correct_answer)}).join("");
   }
   if(selected&&s.reveal_correct_answer&&selected.correct_answer){
    results.innerHTML+='<section class="answer-explanation"><h3>'+t("Correct answer","الإجابة الصحيحة")+': '+esc(selected.correct_answer)+'</h3>'+(selected.answer_justification?'<p><strong>'+t("Justification","التبرير")+':</strong> '+esc(selected.answer_justification)+'</p>':'')+(selected.answer_effect?'<p><strong>'+t("Effect","الأثر")+':</strong> '+esc(selected.answer_effect)+'</p>':'')+'</section>';
   }
  }
 }catch(e){const updateStatus=$("live-update-status");if(updateStatus)updateStatus.textContent=t("Live update interrupted. Retrying automatically: ","توقف التحديث المباشر. إعادة المحاولة تلقائيًا: ")+e.message;if(!$("presenter-root"))layout('<div class="panel"><h2>'+t("Presenter access failed","تعذر دخول المقدم")+'</h2><p class="error">'+esc(e.message)+'</p></div>')}
 finally{busy=false}
}

let audienceBusy=false,audienceSubmitting=false,audienceSnapshotKey="",audienceLastResponse=null;
function audienceResults(v,q){
 const counts=new Map((v.aggregate||[]).map(x=>[String(x.answer),Number(x.votes)||0]));
 const labels=q.kind==="choice"?(q.options||[]):q.kind==="rating"?["1","2","3","4","5"]:[...counts.keys()];
 const total=v.count||0;
 return '<section class="audience-results" aria-label="'+t("Live results","النتائج المباشرة")+'"><h3>'+t("Results","النتائج")+' · '+total+' '+t("responses","إجابة")+'</h3>'+labels.map((label,i)=>{const n=counts.get(String(label))||0;return resultChoiceMarkup(label,i,n,total,v.session.reveal_correct_answer,q.correct_answer)}).join("")+'</section>';
}
function audienceExplanation(v,q){
 if(!v.session.reveal_correct_answer||!q.correct_answer)return "";
 return '<section class="answer-explanation"><h3>'+t("Correct answer","الإجابة الصحيحة")+': '+esc(q.correct_answer)+'</h3>'+(q.answer_justification?'<p><strong>'+t("Justification","التبرير")+':</strong> '+esc(q.answer_justification)+'</p>':'')+(q.answer_effect?'<p><strong>'+t("Effect","الأثر")+':</strong> '+esc(q.answer_effect)+'</p>':'')+'</section>';
}
function styleAudience(){
 const root=$("audience-root");if(root)root.classList.add("audience-wrap");
 const poll=$("poll");if(poll)poll.querySelectorAll(".option").forEach((b,i)=>{if(!b.querySelector(".letter")){const label=b.textContent;b.textContent="";const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);const text=document.createElement("span");text.textContent=label;b.append(letter,text)}});
}
async function audiencePage(force=false){
 if(audienceBusy||audienceSubmitting)return;
 audienceBusy=true;
 const code=params.get("code");
 const track=(event_type,question_id)=>{if(participant&&question_id)api("track_interaction",{code,participant_token:participant,question_id,event_type}).catch(()=>{})};
 try{
  if(!participant){const joined=await api("join",{code});participant=joined.participant_token;sessionStorage.setItem("live-participant-"+code,participant)}
  const v=await api("view",{code,participant_token:participant});audienceLastResponse=v;
  const s=v.session,q=v.questions[0],voteKey="live-voted-"+s.id+"-"+(q?.id||"");
  const voted=!!v.voted||!!sessionStorage.getItem(voteKey);
  const reveal=!!s.reveal_correct_answer;
  // A vote changes the session revision; do not rebuild the active voting form for that.
  const key=[s.id,q?.id||"",s.state,voted,reveal].join("|");
  const changed=key!==audienceSnapshotKey||!$("audience-root");
  if(!changed&&!force){
   /* Audience never receives live totals; only the presenter displays them. */
   return;
  }
  audienceSnapshotKey=key;
  if(q&&s.state==="open"&&!voted&&!sessionStorage.getItem("live-seen-"+s.id+"-"+q.id)){sessionStorage.setItem("live-seen-"+s.id+"-"+q.id,"1");track("question_view",q.id)}
  if(!$("audience-root"))layout('<div id="audience-root"><h1>'+t("Live conference","المؤتمر المباشر")+'</h1><div class="panel"><p id="audience-state" class="muted"></p><div id="poll"></div><p id="notice" role="status" aria-live="polite"></p></div></div>');
  const poll=$("poll"),state=$("audience-state");if(!poll)return;
  if(state)state.textContent=t("Session","الجلسة")+": "+code+" · "+(s.state==="open"?t("Voting open","التصويت مفتوح"):s.state==="closed"?t("Voting closed","التصويت مغلق"):s.state==="ended"?t("Session ended","انتهت الجلسة"):t("Waiting","انتظار"));
  if(s.state==="ended"){poll.innerHTML='<h2>'+t("Thank you for participating.","شكرًا لمشاركتك.")+'</h2>';return}
  if(!q){poll.innerHTML='<h2>'+t("Waiting for the presenter...","بانتظار مقدم العرض...")+'</h2>';return}
  if(s.state!=="open"||voted||reveal){
   poll.innerHTML=clinicalCaseMarkup(q.prompt)+'<p class="success" role="status">'+(voted?t("Your answer was received.","تم استلام إجابتك."):t("Voting is not open.","التصويت غير مفتوح."))+'</p>';
   styleAudience();return;
  }
  poll.innerHTML=clinicalCaseMarkup(q.prompt)+(q.kind==="choice"?(q.options||[]).map(o=>'<button class="option" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join(""):q.kind==="rating"?[1,2,3,4,5].map(n=>'<button class="option" data-answer="'+n+'">'+n+'</button>').join(""):'<textarea id="answer" maxlength="400" rows="4" placeholder="'+t("Your answer","إجابتك")+'"></textarea><button id="send">'+t("Submit","إرسال")+'</button>')+'<div id="audience-live-results"></div>';
  const submit=async(answer)=>{
   if(audienceSubmitting)return;
   if(!String(answer||"").trim()){notice(t("Enter an answer first.","أدخل إجابة أولاً."),true);return}
   audienceSubmitting=true;
   const buttons=[...poll.querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);
   notice(t("Submitting your answer...","جارٍ إرسال إجابتك..."));
   let confirmed=false;
   try{
    const result=await api("vote",{code,participant_token:participant,answer});
    if(!result.accepted)throw Error(t("Vote not confirmed.","لم يتم تأكيد التصويت."));
    confirmed=true;sessionStorage.setItem(voteKey,"1");
    audienceSnapshotKey="";
    // Update immediately rather than waiting for the next polling interval.
    poll.innerHTML=clinicalCaseMarkup(q.prompt)+'<p class="success" role="status">'+t("Your answer was received.","تم استلام إجابتك.")+'</p><div id="audience-live-results"></div>';
    notice(t("Answer received.","تم استلام الإجابة."));
   }catch(e){
    notice(e.message,true);buttons.forEach(b=>b.disabled=false);
   }finally{audienceSubmitting=false;if(confirmed)audiencePage(true)}
  };
  poll.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{track("answer_click",q.id);submit(b.dataset.answer)});
  if($("send"))$("send").onclick=()=>{track("answer_click",q.id);submit($("answer").value)};
  styleAudience();
 }catch(e){
  if(!$("audience-root"))layout('<div id="audience-root" class="panel"><p id="notice" role="alert" class="error"></p><button id="audience-retry">'+t("Retry","إعادة المحاولة")+'</button></div>');
  notice(t("Connection interrupted. Retrying automatically: ","انقطع الاتصال. جارٍ إعادة المحاولة تلقائيًا: ")+e.message,true);
  if($("audience-retry"))$("audience-retry").onclick=()=>audiencePage(true);
 }finally{audienceBusy=false}
}
function render(){stop();lastRevision=-1;audienceSnapshotKey="";if(params.get("session")){document.body.classList.add("live-presenter-page");presenterPage();refresh=setInterval(presenterPage,1500)}else if(params.get("code")){document.body.classList.remove("live-presenter-page");audiencePage();refresh=setInterval(audiencePage,2000)}else if(params.get("admin")){document.body.classList.remove("live-presenter-page");if(params.get("presentation"))manage(params.get("presentation"));else dashboard()}else if(params.get("presenter_mode")){document.body.classList.remove("live-presenter-page");publicSessions()}else{document.body.classList.remove("live-presenter-page");home()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(params.get("session"))presenterPage();else if(params.get("code"))audiencePage(true)}});
window.addEventListener("focus",()=>{if(params.get("session"))presenterPage();else if(params.get("code"))audiencePage(true)});
render();
})();
</script><script src="/assets/js/unified-navigation.js?v=20261101-7" defer></script></body></html>
