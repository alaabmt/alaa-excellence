<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Live | Personal Conference Polling</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#14263d;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102d4d;color:white;padding:17px max(20px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}main{max-width:1050px;margin:28px auto;padding:0 18px}h1{font-size:clamp(1.7rem,4vw,2.7rem);margin:0 0 12px}h2{font-size:1.3rem}p{line-height:1.65}.muted{color:#53657b}.panel{background:white;border:1px solid #dce5ed;border-radius:17px;padding:22px;margin-bottom:20px;box-shadow:0 6px 22px #102d4d0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.stack{display:grid;gap:12px}input,select,textarea,button{font:inherit;border-radius:10px;padding:12px;max-width:100%}input,select,textarea{width:100%;border:1px solid #b8c8d6;background:white}button{border:0;background:#1767b2;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.secondary{background:#e8eef6;color:#143657}button.danger{background:#9a2434}button:focus-visible,input:focus-visible{outline:3px solid #e6ad3e;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:9px}.option{display:block;width:100%;margin:8px 0;text-align:start;background:#eaf2fb;color:#17395e}.option:hover{background:#cbdff6}.result{margin:8px 0}.bar{height:14px;background:#dbe8f4;border-radius:10px;overflow:hidden}.fill{height:100%;background:#1673c4}.big{font-size:clamp(1.6rem,4vw,3.3rem)}.code{font-size:2rem;letter-spacing:3px;font-weight:800}.success{color:#087443}.error{color:#ae1d31}#qr{background:white;padding:10px;width:max-content;max-width:100%}a{color:#1263ab;overflow-wrap:anywhere}small{line-height:1.5}footer{text-align:center;color:#607187;padding:20px}html[dir=rtl] .option{text-align:right}@media(min-width:900px){.presenter h2{font-size:2.2rem}.presenter .panel{padding:30px}}@media(max-width:420px){header{padding:14px}main{padding:0 12px}.panel{padding:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><strong>LIVE · Personal Conference Tool</strong><button id="language" class="secondary">العربية</button></header><main><div id="app" aria-live="polite"></div></main><footer>Personal conference polling · Tamayuz 10X</footer><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script><script>
(()=>{"use strict";
const ENDPOINT="https://dqrsjhcfmpjhcxvtxosy.supabase.co/functions/v1/tamayuz-live";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1));
let lang=localStorage.getItem("live-lang")==="ar"?"ar":"en",admin=fragment.get("admin")||sessionStorage.getItem("live-admin")||"",presenter=fragment.get("presenter")||sessionStorage.getItem("live-presenter")||"",participant=sessionStorage.getItem("live-participant")||"",active=null,lastRevision=-1,refresh=null,busy=false;
if(fragment.get("admin"))sessionStorage.setItem("live-admin",admin);
if(fragment.get("presenter"))sessionStorage.setItem("live-presenter",presenter);
if(location.hash)history.replaceState(null,"",location.pathname+location.search);
const t=(en,ar)=>lang==="ar"?ar:en;
function layout(markup){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("language").textContent=lang==="ar"?"English":"العربية";$("app").innerHTML=markup}
function notice(s,err=false){const e=$("notice");if(e){e.textContent=s;e.className=err?"error":"success"}}
async function api(action,data={}){const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,...data}),signal:ctrl.signal});const v=await r.json();if(!r.ok)throw Error(v.error||"Request failed");return v}finally{clearTimeout(timeout)}}
const field=(label,id,placeholder="")=>'<label class="stack">'+label+'<input id="'+id+'" placeholder="'+esc(placeholder)+'" required></label>';
function stop(){if(refresh)clearInterval(refresh);refresh=null}
function language(){lang=lang==="ar"?"en":"ar";localStorage.setItem("live-lang",lang);render()}
$("language").onclick=language;
function home(){layout('<h1>'+t("Live audience interaction","التفاعل المباشر مع الجمهور")+'</h1><p class="muted">'+t("Join a conference with a code or open your private control link.","انضم إلى المؤتمر باستخدام الرمز أو افتح رابط التحكم الخاص بك.")+'</p><div class="panel stack"><h2>'+t("Join a session","الانضمام إلى جلسة")+'</h2>'+field(t("Session code","رمز الجلسة"),"code","A1B2C3")+'<button id="join">'+t("Join","انضمام")+'</button></div>'+(admin?'<div class="panel"><button id="admin">'+t("Open my dashboard","لوحة التحكم")+'</button></div>':"")+'<p id="notice"></p>');$("join").onclick=()=>{const c=$("code").value.trim().toUpperCase();if(c)location.href="?code="+encodeURIComponent(c)};if(admin)$("admin").onclick=()=>{params.set("admin","1");history.replaceState(null,"","?admin=1");render()}}
async function dashboard(){layout('<h1>'+t("My presentations","عروضي التقديمية")+'</h1><div class="panel stack"><h2>'+t("Create presentation","إنشاء عرض")+'</h2>'+field(t("Conference title","عنوان المؤتمر"),"title")+ '<select id="locale"><option value="en">English</option><option value="ar">العربية</option></select><button id="create">'+t("Create","إنشاء")+'</button></div><div class="panel"><h2>'+t("Saved presentations","العروض المحفوظة")+'</h2><div id="presentations">'+t("Loading...","جارٍ التحميل...")+'</div></div><p id="notice"></p>');$("create").onclick=async()=>{try{const v=await api("create",{key:admin,title:$("title").value,locale:$("locale").value});sessionStorage.setItem("live-selected",v.presentation.id);await dashboard()}catch(e){notice(e.message,true)}};try{const v=await api("list",{key:admin});$("presentations").innerHTML=v.presentations.length?v.presentations.map(p=>'<div class="panel"><strong>'+esc(p.title)+'</strong><p class="muted">'+esc(p.locale)+'</p><button data-id="'+esc(p.id)+'">'+t("Manage questions and sessions","إدارة الأسئلة والجلسات")+'</button></div>').join(""):t("No presentations yet.","لا توجد عروض بعد.");$("presentations").querySelectorAll("button").forEach(b=>b.onclick=()=>{sessionStorage.setItem("live-selected",b.dataset.id);manage(b.dataset.id)})}catch(e){notice(e.message,true)}}
async function manage(pid){layout('<button class="secondary" id="back">'+t("Back","عودة")+'</button><h1>'+t("Manage presentation","إدارة العرض")+'</h1><div class="panel stack"><h2>'+t("Add a question","إضافة سؤال")+'</h2>'+field(t("Question","السؤال"),"prompt")+'<select id="kind"><option value="choice">'+t("Multiple choice","اختيارات")+'</option><option value="rating">'+t("Rating 1–5","تقييم ١–٥")+'</option><option value="text">'+t("Open text","إجابة مفتوحة")+'</option></select><label>'+t("Options (one per line, for choice questions)","الخيارات (كل خيار في سطر)")+'<textarea id="options" rows="5"></textarea></label><button id="add">'+t("Add question","إضافة السؤال")+'</button></div><div class="panel"><button id="start">'+t("Create live session","إنشاء جلسة مباشرة")+'</button></div><p id="notice"></p>');$("back").onclick=dashboard;$("add").onclick=async()=>{try{await api("add_question",{key:admin,presentation_id:pid,prompt:$("prompt").value,kind:$("kind").value,options:$("options").value.split("\n").map(x=>x.trim()).filter(Boolean)});notice(t("Question saved.","تم حفظ السؤال."));$("prompt").value="";$("options").value=""}catch(e){notice(e.message,true)}};$("start").onclick=async()=>{try{const v=await api("new_session",{key:admin,presentation_id:pid});sessionStorage.setItem("live-presenter",v.presenter_token);location.href="?session="+encodeURIComponent(v.session.id)+"#presenter="+encodeURIComponent(v.presenter_token)}catch(e){notice(e.message,true)}}}
function qr(code){const el=$("qr");if(!el)return;const link=location.origin+"/live/?code="+encodeURIComponent(code);$("audience-link").href=link;$("audience-link").textContent=link;if(window.QRCode){el.innerHTML="";new QRCode(el,{text:link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}else{el.textContent=t("QR unavailable; share the link.","تعذر عرض QR؛ شارك الرابط.")}}
async function presenterPage(){if(busy)return;busy=true;try{const v=await api("present",{session_id:params.get("session"),presenter_token:presenter,key:admin});const s=v.session;active=v;const selected=v.questions.find(q=>q.id===s.active_question_id);const first=lastRevision<0;lastRevision=s.revision;if(first||!$("presenter-root")){layout('<div class="presenter" id="presenter-root"><h1>'+t("Presenter screen","شاشة العرض")+'</h1><div class="grid"><div class="panel"><div id="qr"></div><p class="code">'+esc(s.code)+'</p><a id="audience-link" target="_blank" rel="noopener"></a></div><div class="panel"><h2>'+t("Session controls","التحكم بالجلسة")+'</h2><select id="question">'+v.questions.map(q=>'<option value="'+esc(q.id)+'">'+esc(q.position+1)+'. '+esc(q.prompt)+'</option>').join("")+'</select><div class="actions"><button id="open">'+t("Open voting","فتح التصويت")+'</button><button id="close" class="secondary">'+t("Close voting","إغلاق التصويت")+'</button><button id="reveal" class="secondary">'+t("Reveal results","إظهار النتائج")+'</button><button id="hide" class="secondary">'+t("Hide results","إخفاء النتائج")+'</button><button id="end" class="danger">'+t("End session","إنهاء الجلسة")+'</button></div><p id="notice"></p></div></div><div class="panel"><div id="question-view"></div><div id="results"></div></div></div>');qr(s.code);const control=async(state,show)=>{try{await api("control",{session_id:s.id,presenter_token:presenter,key:admin,question_id:$("question").value,state,show_results:show});await presenterPage()}catch(e){notice(e.message,true)}};$("open").onclick=()=>control("open",false);$("close").onclick=()=>control("closed",s.show_results);$("reveal").onclick=()=>control(s.state,true);$("hide").onclick=()=>control(s.state,false);$("end").onclick=()=>{if(confirm(t("End this session?","إنهاء الجلسة؟")))control("ended",true)}}
if($("question"))$("question").value=selected?.id||v.questions[0]?.id||"";if($("question-view"))$("question-view").innerHTML='<p class="muted">'+esc(s.state.toUpperCase())+'</p><h2 class="big">'+esc(selected?.prompt||t("Choose a question","اختر سؤالاً"))+'</h2>';if($("results")){const total=v.count||0;$("results").innerHTML=s.show_results?'<h2>'+t("Responses","الإجابات")+': '+total+'</h2>'+v.aggregate.map(x=>'<div class="result"><strong>'+esc(x.answer)+' · '+x.votes+'</strong><div class="bar"><div class="fill" style="width:'+Math.round(x.votes/Math.max(total,1)*100)+'%"></div></div></div>').join(""):'<p class="muted">'+t("Results hidden until revealed","النتائج مخفية حتى إظهارها")+'</p>'}
}catch(e){if(!$("presenter-root"))layout('<div class="panel"><h2>'+t("Presenter access failed","تعذر دخول المقدم")+'</h2><p class="error">'+esc(e.message)+'</p></div>')}finally{busy=false}}
async function audiencePage(){if(busy)return;busy=true;const code=params.get("code");try{if(!participant){const v=await api("join",{code});participant=v.participant_token;sessionStorage.setItem("live-participant",participant)}const v=await api("view",{code});const s=v.session,q=v.questions[0];const voteKey="live-voted-"+s.id+"-"+(q?.id||"");const voted=sessionStorage.getItem(voteKey);if(!$("audience-root")||lastRevision!==s.revision){lastRevision=s.revision;layout('<div id="audience-root"><h1>'+t("Live conference","المؤتمر المباشر")+'</h1><div class="panel"><p class="muted">'+t("Session","الجلسة")+': '+esc(code)+' · '+esc(s.state)+'</p><div id="poll"></div><p id="notice"></p></div></div>')}const poll=$("poll");if(!poll)return;if(s.state==="ended"){poll.innerHTML='<h2>'+t("Thank you for participating.","شكرًا لمشاركتك.")+'</h2>';return}if(!q){poll.innerHTML='<h2>'+t("Waiting for the presenter...","بانتظار مقدم العرض...")+'</h2>';return}if(s.state!=="open"||voted){poll.innerHTML='<h2>'+esc(q.prompt)+'</h2><p>'+ (voted?t("Your answer was received.","تم استلام إجابتك."):t("Voting is not open.","التصويت غير مفتوح."))+'</p>';if(s.show_results)poll.innerHTML+='<h3>'+t("Results","النتائج")+'</h3>'+v.aggregate.map(x=>'<p>'+esc(x.answer)+': '+x.votes+'</p>').join("");return}
poll.innerHTML='<h2>'+esc(q.prompt)+'</h2>'+(q.kind==="choice"?(q.options||[]).map(o=>'<button class="option" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join(""):q.kind==="rating"?[1,2,3,4,5].map(n=>'<button class="option" data-answer="'+n+'">'+n+'</button>').join(""):'<textarea id="answer" maxlength="400" rows="4" placeholder="'+t("Your answer","إجابتك")+'"></textarea><button id="send">'+t("Submit","إرسال")+'</button>');
const submit=async(answer)=>{try{poll.querySelectorAll("button").forEach(b=>b.disabled=true);await api("vote",{code,participant_token:participant,answer});sessionStorage.setItem(voteKey,"1");notice(t("Answer received.","تم استلام الإجابة."));await audiencePage()}catch(e){notice(e.message,true);poll.querySelectorAll("button").forEach(b=>b.disabled=false)}};
poll.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>submit(b.dataset.answer));if($("send"))$("send").onclick=()=>submit($("answer").value);
}catch(e){if(!$("audience-root"))layout('<div class="panel"><p class="error">'+esc(e.message)+'</p><a href="/live/">'+t("Try again","حاول مجددًا")+'</a></div>')}finally{busy=false}}
function render(){stop();lastRevision=-1;if(params.get("session")){presenterPage();refresh=setInterval(presenterPage,2000)}else if(params.get("code")){audiencePage();refresh=setInterval(audiencePage,5000)}else if(admin&&params.get("admin"))dashboard();else home()}
render();
})();
</script></body></html>
