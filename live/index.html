e #qr img,.stage-side #qr canvas{max-width:100%;height:auto}.stage-side .code{text-align:center;font-size:1.75rem;margin:12px 0}.stage-side a{font-size:.75rem}.stage-side button{width:100%;font-size:.86rem}.stage-controls{display:grid;gap:10px}.stage-controls label{font-size:.83rem;color:var(--muted);font-weight:700}.stage-controls .actions button{flex:1 1 130px}.stage-count{display:flex;gap:8px;align-items:baseline;color:var(--muted);font-size:.95rem}.stage-count strong{font-size:2rem;color:var(--ink)}.stage-result{margin:17px 0 23px}.stage-result-label{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px;font-size:1rem;line-height:1.45}.stage-result-label span:first-child{overflow-wrap:anywhere}.stage-result-label strong{white-space:nowrap;font-variant-numeric:tabular-nums}.stage-result .bar{height:17px;border-radius:20px;background:#efedf8}.stage-result .fill{background:linear-gradient(90deg,#6954ee,#9786ff);border-radius:20px;transition:width .3s}.stage-empty{border:2px dashed var(--stroke);padding:24px;border-radius:16px;text-align:center;color:var(--muted)}.audience-wrap{max-width:680px;margin:0 auto}.audience-wrap .panel{padding:clamp(20px,4vw,35px)}.audience-wrap h2{font-size:clamp(1.25rem,4vw,1.9rem);line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.audience-wrap .option{width:100%}.audience-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stage-help{font-size:.84rem;line-height:1.5}.stage-footer{font-size:.85rem;color:var(--muted)}.stage-side .panel{margin-bottom:15px}

(()=>{"use strict";

let lang=localStorage.getItem("live-lang")==="ar"?"ar":"en",admin=fragment.get("admin")||sessionStorage.getItem("live-admin")||"",presenter=fragment.get("presenter")||sessionStorage.getItem("live-presenter")||"",participant=sessionStorage.getItem("live-participant-"+(params.get("code")||""))||"",active=null,lastRevision=-1,refresh=null,busy=false;

$("language").onclick=language;$("home-link").onclick=()=>{history.replaceState(null,"",location.pathname);params.delete("code");params.delete("session");params.delete("admin");render()};
function home(){layout('<h1>'+t("Your conference, three simple ways","مؤتمرك، ثلاث طرق واضحة")+'</h1><p class="muted">'+t("Choose your role.","اختر دورك.")+'</p><div class="role-grid"><section class="role-card"><h2>1 · '+t("Join a conference","الانضمام إلى مؤتمر")+'</h2><p>'+t("Audience: enter the code displayed by the presenter.","للحضور: أدخل الرمز المعروض من المقدم.")+'</p>'+field(t("Conference code","رمز المؤتمر"),"code","6030D10787")+'<button id="join">'+t("Join and vote","انضم وصوّت")+'</button></section><section class="role-card"><h2>2 · '+t("My presentations","عروضي التقديمية")+'</h2><p>'+t("Public: create and manage questions and sessions.","للجميع: إنشاء الأسئلة والجلسات وإدارتها.")+'</p><button id="my-presentations" class="secondary">'+t("Open owner dashboard","فتح لوحة المالك")+'</button></section><section class="role-card"><h2>3 · '+t("Presenter mode","وضع مقدم العرض")+'</h2><p>'+t("Public: control voting and move between questions.","للجميع: التحكم بالتصويت والانتقال بين الأسئلة.")+'</p><button id="presenter-mode" class="secondary">'+t("Open presenter mode","فتح وضع المقدم")+'</button></section></div><p id="notice" role="status"></p>');$("join").onclick=()=>{const code=$("code").value.trim().toUpperCase();if(!/^[A-Z0-9]{6,12}$/.test(code)){notice(t("Enter the conference code.","أدخل رمز المؤتمر."),true);return}location.href="?code="+encodeURIComponent(code)};$("my-presentations").onclick=dashboard;$("presenter-mode").onclick=publicSessions}
async function publicSessions(){layout('<h1>'+t("Presenter mode","وضع المقدم")+'</h1><p>'+t("Select a conference to control. No password required.","اختر المؤتمر للتحكم به. لا حاجة لكلمة مرور.")+'</p><div id="session-list" class="panel">'+t("Loading sessions...","جارٍ تحميل الجلسات...")+'</div><p id="notice" role="status"></p>');try{const v=await api("list_sessions");$("session-list").innerHTML=v.sessions.length?v.sessions.map(s=>'<div class="panel"><strong>'+esc(s.join_code)+'</strong> · '+esc(s.state)+'<p><button data-session="'+esc(s.id)+'">'+t("Open presenter controls","فتح أدوات المقدم")+'</button></p></div>').join(""):t("No sessions yet. Create one under My presentations.","لا توجد جلسات. أنشئ واحدة من عروضي.");$("session-list").querySelectorAll("[data-session]").forEach(b=>b.onclick=()=>location.href="?session="+encodeURIComponent(b.dataset.session))}catch(e){notice(e.message,true)}}

function parsePrivateLink(value,role){try{const u=new URL(value.trim(),location.origin);if(u.origin!==location.origin||!u.pathname.replace(/\/$/,"").endsWith("/live"))return null;const h=new URLSearchParams(u.hash.slice(1));if(role==="owner"){const token=h.get("admin");return token&&/^[a-f0-9]{64}$/.test(token)?{token}:null}const token=h.get("presenter"),session=u.searchParams.get("session");return token&&/^[a-f0-9]{48}$/.test(token)&&session&&/^[a-f0-9-]{36}$/.test(session)?{token,session}:null}catch(_){return null}}
function ownerAccess(){layout('<button class="secondary" id="back-home">'+t("← Back","→ عودة")+'</button><div class="panel access-panel"><h1>'+t("My presentations","عروضي التقديمية")+'</h1><p>'+t("Paste your private owner link. This is not an audience code.","الصق رابط المالك الخاص بك. هذا ليس رمز دخول الحضور.")+'</p><label class="stack">'+t("Private owner link","رابط المالك الخاص")+'<input id="owner-link" type="password" autocomplete="off" spellcheck="false" placeholder="https://tamayuz10x.com/live/?admin=1#admin=..."></label><button id="owner-submit">'+t("Open dashboard","فتح لوحة التحكم")+'</button><p id="notice" role="status"></p><p class="muted">'+t("Your link is kept in this browser session; it is not sent to another website.","يُحتفظ بالرابط في جلسة هذا المتصفح ولا يُرسل إلى موقع آخر.")+'</p></div>');$("back-home").onclick=home;$("owner-submit").onclick=async()=>{const parsed=parsePrivateLink($("owner-link").value,"owner");if(!parsed){notice(t("Paste the complete private owner link, including the #admin part.","الصق رابط المالك كاملاً بما فيه جزء #admin."),true);return}try{await api("list",{key:parsed.token});admin=parsed.token;sessionStorage.setItem("live-admin",admin);params.set("admin","1");history.replaceState(null,"","?admin=1");render()}catch(e){notice(t("Owner access was not accepted. Check your private link.","لم يُقبل رابط المالك. تحقق من الرابط الخاص."),true)}}}
function presenterAccess(){layout('<button class="secondary" id="back-home">'+t("← Back","→ عودة")+'</button><div class="panel access-panel"><h1>'+t("Presenter mode","وضع مقدم العرض")+'</h1><p>'+t("Paste the private presenter link provided by the conference owner. The audience join code cannot control voting.","الصق رابط المقدم الخاص الذي يرسله مالك المؤتمر. رمز الحضور لا يتيح التحكم بالتصويت.")+'</p><label class="stack">'+t("Private presenter link","رابط المقدم الخاص")+'<input id="presenter-link" type="password" autocomplete="off" spellcheck="false" placeholder="https://tamayuz10x.com/live/?session=...#presenter=..."></label><button id="presenter-submit">'+t("Open presenter controls","فتح أدوات المقدم")+'</button><p id="notice" role="status"></p></div>');$("back-home").onclick=home;$("presenter-submit").onclick=async()=>{const parsed=parsePrivateLink($("presenter-link").value,"presenter");if(!parsed){notice(t("Paste the complete private presenter link, including the #presenter part.","الصق رابط المقدم كاملاً بما فيه جزء #presenter."),true);return}try{await api("present",{session_id:parsed.session,presenter_token:parsed.token});presenter=parsed.token;sessionStorage.setItem("live-presenter",presenter);sessionStorage.setItem("live-presenter-session",parsed.session);location.href="?session="+encodeURIComponent(parsed.session)+"#presenter="+encodeURIComponent(presenter)}catch(e){notice(t("Presenter access was not accepted. Ask the owner for a valid link.","لم يُقبل رابط المقدم. اطلب رابطاً صالحاً من المالك."),true)}}}
async function dashboard(){layout('<h1>'+t("My presentations","عروضي التقديمية")+'</h1><div class="panel stack"><h2>'+t("Create presentation","إنشاء عرض")+'</h2>'+field(t("Conference title","عنوان المؤتمر"),"title")+ '<select id="locale"><option value="en">English</option><option value="ar">العربية</option></select><button id="create">'+t("Create","إنشاء")+'</button></div><div class="panel"><h2>'+t("Saved presentations","العروض المحفوظة")+'</h2><div id="presentations">'+t("Loading...","جارٍ التحميل...")+'</div></div><p id="notice"></p>');$("create").onclick=async()=>{try{const v=await api("create",{key:admin,title:$("title").value,locale:$("locale").value});sessionStorage.setItem("live-selected",v.presentation.id);await dashboard()}catch(e){notice(e.message,true)}};try{const v=await api("list",{key:admin});$("presentations").innerHTML=v.presentations.length?v.presentations.map(p=>'<div class="panel"><strong>'+esc(p.title)+'</strong><p class="muted">'+esc(p.locale)+'</p><button data-id="'+esc(p.id)+'">'+t("Manage questions and sessions","إدارة الأسئلة والجلسات")+'</button></div>').join(""):t("No presentations yet.","لا توجد عروض بعد.");$("presentations").querySelectorAll("button").forEach(b=>b.onclick=()=>{sessionStorage.setItem("live-selected",b.dataset.id);manage(b.dataset.id)})}catch(e){notice(e.message,true)}}
async function manage(pid){layout('<button class="secondary" id="back">'+t("Back","عودة")+'</button><h1>'+t("Manage presentation","إدارة العرض")+'</h1><div class="panel stack"><h2>'+t("Add a question","إضافة سؤال")+'</h2>'+field(t("Question","السؤال"),"prompt")+'<select id="kind"><option value="choice">'+t("Multiple choice","اختيارات")+'</option><option value="rating">'+t("Rating 1–5","تقييم ١–٥")+'</option><option value="text">'+t("Open text","إجابة مفتوحة")+'</option></select><label>'+t("Options (one per line, for choice questions)","الخيارات (كل خيار في سطر)")+'<textarea id="options" rows="5"></textarea></label><button id="add">'+t("Add question","إضافة السؤال")+'</button></div><div class="panel"><h2>'+t("Edit saved questions","تعديل الأسئلة المحفوظة")+'</h2><div id="saved-questions"></div></div><div class="panel"><button id="start">'+t("Create live session","إنشاء جلسة مباشرة")+'</button></div><p id="notice"></p>');$("back").onclick=dashboard;async function loadSavedQuestions(){const target=$("saved-questions");try{const v=await api("list_questions",{presentation_id:pid});target.innerHTML=v.questions.map((q,i)=>'<div class="review-question"><strong>'+t("Question ","السؤال ")+(i+1)+'</strong><textarea rows="7" maxlength="6000" data-question="'+esc(q.id)+'">'+esc(q.prompt)+'</textarea><button class="secondary" data-save="'+esc(q.id)+'">'+t("Save changes","حفظ التعديلات")+'</button></div>').join("")||t("No questions yet.","لا توجد أسئلة بعد.");target.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=async()=>{const area=target.querySelector('textarea[data-question="'+btn.dataset.save+'"]');try{await api("update_question",{presentation_id:pid,question_id:btn.dataset.save,prompt:area.value});notice(t("Question updated. Existing votes preserved.","تم تحديث السؤال مع الاحتفاظ بالأصوات."))}catch(e){notice(e.message,true)}})}catch(e){target.textContent=e.message}}loadSavedQuestions();$("add").onclick=async()=>{try{await api("add_question",{key:admin,presentation_id:pid,prompt:$("prompt").value,kind:$("kind").value,options:$("options").value.split("\n").map(x=>x.trim()).filter(Boolean)});notice(t("Question saved.","تم حفظ السؤال."));await loadSavedQuestions();$("prompt").value="";$("options").value=""}catch(e){notice(e.message,true)}};$("start").onclick=async()=>{try{const v=await api("new_session",{key:admin,presentation_id:pid});sessionStorage.setItem("live-presenter",v.presenter_token);sessionStorage.setItem("live-presenter-session",v.session.id);location.href="?session="+encodeURIComponent(v.session.id)+"#presenter="+encodeURIComponent(v.presenter_token)}catch(e){notice(e.message,true)}}}
function qr(code){const el=$("qr");if(!el)return;const link=location.origin+"/live/?code="+encodeURIComponent(code);$("audience-link").href=link;$("audience-link").textContent=link;if(window.QRCode){el.innerHTML="";new QRCode(el,{text:link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}else{el.textContent=t("QR unavailable; share the link.","تعذر عرض QR؛ شارك الرابط.")}}
async function presenterPage(){
 if(busy)return;busy=true;
 try{
  const v=await api("present",{session_id:params.get("session"),presenter_token:presenter,key:admin});
  const s=v.session,selected=v.questions.find(q=>q.id===s.active_question_id);sessionStorage.setItem("live-presenter-session",s.id);
  const first=!$("presenter-root");
  const previouslyChosen=$("question")?.value;
  active=v;lastRevision=s.revision;
  if(first){
   layout('<div class="presenter" id="presenter-root"><div class="stage-topline"><div><p class="muted">'+t("LIVE PRESENTATION","عرض مباشر")+'</p><h1 class="stage-title">'+t("Audience poll","استطلاع الجمهور")+'</h1></div><span id="status" class="stage-pill"></span></div><div class="presenter-stage"><div class="stage-main"><div class="panel"><div id="question-view"></div><div id="results"></div></div><div class="panel"><button id="review-all" class="secondary" aria-expanded="false">'+t("Review results for all questions","مراجعة نتائج جميع الأسئلة")+'</button><div id="all-results"></div></div></div><aside class="stage-side"><div class="panel"><p class="muted">'+t("JOIN THIS SESSION","الانضمام إلى الجلسة")+'</p><div id="qr"></div><p class="code">'+esc(s.code)+'</p><a id="audience-link" target="_blank" rel="noopener"></a><p><button class="secondary" id="share-presenter">'+t("Copy presenter link","نسخ رابط المقدم")+'</button></p><small class="stage-help">'+t("Public controls enabled: anyone can manage this session.","التحكم العام مفعل: يمكن لأي شخص إدارة هذه الجلسة.")+'</small></div><div class="panel stage-controls"><h2>'+t("Presenter controls","التحكم بالعرض")+'</h2><label for="question">'+t("Choose question","اختر السؤال")+'</label><select id="question"></select><div class="stage-navigation"><button id="previous" class="secondary">'+t("Previous question","السؤال السابق")+'</button><button id="next">'+t("Next question","السؤال التالي")+'</button></div><div class="actions"><button id="open">'+t("Open voting","فتح التصويت")+'</button><button id="close" class="secondary">'+t("Close voting","إغلاق التصويت")+'</button><button id="reveal" class="secondary">'+t("Show results","إظهار النتائج")+'</button><button id="hide" class="secondary">'+t("Hide results","إخفاء النتائج")+'</button><button id="end" class="danger">'+t("End session","إنهاء الجلسة")+'</button></div><p id="notice" role="status"></p></div></aside></div></div>');
   $("review-all").onclick=async()=>{const target=$("all-results");const btn=$("review-all");if(btn.getAttribute("aria-expanded")==="true"){target.innerHTML="";btn.setAttribute("aria-expanded","false");btn.textContent=t("Review results for all questions","مراجعة نتائج جميع الأسئلة");return}btn.setAttribute("aria-expanded","true");btn.textContent=t("Close results review","إغلاق مراجعة النتائج");target.innerHTML=t("Loading results...","جارٍ تحميل النتائج...");try{const review=await api("review_results",{session_id:s.id});target.innerHTML=review.questions.map((q,i)=>'<div class="review-question"><h3>'+t("Question ","السؤال ")+(i+1)+'</h3><p>'+esc(q.prompt)+'</p><strong>'+q.total+' '+t("responses","إجابة")+'</strong>'+q.answers.map(a=>{const pct=q.total?Math.round(100*a.votes/q.total):0;return '<div class="stage-result"><div class="stage-result-label"><span>'+esc(a.label)+'</span><strong>'+a.votes+' · '+pct+'%</strong></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join("")+'</div>').join("")}catch(e){target.textContent=e.message}};
   $("share-presenter").onclick=async()=>{const link=location.origin+"/live/?session="+encodeURIComponent(s.id)+"#presenter="+encodeURIComponent(presenter);try{await navigator.clipboard.writeText(link);notice(t("Private presenter link copied.","تم نسخ رابط المقدم الخاص."))}catch(_){notice(link)}};
   const control=async(next,resultsAction)=>{const questionId=$("question").value;if(!questionId){notice(t("Add a question in your dashboard before opening voting.","أضف سؤالاً من لوحة التحكم قبل فتح التصويت."),true);return}try{const res=await api("control",{session_id:s.id,presenter_token:presenter,key:admin,question_id:questionId,state:next,results_action:resultsAction});active=res;await presenterPage()}catch(e){notice(e.message,true)}};
   $("previous").onclick=()=>changeLiveQuestion(null,-1);
   $("next").onclick=()=>changeLiveQuestion(null,1);
   $("open").onclick=()=>control("open");
   $("close").onclick=()=>control("closed");
   $("reveal").onclick=()=>control(active?.session?.state||"closed","show");
   $("hide").onclick=()=>control(active?.session?.state||"closed","hide");
   $("end").onclick=()=>{if(confirm(t("End this session?","إنهاء الجلسة؟")))control("ended")};
  }
  async function changeLiveQuestion(requestedId,delta=0){
   if(window.liveQuestionSwitchPending)return;
   const snapshot=active;if(!snapshot?.questions?.length||snapshot.session.state==="ended")return;
   const index=snapshot.questions.findIndex(q=>q.id===snapshot.session.active_question_id);
   const target=requestedId?snapshot.questions.find(q=>q.id===requestedId):snapshot.questions[index+delta];
   if(!target||target.id===snapshot.session.active_question_id)return;
   window.liveQuestionSwitchPending=true;
   const selector=$("question"),previous=$("previous"),next=$("next");
   for(const el of [selector,previous,next])if(el)el.disabled=true;
   try{
    const response=await api("control",{session_id:snapshot.session.id,presenter_token:presenter,key:admin,question_id:target.id,state:snapshot.session.state});
    if(response.session.active_question_id!==target.id)throw Error(t("Question did not change. Please retry.","لم يتغير السؤال، يرجى إعادة المحاولة."));
    active=response;
    if(selector)selector.value=target.id;
    await presenterPage();
   }catch(e){notice(e.message,true);if(selector)selector.value=active?.session?.active_question_id||""}
   finally{window.liveQuestionSwitchPending=false;const current=active?.session;const idx=active?.questions?.findIndex(q=>q.id===current?.active_question_id)??-1;if(selector)selector.disabled=current?.state==="ended";if(previous)previous.disabled=idx<=0||current?.state==="ended";if(next)next.disabled=idx<0||idx>=((active?.questions?.length||0)-1)||current?.state==="ended";}
  }
  const select=$("question");
  if(select){
   const old=previouslyChosen||select.value;
   select.innerHTML=v.questions.map(q=>'<option value="'+esc(q.id)+'">'+esc(q.position+1)+'. '+esc(q.prompt.slice(0,95))+'</option>').join("");
   select.value=selected?.id||v.questions[0]?.id||"";
   select.disabled=!v.questions.length||s.state==="ended";
   select.onchange=()=>changeLiveQuestion(select.value);

  }
  const status=$("status");if(status){status.textContent=s.state==="open"?t("Voting open","التصويت مفتوح"):s.state==="closed"?t("Voting closed","التصويت مغلق"):s.state==="ended"?t("Session ended","انتهت الجلسة"):t("Waiting","انتظار");status.className="stage-pill "+(s.state==="open"?"open":s.state==="ended"?"ended":"")}
  const currentIndex=v.questions.findIndex(q=>q.id===s.active_question_id);if($("previous"))$("previous").disabled=currentIndex<=0||s.state==="ended";if($("next"))$("next").disabled=currentIndex<0||currentIndex>=v.questions.length-1||s.state==="ended";const open=$("open");if(open)open.disabled=!v.questions.length||s.state==="ended";
  for(const id of ["close","reveal","hide","end"]){if($(id))$(id).disabled=!v.questions.length||s.state==="ended"}
  if($("qr")&&window.QRCode&&!$("qr").querySelector("img"))qr(s.code);
  const questionView=$("question-view");
  if(questionView)questionView.innerHTML=selected?'<p class="muted">'+t("QUESTION","السؤال")+' '+esc(selected.position+1)+' / '+v.questions.length+'</p><h2 class="stage-question">'+esc(selected.prompt)+'</h2>':'<div class="stage-empty"><h2>'+t("No active question","لا يوجد سؤال نشط")+'</h2><p>'+t("Add questions in your dashboard, then create a new session.","أضف الأسئلة في لوحة التحكم ثم أنشئ جلسة جديدة.")+'</p></div>';
  const results=$("results");
  if(results){
   const total=v.count||0;
   if(!selected)results.innerHTML="";
   else if(!s.show_results)results.innerHTML='<div class="stage-empty">'+t("Results are hidden. Select Show results when ready.","النتائج مخفية. اختر إظهار النتائج عندما تكون جاهزًا.")+'</div>';
   else{
    const counts=new Map((v.aggregate||[]).map(x=>[String(x.answer),Number(x.votes)||0]));
    const labels=selected.kind==="choice"?(selected.options||[]):selected.kind==="rating"?["1","2","3","4","5"]:[...counts.keys()];
    results.innerHTML='<div class="stage-count"><strong>'+total+'</strong><span>'+t("responses","إجابة")+'</span></div>'+labels.map((label,i)=>{const n=counts.get(String(label))||0,pct=total?Math.round(n*100/total):0;return '<div class="stage-result"><div class="stage-result-label"><span>'+esc(label)+'</span><strong>'+pct+'% · '+n+'</strong></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join("");
   }
  }
 }catch(e){if(!$("presenter-root"))layout('<div class="panel"><h2>'+t("Presenter access failed","تعذر دخول المقدم")+'</h2><p class="error">'+esc(e.message)+'</p></div>')}
 finally{busy=false}
}
async function audiencePage(){if(busy)return;busy=true;const code=params.get("code");try{if(!participant){const v=await api("join",{code});participant=v.participant_token;sessionStorage.setItem("live-participant-"+code,participant)}const v=await api("view",{code});const s=v.session,q=v.questions[0];const voteKey="live-voted-"+s.id+"-"+(q?.id||"");const voted=sessionStorage.getItem(voteKey);const changed=lastRevision!==s.revision;if(!$("audience-root")||changed){lastRevision=s.revision;layout('<div id="audience-root"><h1>'+t("Live conference","المؤتمر المباشر")+'</h1><div class="panel"><p class="muted">'+t("Session","الجلسة")+': '+esc(code)+' · '+esc(s.state)+'</p><div id="poll"></div><p id="notice"></p></div></div>')}const poll=$("poll");if(!poll)return;if(!changed&&s.state==="open"&&!voted){styleAudience();return;}if(s.state==="ended"){poll.innerHTML='<h2>'+t("Thank you for participating.","شكرًا لمشاركتك.")+'</h2>';return}if(!q){poll.innerHTML='<h2>'+t("Waiting for the presenter...","بانتظار مقدم العرض...")+'</h2>';return}if(s.state!=="open"||voted){poll.innerHTML='<h2>'+esc(q.prompt)+'</h2><p>'+ (voted?t("Your answer was received.","تم استلام إجابتك."):t("Voting is not open.","التصويت غير مفتوح."))+'</p>';if(s.show_results){const counts=new Map((v.aggregate||[]).map(x=>[String(x.answer),Number(x.votes)||0]));const labels=q.kind==="choice"?(q.options||[]):q.kind==="rating"?["1","2","3","4","5"]:[...counts.keys()];const total=v.count||0;poll.innerHTML+='<h3>'+t("Results","النتائج")+'</h3>'+labels.map(x=>'<p>'+esc(x)+': '+(counts.get(String(x))||0)+' ('+(total?Math.round(100*(counts.get(String(x))||0)/total):0)+'%)</p>').join("")}styleAudience();return}
poll.innerHTML='<h2>'+esc(q.prompt)+'</h2>'+(q.kind==="choice"?(q.options||[]).map(o=>'<button class="option" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join(""):q.kind==="rating"?[1,2,3,4,5].map(n=>'<button class="option" data-answer="'+n+'">'+n+'</button>').join(""):'<textarea id="answer" maxlength="400" rows="4" placeholder="'+t("Your answer","إجابتك")+'"></textarea><button id="send">'+t("Submit","إرسال")+'</button>');
const submit=async(answer)=>{try{poll.querySelectorAll("button").forEach(b=>b.disabled=true);await api("vote",{code,participant_token:participant,answer});sessionStorage.setItem(voteKey,"1");notice(t("Answer received.","تم استلام الإجابة."));await audiencePage()}catch(e){notice(e.message,true);poll.querySelectorAll("button").forEach(b=>b.disabled=false)}};
poll.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>submit(b.dataset.answer));if($("send"))$("send").onclick=()=>submit($("answer").value);styleAudience();
}catch(e){if(!$("audience-root"))layout('<div class="panel"><p class="error">'+esc(e.message)+'</p><a href="/live/">'+t("Try again","حاول مجددًا")+'</a></div>')}finally{busy=false}}
function styleAudience(){const root=$("audience-root");if(root)root.classList.add("audience-wrap");const poll=$("poll");if(poll){poll.querySelectorAll(".option").forEach((b,i)=>{if(!b.querySelector(".letter"))b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+b.innerHTML+'</span>'})}}
function render(){stop();lastRevision=-1;if(params.get("session")){presenterPage();refresh=setInterval(presenterPage,2000)}else if(params.get("code")){audiencePage();refresh=setInterval(audiencePage,5000)}else if(params.get("admin"))dashboard();else home()}
render();
})();
</script><script src="/assets/js/unified-navigation.js?v=20261101-7" defer></script></body></html>
