<!doctype html><html lang="ar" dir="rtl" class="auth-pending"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>جلسات الكوتش | Work Approach Assessment</title><style>.auth-pending body{visibility:hidden}:root{--ink:#172033;--muted:#687487;--line:#dfe6ee;--navy:#182844;--bg:#f4f7fa;--ok:#2f7c58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}.shell{width:min(980px,100%);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top a{color:var(--navy);text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 12px 36px rgba(30,48,76,.06)}h1,h2,h3{margin-top:0}.muted{color:var(--muted);line-height:1.7}.field label{font-weight:800;display:block;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid #cfd8e3;border-radius:12px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#eef2f6;color:#24364f}.btn:disabled{opacity:.5}.created{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-top:18px}.created img{width:190px;max-width:42vw;border:1px solid var(--line);border-radius:14px}.linkbox{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.session{border-top:1px solid var(--line);padding:16px 0}.session:first-child{border-top:0}.meta{font-size:.82rem;color:var(--muted)}.status{display:inline-block;border-radius:999px;padding:4px 9px;background:#eef2f6;font-size:.75rem;font-weight:800}.status.completed{background:#eaf5ef;color:var(--ok)}.error{color:#a43b3b;margin-top:10px}@media(max-width:680px){.created{grid-template-columns:1fr}.created img{max-width:220px;width:100%}}</style><script src="../../assets/js/auth-config.js"></script><script type="module" src="../../assets/js/assessment-auth-guard.js"></script></head><body><main class="shell"><div class="top"><a href="index.html" id="back">← تقييم أسلوب العمل</a><a href="?lang=en" id="langSwitch">English</a></div><section class="card"><h1 id="title">جلسات Work Approach للكوتش</h1><p class="muted" id="intro">أنشئ جلسة خاصة لمشارك واحد. سيولد النظام رابطًا فريدًا وQR. لا يوجد رمز يكتبه المشارك.</p><div class="field"><label id="participantLabelText" for="participantLabel">اسم المشارك أو معرف الجلسة</label><input id="participantLabel" maxlength="120" autocomplete="off" placeholder="مثال: أحمد — جلسة 1"></div><div class="actions"><button class="btn" id="createBtn">إنشاء جلسة جديدة</button></div><div id="createError" class="error"></div><div id="created"></div></section><section class="card"><h2 id="sessionsTitle">جلساتي</h2><div id="sessions"><p class="muted">جارٍ التحميل…</p></div></section></main><script type="module">
import {createWorkCoachSession,listWorkCoachSessions,archiveWorkCoachSession} from '../../assets/js/work-coach-sessions-client.js';
const p=new URLSearchParams(location.search),lang=p.get('lang')==='en'?'en':'ar',rtl=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.body.dir=rtl?'rtl':'ltr';
const tx=(en,ar)=>rtl?ar:en,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('back').textContent=tx('← Work Approach Assessment','← تقييم أسلوب العمل');document.getElementById('langSwitch').textContent=rtl?'English':'العربية';document.getElementById('langSwitch').href=rtl?'?lang=en':'?lang=ar';document.getElementById('title').textContent=tx('Coach Work Approach Sessions','جلسات Work Approach للكوتش');document.getElementById('intro').textContent=tx('Create a private session for one participant. The system generates a unique link and QR. The participant does not enter a code.','أنشئ جلسة خاصة لمشارك واحد. سيولد النظام رابطًا فريدًا وQR. لا يوجد رمز يكتبه المشارك.');document.getElementById('participantLabelText').textContent=tx('Participant name or session label','اسم المشارك أو معرف الجلسة');document.getElementById('participantLabel').placeholder=tx('e.g., Ahmed — Session 1','مثال: أحمد — جلسة 1');document.getElementById('createBtn').textContent=tx('Create new session','إنشاء جلسة جديدة');document.getElementById('sessionsTitle').textContent=tx('My sessions','جلساتي');
function qr(url){return `https://quickchart.io/qr?size=280&margin=2&text=${encodeURIComponent(url)}`}
async function copy(value,btn){try{await navigator.clipboard.writeText(value);const old=btn.textContent;btn.textContent=tx('Copied','تم النسخ');setTimeout(()=>btn.textContent=old,1200)}catch(_){prompt(tx('Copy this link','انسخ هذا الرابط'),value)}}
function createdView(s){const h=document.getElementById('created');h.innerHTML=`<div class="created"><div><h3>${tx('Session ready','الجلسة جاهزة')}</h3><p class="muted">${tx('Send the link or QR to the participant. The link itself identifies the coaching session.','أرسل الرابط أو QR للمشارك. الرابط نفسه يحدد جلسة الكوتشنغ دون أي كود.')}</p><input class="linkbox" id="newLink" readonly value="${esc(s.join_url)}"><div class="actions"><button class="btn secondary" id="copyNew">${tx('Copy link','نسخ الرابط')}</button><a class="btn secondary" href="${esc(s.join_url)}" target="_blank" rel="noopener">${tx('Open participant link','فتح رابط المشارك')}</a></div></div><img src="${qr(s.join_url)}" alt="QR"></div>`;document.getElementById('copyNew').onclick=e=>copy(s.join_url,e.currentTarget)}
function sessionRow(s){const completed=s.status==='completed';return `<div class="session"><div><strong>${esc(s.participant_label||tx('Unnamed session','جلسة بدون اسم'))}</strong> <span class="status ${completed?'completed':''}">${completed?tx('Completed','مكتملة'):s.status==='archived'?tx('Archived','مؤرشفة'):tx('Waiting for participant','بانتظار المشارك')}</span></div><div class="meta">${new Date(s.created_at).toLocaleString(lang==='ar'?'ar-AE':'en-GB')}</div><div class="actions"><button class="btn secondary copy-session" data-link="${esc(s.join_url)}">${tx('Copy participant link','نسخ رابط المشارك')}</button>${completed?`<a class="btn" href="coach-report.html?id=${encodeURIComponent(s.id)}&type=participant&lang=${lang}">${tx('Participant report','تقرير المشارك')}</a><a class="btn" href="coach-report.html?id=${encodeURIComponent(s.id)}&type=coach&lang=${lang}">${tx('Coach report','تقرير الكوتش')}</a>`:''}${s.status!=='archived'?`<button class="btn secondary archive-session" data-id="${esc(s.id)}">${tx('Archive','أرشفة')}</button>`:''}</div></div>`}
async function load(){const host=document.getElementById('sessions');try{const d=await listWorkCoachSessions();const rows=d.sessions||[];host.innerHTML=rows.length?rows.map(sessionRow).join(''):`<p class="muted">${tx('No sessions yet.','لا توجد جلسات بعد.')}</p>`;host.querySelectorAll('.copy-session').forEach(b=>b.onclick=e=>copy(e.currentTarget.dataset.link,e.currentTarget));host.querySelectorAll('.archive-session').forEach(b=>b.onclick=async e=>{e.currentTarget.disabled=true;try{await archiveWorkCoachSession(e.currentTarget.dataset.id);await load()}catch(_){e.currentTarget.disabled=false}})}catch(e){host.innerHTML=`<p class="error">${tx('Could not load sessions.','تعذر تحميل الجلسات.')}</p>`}}
document.getElementById('createBtn').onclick=async()=>{const btn=document.getElementById('createBtn'),label=document.getElementById('participantLabel').value.trim(),err=document.getElementById('createError');err.textContent='';if(!label){err.textContent=tx('Enter a participant name or session label.','أدخل اسم المشارك أو معرف الجلسة.');return}btn.disabled=true;try{const d=await createWorkCoachSession({participantLabel:label,language:lang});createdView(d.session);document.getElementById('participantLabel').value='';await load()}catch(e){err.textContent=tx('The session could not be created.','تعذر إنشاء الجلسة.')}finally{btn.disabled=false}};load();
</script></body></html>
