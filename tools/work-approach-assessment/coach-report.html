<!doctype html><html lang="ar" dir="rtl" class="auth-pending"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تقرير جلسة الكوتش | Work Approach</title><style>.auth-pending body{visibility:hidden}:root{--ink:#172033;--muted:#687487;--line:#dfe6ee;--navy:#182844;--bg:#f4f7fa;--green:#2f7c58;--gold:#aa7a17;--orange:#b85f26}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7}.shell{width:min(1000px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.top a{color:var(--navy);text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,30px);margin-bottom:16px;box-shadow:0 10px 30px rgba(30,48,76,.06)}h1,h2,h3{line-height:1.3}.muted{color:var(--muted)}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.score{border:1px solid var(--line);border-radius:16px;padding:15px}.score strong{display:block}.score b{font-size:1.8rem}.bar{height:9px;background:#edf1f5;border-radius:999px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:var(--navy)}.callout{border:1px solid #d9e2eb;background:#f8fafc;border-radius:16px;padding:15px;margin:12px 0}.questions{display:grid;gap:9px}.q{border:1px solid var(--line);border-radius:13px;padding:11px 13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--navy);color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#eef2f6;color:#25364c}.pdf-frame{width:100%;height:76vh;border:1px solid var(--line);border-radius:14px;background:#fff}.error{color:#a43b3b}@media(max-width:700px){.score-grid{grid-template-columns:1fr}.pdf-frame{height:65vh}}@media print{.top,.actions{display:none}.shell{width:100%;padding:0}.card{box-shadow:none;border:0;border-radius:0;break-inside:avoid}}</style><script src="../../assets/js/auth-config.js"></script><script type="module" src="../../assets/js/assessment-auth-guard.js"></script></head><body><main class="shell"><div class="top"><a id="back" href="coach.html">← جلسات الكوتش</a><span id="kind"></span></div><div id="app" class="card"><p class="muted">جارٍ تحميل التقرير…</p></div></main><script type="module">
import {currentSession} from '../../assets/js/assessment-auth-client.js';
import {getWorkCoachSession} from '../../assets/js/work-coach-sessions-client.js';
const p=new URLSearchParams(location.search),id=p.get('id')||'',type=p.get('type')==='coach'?'coach':'participant',lang=p.get('lang')==='en'?'en':'ar',rtl=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.body.dir=rtl?'rtl':'ltr';const tx=(en,ar)=>rtl?ar:en,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('back').textContent=tx('← Coach sessions','← جلسات الكوتش');document.getElementById('back').href=`coach.html?lang=${lang}`;document.getElementById('kind').textContent=type==='coach'?tx('Coach report','تقرير الكوتش'):tx('Participant report','تقرير المشارك');
const names={U:{ar:'فهم الموقف',en:'Understanding'},S:{ar:'تنظيم العمل',en:'Structuring'},A:{ar:'بدء العمل',en:'Starting Action'}};
function n(c){return names[c]?.[lang]||c}function pct(v){return Math.max(0,Math.min(100,Number(v)||0))}
function coachingContent(top,low){const x={U:{strength:["يبحث عن المعنى والمعلومات المهمة قبل الالتزام.","قد يلتقط الغموض أو الافتراضات غير المختبرة مبكرًا."],watch:["قد يطيل البحث عن اليقين بعد أن تصبح المعلومات كافية للبدء.","قد يحتاج إلى تحويل الفهم إلى قرار أو خطوة واضحة بسرعة أكبر."],qs:["ما الحد الأدنى من المعلومات الذي تحتاجه كي تبدأ خطوة آمنة؟","أين يضيف التحليل قيمة فعلية، وأين يتحول إلى تأخير؟","كيف تعرف أن لديك فهمًا كافيًا للانتقال إلى التنظيم أو التنفيذ؟"]},S:{strength:["يميل إلى تحويل العمل إلى أولويات ومسؤوليات وخطوات واضحة.","قد يساعد الآخرين على رؤية ما يجب أن يحدث بعد ذلك."],watch:["قد ينظم الموقف قبل أن يكتمل فهم المشكلة أو وجهات النظر المهمة.","قد يبالغ في الحاجة إلى الهيكلة عندما يكون التجريب السريع أنسب."],qs:["ما الذي يحتاج إلى تنظيم فعلًا، وما الذي يمكن أن يبقى مرنًا؟","هل فهم أصحاب المصلحة للمشكلة متقارب قبل تحديد الخطة؟","متى تصبح الخطة وسيلة للحركة، ومتى تصبح غاية بحد ذاتها؟"]},A:{strength:["يميل إلى تحويل التفكير إلى حركة وتجربة عملية.","قد يخلق زخمًا عندما يكون التردد هو المشكلة الأساسية."],watch:["قد يبدأ قبل التحقق من معلومة حاسمة أو قبل وضوح المسؤوليات.","قد يحتاج إلى إبطاء الإيقاع عندما تكون تكلفة الخطأ مرتفعة."],qs:["ما الخطوة الأولى الآمنة والقابلة للتراجع؟","ما المعلومة التي لو كانت خاطئة ستغيّر قرار البدء؟","من يحتاج إلى أن يكون واضحًا أو مشاركًا قبل التنفيذ؟"]}};const d=x[top]||x.U;return{...d,lowQ:`الأسلوب الأقل حضورًا لديك هو «${n(low)}». ما المواقف التي قد تحتاج فيها إلى استخدامه بصورة أكثر قصدًا؟`}}
async function participantReport(sessionRow){const app=document.getElementById('app'),{session}=await currentSession(),endpoint=window.TAMAYUZ_AUTH_CONFIG?.reportsEndpoint;if(!session||!endpoint)throw new Error('auth');const list=await fetch(`${endpoint}?coach_session_id=${encodeURIComponent(id)}`,{headers:{Authorization:`Bearer ${session.access_token}`}});const data=await list.json();if(!list.ok)throw new Error(data?.error||'reports');const report=(data.reports||[]).find(r=>r.status==='ready'&&String(r.file_name||'').includes('work-approach-assessment-visual-v3'))||(data.reports||[]).find(r=>r.status==='ready');if(!report){app.innerHTML=`<h1>${tx('Participant report','تقرير المشارك')}</h1><p class="muted">${tx('The result is recorded, but the PDF is still being prepared. Refresh this page shortly.','تم تسجيل النتيجة، لكن ملف PDF ما زال قيد التجهيز. حدّث الصفحة بعد قليل.')}</p>`;return}const r=await fetch(`${endpoint}?report_id=${encodeURIComponent(report.id)}&coach_session_id=${encodeURIComponent(id)}`,{headers:{Authorization:`Bearer ${session.access_token}`}});if(!r.ok)throw new Error('pdf');const blob=await r.blob(),url=URL.createObjectURL(blob);app.innerHTML=`<h1>${tx('Participant report','تقرير المشارك')}</h1><p class="muted">${esc(sessionRow.participant_label||'')}</p><div class="actions"><a class="btn" href="${url}" target="_blank">${tx('Open PDF','فتح PDF')}</a><a class="btn secondary" href="${url}" download="work-approach-participant-report.pdf">${tx('Download PDF','تنزيل PDF')}</a></div><iframe class="pdf-frame" src="${url}" title="Participant report PDF"></iframe>`;}
function coachReport(row){const result=row.result_json||{},sc=result.scores||{},core=sc.core||{},sorted=Object.entries(core).sort((a,b)=>(b[1]?.index||0)-(a[1]?.index||0)),top=sorted[0]?.[0]||'U',second=sorted[1]?.[0]||'S',low=sorted[2]?.[0]||'A',guide=coachingContent(top,low),social=sc.social||{},flex=sc.flex||{};document.getElementById('app').innerHTML=`<h1>${tx('Coach Report — Work Approach','تقرير الكوتش — أسلوب العمل')}</h1><p class="muted">${esc(row.participant_label||tx('Participant','المشارك'))} · ${tx('This report is for coaching dialogue and development, not diagnosis or employment decisions.','هذا التقرير مخصص للحوار التطويري والكوتشنغ، وليس للتشخيص أو قرارات التوظيف.')}</p><div class="score-grid">${sorted.map(([c,o])=>`<div class="score"><strong>${esc(n(c))}</strong><b>${Number(o?.index||0).toFixed(0)}</b><div class="bar"><span style="width:${pct(o?.index)}%"></span></div></div>`).join('')}</div><div class="callout"><strong>${tx('Working hypothesis','فرضية العمل')}</strong><p>${tx(`The participant's clearest starting priority is ${n(top)}, followed by ${n(second)}. Treat this as a hypothesis to test against real work examples rather than a fixed label.`,`أوضح نقطة بداية لدى المشارك هي «${n(top)}»، تليها «${n(second)}». تعامل مع ذلك كفرضية تُختبر بأمثلة واقعية من العمل، لا كتصنيف ثابت.`)}</p></div><h2>${tx('Signals for the coach','إشارات للكوتش')}</h2><div class="score-grid"><div class="score"><strong>${tx('People involvement','إشراك الآخرين')}</strong><b>${Number(social.socialN||0)} / ${Number(social.total||0)}</b><p class="muted">${tx('How often the participant directly brought others into the work situations presented.','عدد المواقف التي أدخل فيها المشارك الآخرين مباشرة في طريقة التعامل مع العمل.')}</p></div><div class="score"><strong>${tx('Context shifts','تغيّر الاختيار مع السياق')}</strong><b>${Number(flex.shiftCount||0)} / ${Number(flex.totalPairs||0)}</b><p class="muted">${tx('Matched situations where the preferred response changed when one condition changed.','أزواج المواقف التي تغيّر فيها الاختيار عندما تغيّر عامل واحد في السياق.')}</p></div><div class="score"><strong>${tx('Lowest starting priority','الأقل حضورًا كنقطة بداية')}</strong><b style="font-size:1.15rem">${esc(n(low))}</b><p class="muted">${tx('Explore whether this approach is underused in situations that require it.','استكشف ما إذا كان هذا الأسلوب أقل استخدامًا في مواقف قد تحتاج إليه.')}</p></div></div><h2>${tx('Potential strengths to test','نقاط قوة محتملة للاختبار')}</h2><div class="questions">${guide.strength.map(x=>`<div class="q">${esc(x)}</div>`).join('')}</div><h2>${tx('Watch points','نقاط تستحق الانتباه')}</h2><div class="questions">${guide.watch.map(x=>`<div class="q">${esc(x)}</div>`).join('')}</div><h2>${tx('Suggested coaching questions','أسئلة مقترحة للكوتشنغ')}</h2><div class="questions">${[...guide.qs,guide.lowQ,tx('اذكر موقفًا نجح فيه أسلوبك المعتاد جدًا، وموقفًا آخر كان يحتاج منك بداية مختلفة.','Describe one situation where your usual approach worked very well and another where a different starting approach would have helped.')].map(x=>`<div class="q">${esc(x)}</div>`).join('')}</div><div class="actions"><button class="btn" onclick="window.print()">${tx('Print / Save PDF','طباعة / حفظ PDF')}</button><a class="btn secondary" href="coach-report.html?id=${encodeURIComponent(id)}&type=participant&lang=${lang}">${tx('Open participant report','فتح تقرير المشارك')}</a></div>`;}
(async()=>{try{if(!id)throw new Error('missing');const d=await getWorkCoachSession(id),row=d.session;if(type==='participant')await participantReport(row);else coachReport(row);}catch(e){document.getElementById('app').innerHTML=`<p class="error">${tx('The report could not be loaded.','تعذر تحميل التقرير.')}</p>`}})();
</script></body></html>
