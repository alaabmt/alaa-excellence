function buildCurrentItems(){const r=rng(state.seed);const pref=shuffle(BANK.preference,r), soc=shuffle(BANK.social,r), needs=shuffle(BANK.environmentNeeds,r), flex=[]; const pairMap={};BANK.flex.forEach(x=>(pairMap[x.pair]??=[]).push(x)); Object.keys(pairMap).sort().forEach(k=>{let arr=shuffle(pairMap[k],r);flex.push(...arr)}); state.order=state.order||{preference:pref.map(x=>x.id),social:soc.map(x=>x.id),needs:needs.map(x=>x.id),flex:flex.map(x=>x.id)}; currentItems={preference:state.order.preference.map(id=>BANK.preference.find(x=>x.id===id)),social:state.order.social.map(id=>BANK.social.find(x=>x.id===id)),needs:state.order.needs.map(id=>BANK.environmentNeeds.find(x=>x.id===id)),flex:state.order.flex.map(id=>BANK.flex.find(x=>x.id===id))};}

function renderQuestion(){buildCurrentItems(); const items=secItems(); if(state.index>=items.length){advanceSection();return} const item=items[state.index], prog=totalDone(), pct=100*prog.done/prog.total; state.events.push({type:'view',itemId:item.id,at:new Date().toISOString()}); if(!state.responses[item.id])state.responses[item.id]={itemId:item.id,section:state.section,startedAt:Date.now(),changes:0}; save(); const resp=state.responses[item.id], order=optionOrder(item); let optionHtml=''; order.forEach((oi,pos)=>{let o=item.options[oi], code=o.code, selected=false,badge=''; if(state.section==='preference'||state.section==='needs'){let rank=resp.ranks?.[code];selected=!!rank;badge=rank?rankBadge(rank,state.section):''} else {selected=resp.choice===code;badge=selected?'✓':''} optionHtml+=`<button class="option-button ${selected?'selected':''}" data-code="${esc(code)}" data-pos="${pos}" aria-pressed="${selected}"><span>${esc(itemText(o.text))}</span><span class="rank-badge ${selected?'top':''}">${badge}</span></button>`}); app.innerHTML=`<div class="section-kicker">${sectionTitle()} · ${state.index+1}/${items.length}</div><div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div><div class="instruction">${instruction()}</div><h2 class="question-title">${esc(itemText(item.stem))}</h2><div class="option-list">${optionHtml}</div><div class="mini-actions"><span class="step-label">${item.id}</span>${(state.section==='preference'||state.section==='needs')?`<button class="btn ghost" id="reset">${tx.reset}</button>`:''}</div><div class="actions"><button class="btn secondary" id="back" ${state.index===0&&state.section==='preference'?'disabled':''}>${tx.back}</button><button class="btn" id="next">${isLastQuestion()?tx.finish:tx.next}</button></div>`;

function calculate(){let sums={U:0,S:0,A:0},counts={U:0,S:0,A:0},indicators={};BANK.preference.forEach(it=>{let r=state.responses[it.id];if(!r?.ranks)return;it.options.forEach(o=>{sums[o.code]+=r.ranks[o.code];counts[o.code]++;let k=`${o.code}:${o.indicator}`;indicators[k]??={sum:0,n:0};indicators[k].sum+=r.ranks[o.code];indicators[k].n++})});let core={};Object.keys(sums).forEach(c=>{let avg=sums[c]/counts[c];core[c]={avgRank:avg,index:(avg-1)/2*100}});let socialN=0,socialTotal=0,byProcess={};BANK.social.forEach(it=>{let r=state.responses[it.id];if(!r?.choice)return;socialTotal++;byProcess[it.process]??={social:0,total:0};byProcess[it.process].total++;if(r.choice==='SOC'){socialN++;byProcess[it.process].social++}});let socialIndex=socialTotal?socialN/socialTotal*100:0;let needSums={},needCounts={};BANK.environmentNeeds.forEach(it=>{let r=state.responses[it.id];if(!r?.ranks)return;it.options.forEach(o=>{needSums[o.code]=(needSums[o.code]||0)+r.ranks[o.code];needCounts[o.code]=(needCounts[o.code]||0)+1})});let needIndices={};Object.keys(needSums).forEach(c=>{let n=needCounts[c]||1;needIndices[c]=((needSums[c]-n)/(3*n))*100});let needRank=Object.entries(needSums).sort((a,b)=>b[1]-a[1]);let pairs={};BANK.flex.forEach(it=>{let r=state.responses[it.id];if(!r?.choice)return;(pairs[it.pair]??=[]).push({id:it.id,condition:it.condition,parameter:it.parameter,choice:r.choice})});let shiftCount=0;Object.values(pairs).forEach(a=>{if(a.length===2&&a[0].choice!==a[1].choice)shiftCount++});let lat=[];Object.values(state.responses).forEach(r=>{if(r.latencyMs)lat.push(r.latencyMs)});lat.sort((a,b)=>a-b);let med=lat.length?(lat[Math.floor((lat.length-1)/2)]):null;let topPos=[0,0,0,0];BANK.preference.forEach(it=>{let r=state.responses[it.id];if(r?.selectedPositions?.length)topPos[r.selectedPositions[0]]++});return {core,social:{socialN,total:socialTotal,index:socialIndex,byProcess},needs:{sums:needSums,counts:needCounts,indices:needIndices,rank:needRank},flex:{pairs,shiftCount,totalPai function approachPage(num,c,score,top,second){let cls={U:'green',S:'gold',A:'orange'}[c],color=constructColor(c);return reportPage(num,cls,`${esc(constructName(c))} — ${score.toFixed(0)}`,`
 <div class="score-hero"><div class="score-number" style="background:${color}">${score.toFixed(0)}</div><div><div class="report-summary-badge">${rankLabel(c,top,second)}</div><h2>${rtl?'ماذا قد يعني هذا لك؟':'What this may mean for you'}</h2><p>${esc(rankRelationship(c,top,second))}</p></div></div>
 <p class="big-statement">${esc(practicalMeaning(c))}</p>
 <div class="report-columns"><div class="report-box"><h3>${rtl?'متى قد يساعدك هذا؟':'When this may help'}</h3><p>${esc(helpText(c))}</p></div><div class="report-box"><h3>${rtl?'إشارة تستحق الانتباه':'A signal to notice'}</h3><p>${c==='U'?(rtl?'قد تكون لديك بالفعل معلومات كافية، لكنك ما زلت تبحث عن مزيد من اليقين.': 'You may already have enough information, but still find yourself looking for more certainty.'):c==='S'?(rtl?'قد يكون ما ينقص الموقف ليس مزيدًا من الفهم، بل وضوح الأولويات أو المسؤوليات أو الخطوة التالية.':'What the situation needs may not be more understanding, but clearer priorities, ownership, or next steps.'):(rtl?'قد لا تحتاج بعض المواقف إلى الصورة الكاملة قبل أن تبدأ خطوة مفيدة وآمنة.':'Some situations may not require the full picture before a useful, safe first step can begin.')}</p></div></div>
 <div class="report-callout ${cls==='green'?'soft-green':cls==='gold'?'soft-gold':'soft-orange'}"><strong>${rtl?'سؤال مفيد لك':'A useful question'}</strong><p style="font-size:1.08rem;font-weight:800;margin-bottom:0">${esc(signalText(c))}</p></div>`)}
function socialSignal(byProcess){let entries=Object.entries(byProcess||{}).map(([p,o])=>({p,rate:o.total?o.social/o.total:0,social:o.social,total:o.total}));if(!entries.length)return '';
 let max=Math.max(...entries.map(x=>x.rate)),min=Math.min(...entries.map(x=>x.rate));
 if(Math.abs(max-min)<.001)return rtl?'إشراك الآخرين ظهر بدرجة متشابهة عبر فهم الموقف وتنظيم العمل وبدء العمل.':'Involving others appeared at a similar level across understanding, structuring, and starting action.';
 let hi=entries.filter(x=>Math.abs(x.rate-max)<.001).map(x=>socialProcessShort(x.p));let lo=entries.filter(x=>Math.abs(x.rate-min)<.001).map(x=>socialProcessShort(x.p));
 let join=(arr)=>rtl?arr.join(' و '):arr.join(' and ');
 return rtl?`كنت أكثر ميلًا لإشراك الآخرين أثناء ${join(hi)}، وأقل ميلًا أثناء ${join(lo)}.`:`You were more likely to involve others during ${join(hi)}, and less likely during ${join(lo)}.`}
function socialQuestion(byProcess){let entries=Object.entries(byProcess||{}).map(([p,o])=>({p,rate:o.total?o.social/o.total:0}));if(!entries.length)return rtl?'متى يضيف إشراك الآخرين قيمة فعلية للعمل؟':'When does involving others add real value to the work?';let min=Math.min(...entries.map(x=>x.rate));let low=entries.filter(x=>Math.abs(x.rate-min)<.001).map(x=>x.p);if(low.length!==1)return rtl?'هل تدخل الأشخاص المناسبين في المرحلة التي يحتاجهم فيها العمل فعلًا؟':'Are you bringing the right people in at the stage where the work genuinely needs them?';const q={understanding:{ar:'عندما تحتاج إلى فهم الموقف، هل تدخل الأشخاص الذين يملكون المعلومات أو وجهات النظر المهمة في الوقت المناسب؟',en:'When you need to understand the situation, are you bringing in the people who hold important information or perspectives at the right time?'},structuring:{ar:'عندما تحدد الأدوار أو المسؤوليات أو الأولويات، هل تنظمها غالبًا بنفسك أم تشرك الأشخاص الذين سيتأثرون بها؟',en:'When roles, responsibilities, or priorities are being set, do you mainly structure them yourself, or involve the people who will work within that structure?'},action:{ar:'عندما يحين وقت البدء، هل تدخل الأشخاص اللازمين للتنفيذ في الوقت المناسب؟',en:'When it is time to start, are the people needed for execution brought in at the right time?'}};return q[low[0]][lang]}
function differentPrioritiesHint(top){const x={
 U:{ar:'أنت تميل أكثر إلى الفهم أولًا. شخص يعطي تنظيم العمل أولوية أعلى قد يريد الأولويات والأدوار والخطوات التالية بصورة أوضح وأسرع. وشخص يعطي بدء العمل أولوية أعلى قد يكون مستعدًا للحركة بمجرد أن يرى أن المعلومات كافية.',en:'You are more likely to prioritize understanding first. Someone who prioritizes Structuring may want clearer priorities, roles, and next steps sooner. Someone who prioritizes Starting Action may be ready to move once they believe enough is known.'},
 S:{ar:'أنت تميل أكثر إلى التنظيم أولًا. شخص يعطي فهم الموقف أولوية أعلى قد يحتاج إلى معلومات أو تفسير أكثر قبل قبول الخطة. وشخص يعطي بدء العمل أولوية أعلى قد يرغب في الانتقال إلى التنفيذ بمجرد وجود قدر كافٍ من الوضوح.',en:'You are more likely to prioritize structuring first. Someone who prioritizes Understanding may want more context or evidence before accepting the plan. Someone who prioritizes Starting Action may want to move once there is enough structure to begin.'},
 A:{ar:'أنت تميل أكثر إلى البدء بالفعل. شخص يعطي فهم الموقف أولوية أعلى قد يريد التحقق من معلومات مهمة قبل الحركة. وشخص يعطي تنظيم العمل أولوية أعلى قد يحتاج إلى وضوح أكبر في الأولويات والأدوار قبل البدء.',en:'You are more likely to prioritize starting action first. Someone who prioritizes Understanding may want to check important information before moving. Someone who prioritizes Structuring may want clearer priorities and roles before starting.'}};return x[top][lang]}

function renderReport(){
 let sc=state.scores||calculate(), sorted=Object.entries(sc.core).sort((a,b)=>b[1].index-a[1].index);let top=sorted[0][0],second=sorted[1][0],low=sorted[2][0];
 let topName=constructName(top),secondName=constructName(second),lowName=constructName(low),arrows=rtl?'←':'→';
 let fixedCore=['U','S','A'];
 let resultCards=fixedCore.map(c=>{let v=sc.core[c].index;return `<div class="score-card" style="border-top:5px solid ${constructColor(c)}"><div class="name"><span class="color-dot" style="background:${constructColor(c)}"></span> ${esc(constructName(c))}</div><div class="value">${v.toFixed(0)}</div><div>${rankLabel(c,top,second)}</div></div>`}).join('');
 let sequence=`<div class="profile-sequence"><span class="sequence-chip" style="--chip-color:${constructColor(top)}">${esc(topName)}</span><span class="sequence-arrow">${arrows}</span><span class="sequence-chip" style="--chip-color:${constructColor(second)}">${esc(secondName)}</span><span class="sequence-arrow">${arrows}</span><span class="sequence-chip" style="--chip-color:${constructColor(low)}">${esc(lowName)}</span></div>`;
 let page1=reportPage(1,'navy',rtl?'نتائجك الرئيسية':'Your Main Results',`
 <div class="report-grid">${resultCards}</div>
 <p class="big-statement">${rtl?`أعطيت أكبر أولوية لـ <strong>${esc(topName)}</strong>، ثم <strong>${esc(secondName)}</strong>. وكان <strong>${esc(lowName)}</strong> أقل احتمالًا أن يأتي أولًا في اختياراتك.`:`You gave the greatest priority to <strong>${esc(topName)}</strong>, followed by <strong>${esc(secondName)}</strong>. <strong>${esc(lowName)}</strong> was less likely to come first in your responses.`}</p>
 <div class="report-callout"><strong>${rtl?'نمطك العام':'Your overall pattern'}</strong><h2 style="margin-top:7px">${esc(ledLabel(top))}</h2>${sequence}<p>${rtl?'هذه هي الصورة العامة التي ظهرت في إجاباتك. الصفحات التالية توضح ماذا قد تعني لك في العمل.':'This is the overall picture that appeared in your responses. The next pages show what it may mean for you at work.'}</p></div>`);
 let p2=approachPage(2,'U',sc.core.U.index,top,second),p3=approachPage(3,'S',sc.core.S.index,top,second),p4=approachPage(4,'A',sc.core.A.index,top,second);
 let page5=reportPage(5,'navy',rtl?'نمط استجابتك':'Your Response Pattern',`
 <div class="report-summary-badge">${esc(ledLabel(top))}</div>
 ${sequence}
 <p class="big-statement">${rtl?`في هذه النتائج، كان <strong>${esc(topName)}</strong> نقطة البداية الأبرز لديك، يليه <strong>${esc(secondName)}</strong>، ثم <strong>${esc(lowName)}</strong>.`:`In these results, <strong>${esc(topName)}</strong> was your clearest starting priority, followed by <strong>${esc(secondName)}</strong>, then <strong>${esc(lowName)}</strong>.`}</p>
 <div class="report-callout"><strong>${rtl?'الشيء المهم الآن':'What matters now'}</strong><p>${rtl?'هل يظهر هذا النمط فعلًا في عملك؟ ومتى يساعدك؟ ومتى يحتاج الموقف منك أن تبدأ بطريقة مختلفة؟ سنختبر ذلك على أمثلة حقيقية في الكوتشنغ.':'Does this pattern actually show up in your work? When does it help, and when does the situation need you to start differently? You will test this against real examples in coaching.'}</p></div>`);
 let socialBreak=Object.entries(sc.social.byProcess||{}).map(([p,o])=>`<div class="social-process"><div>${esc(socialProcessName(p))}</div><div class="process-count">${o.social}/${o.total}</div></div>`).join('');
 let page6=reportPage(6,'blue',rtl?'العمل مع الآخرين':'Working With Others',`
 <div class="count-hero"><div class="count-number" style="background:${constructColor('SOC')}">${sc.social.socialN} / ${sc.social.total}</div><div><h2>${rtl?'أين أدخلت الآخرين في طريقة عملك؟':'Where did you bring others into your work?'}</h2><p>${rtl?`في ${sc.social.socialN} من أصل ${sc.social.total} مواقف، اخترت استجابة أدخلت أشخاصًا آخرين مباشرة في طريقة التعامل مع العمل.`:`In ${sc.social.socialN} of ${sc.social.total} situations, you chose a response that directly brought other people into how the work was handled.`}</p></div></div>
 <div class="social-breakdown">${socialBreak}</div>
 <div class="report-callout soft-blue"><strong>${rtl?'إشارة تستحق الانتباه':'A signal to notice'}</strong><p>${esc(socialSignal(sc.social.byProcess))}</p><p style="font-weight:800">${esc(socialQuestion(sc.social.byProcess))}</p></div>`);
 let pairCards='';Object.entries(sc.flex.pairs||{}).sort().forEach(([p,a])=>{a=[...a].sort((x,y)=>x.id.localeCompare(y.id));if(a.length<2)return;let changed=a[0].choice!==a[1].choice;pairCards+=`<div class="flex-pair-card"><div class="flex-pair-title"><h3>${esc(pairName(p))}</h3><span class="status-pill ${changed?'changed':''}">${changed?(rtl?'تغيّر اختيارك':'Your response changed'):(rtl?'بقي اختيارك نفسه':'Your response stayed the same')}</span></div>${a.map(x=>`<div class="condition-row"><div>${esc(flexContext(p,x.condition))}</div><div><span class="choice-tag" style="--tag-color:${constructColor(x.choice)}"><span class="color-dot" style="background:${constructColor(x.choice)}"></span>${esc(constructName(x.choice))}</span></div></div>`).join('')}</div>`});
 let page7=reportPage(7,'navy',rtl?'عندما يتغير الموقف':'When the Situation Changes',`
 <p class="big-statement">${rtl?`تغيّر اختيارك في <strong>${sc.flex.shiftCount}</strong> من أصل <strong>${sc.flex.totalPairs}</strong> مقارنات عندما تغيّر جزء مهم من الموقف.`:`Your choice changed in <strong>${sc.flex.shiftCount}</strong> of <strong>${sc.flex.totalPairs}</strong> comparisons when an important part of the situation changed.`}</p>
 ${pairCards}
 <div class="report-callout"><strong>${rtl?'إشارة تستحق الانتباه':'A signal to notice'}</strong><p style="font-size:1.08rem;font-weight:800">${rtl?'ما الذي يحتاجه هذا الموقف مني أولًا؟':'What does this situation need from me first?'}</p></div>`);
 let page8=reportPage(8,'navy',rtl?'استخدام نتائجك':'Using Your Results',`
 <div class="development-map"><div class="dev-card"><strong>${rtl?'اعرف نفسك':'Know Yourself'}</strong>${rtl?'اعرف ما الذي تميل إلى إعطائه الأولوية أولًا.':'Recognize what you naturally tend to prioritize first.'}</div><div class="dev-card"><strong>${rtl?'اقرأ الموقف':'Read the Situation'}</strong>${rtl?'لاحظ متى يناسب أسلوبك المعتاد الموقف، ومتى قد يحتاج الموقف إلى بداية مختلفة.':'Notice when your usual approach fits and when the situation may need a different starting point.'}</div><div class="dev-card"><strong>${rtl?'اعمل مع الاختلاف':'Work With Different Priorities'}</strong>${rtl?'تذكّر أن الآخرين قد يحتاجون إلى فهم أو تنظيم أو بدء أو إشراك الآخرين في وقت مختلف عنك.':'Remember that other people may need understanding, structure, action, or involvement at a different stage than you do.'}</div></div>
 <div class="report-callout soft-blue"><h2>${rtl?'عندما تعمل مع أشخاص يختلفون عنك':'When you work with people who approach work differently'}</h2><p>${esc(differentPrioritiesHint(top))}</p><p>${rtl?'وقد يفضّل شخص آخر إشراك الناس في مرحلة مختلفة من العمل. الاختلاف ليس بالضرورة خطأ؛ المهم أن تعرف ما يحتاجه العمل وما يحتاجه الشخص الآخر منك.':'Another person may also prefer involving people at a different stage of the work. Different does not necessarily mean wrong; the important question is what the work and the other person need from you.'}</p></div>
 <h2>${rtl?'ما الخطوة التالية؟':'What Comes Next?'}</h2>
 <p class="big-statement">${rtl?'الكوتشنغ':'Coaching'}</p>
 <p>${rtl?'هذا التقرير يعطيك صورة أولية. في جلسة الكوتشنغ ستراجع أمثلة حقيقية من عملك للتأكد مما ينطبق عليك فعلًا، وأين يساعدك نمطك، وأين قد تحتاج إلى التكيف، وكيف تعمل مع أشخاص تختلف أولوياتهم عن أولوياتك.':'This report gives you a starting picture. In coaching, you will use real examples from your work to check what actually fits you, where your pattern helps, where you may need to adjust, and how to work with people whose priorities differ from yours.'}</p>
 <div class="report-callout"><strong>${rtl?'الهدف':'The goal'}</strong><p>${rtl?'أن تنتقل من «هذا هو نمطي» إلى «أعرف متى يساعدني، ومتى أحتاج إلى التكيف، وكيف أعمل بفاعلية مع أشخاص يتعاملون مع الموقف بطريقة مختلفة».':'Move from “This is my pattern” to “I know when it helps me, when I may need to adjust, and how to work effectively with people who approach the same situation differently.”'}</p></div>`);
 app.innerHTML=`<div class="report-head"><div class="section-kicker">${esc(state.profile.code)} · ${esc(state.profile.occasion)}</div><h1>${rtl?'تقرير أسلوبك في العمل':'Your Work Approach Report'}</h1><p>${rtl?'نتائجك الرئيسية، ونمط استجابتك، وكيف تعمل مع الآخرين، وكيف يتغير اختيارك مع الموقف.':'Your main results, response pattern, how you work with others, and how your choices change with the situation.'}</p></div>${page1}${p2}${p3}${p4}${page5}${page6}${page7}${page8}<div class="report-actions-sticky"><div class="actions" style="margin:0"><button class="btn secondary" onclick="window.print()">${rtl?'طباعة / حفظ PDF':'Print / Save PDF'}</button><button class="btn secondary" id="jsonBtn">${tx.downloadJSON}</button><button class="btn secondary" id="csvBtn">${tx.downloadCSV}</button><button class="btn" id="newBtn">${tx.startOver}</button></div></div>`;
 document.getElementById('jsonBtn').onclick=downloadJSON;document.getElementById('csvBtn').onclick=downloadCSV;document.getElementById('newBtn').onclick=()=>{state=null;renderProfile()}
}

function researchBundle(){return {instrument:BANK.meta,session:state}}
function download(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadJSON(){download(`WPF_${state.profile.code}_${state.profile.occasion}_V17_5.json`,new Blob([JSON.stringify(researchBundle(),null,2)],{type:'application/json'}))}
function csvCell(x){x=x==null?'':String(x);return `"${x.replaceAll('"','""')}"`}
function downloadCSV(){let rows=[['participant_code','occasion','language','instrument_version','section','item_id','presented_order','response','latency_ms','changes']];['preference','social','needs','flex'].forEach(sec=>{state.order[sec].forEach((id,idx)=>{let r=state.responses[id]||{};let resp=r.ranks?JSON.stringify(r.ranks):r.choice||'';rows.push([state.profile.code,state.profile.occasion,state.language,state.version,sec,id,idx+1,resp,r.latencyMs||'',r.changes||0])})});download(`WPF_${state.profile.code}_${state.profile.occasion}_long.csv`,new Blob([rows.map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}))}
function saveCoachPacket(){let packet={savedAt:new Date().toISOString(),profile:state.profile,language:state.language,version:state.version,blueprintVersion:state.blueprintVersion,scores:state.scores,responses:state.responses,order:state.order};let arr=JSON.parse(localStorage.getItem('wpf_v17_coach_packets')||'[]');arr=arr.filter(x=>!(x.profile.code===packet.profile.code&&x.profile.occasion===packet.profile.occasion));arr.unshift(packet);localStorage.setItem('wpf_v17_coach_packets',JSON.stringify(arr));}
BANK=window.WPF_BANK; if(BANK){renderProfile()} else {app.innerHTML=`<div class="notice warn">${rtl?'تعذر تهيئة بنك البنود داخل الصفحة.':'The embedded item bank could not be initialized.'}</div>`}
})();
