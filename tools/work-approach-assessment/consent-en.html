<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consent before assessment | Tamayuz 10X</title><style>body{margin:0;background:#f4f7fa;color:#172033;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe6ee;border-radius:20px;padding:24px;box-shadow:0 18px 55px rgba(34,51,78,.12)}h1{margin:0 0 10px;font-size:1.5rem}p{line-height:1.7;color:#566476}.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0}.check input{width:18px;height:18px;margin-top:5px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.actions a{border:0;border-radius:11px;padding:11px 18px;font:inherit;font-weight:800;text-decoration:none}.primary{background:#182844;color:#fff}.primary:disabled{opacity:.45}.secondary{background:#eef2f6;color:#334155}.links{font-size:.82rem;margin-top:16px}.links a{color:#173f67}</style></head><body><section class="card"><h1>Before you begin</h1><p>This assessment is for reflection and development, not ability testing or diagnosis. Your responses and results may be used, without requiring your name, for quality improvement, tool development, and related analysis.</p><label class="check"><input id="agree" type="checkbox"><span>I have read the information above and agree to participate and to the use of my data for these purposes.</span></label><div class="actions"><button id="start" class="primary" disabled>Agree &amp; Start</button><a class="secondary" href="index.html">I do not agree</a></div><p class="links"><a href="../../privacy-data-use.html" target="_blank" rel="noopener">Privacy &amp; Data Use</a> · <a href="../../terms-of-use.html" target="_blank" rel="noopener">Terms of Use</a></p></section><script>const a=document.getElementById('agree'),s=document.getElementById('start');a.onchange=()=>s.disabled=!a.checked;s.onclick=()=>{sessionStorage.setItem('tamayuz10x-work-consent','accepted');location.href='en.html';};</script></body></html>
