<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>كيف تتعلّم؟ | بصمتك في التعلّم | التميّز 10X</title>
<script src="../../assets/js/auth-config.js"></script>
</head>
<body>
<main style="max-width:720px;margin:10vh auto;padding:24px;font-family:Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.8"><p id="loading">جارٍ فتح التقييم الآمن…</p></main>
<script type="module">
import { loadProtectedAssessment } from '../../assets/js/protected-assessment-loader.js';
const p = new URLSearchParams(location.search);
const explicit = p.get('lang');
const preferred = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
const lang = explicit === 'ar' || explicit === 'en' ? explicit : (/^ar(?:-|$)/i.test(preferred) ? 'ar' : 'en');
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.getElementById('loading').textContent = lang === 'ar' ? 'جارٍ فتح التقييم الآمن…' : 'Opening the secure assessment…';
loadProtectedAssessment('lpp', { lang });
</script>
</body>
</html>
